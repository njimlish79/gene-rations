<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gene-rations | Create Listing</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f5fb;
    color: #222;
}

/* HEADER */

header {
    background: linear-gradient(135deg, #2864e8, #7b2ff7);
    color: white;

    padding: 17px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.header-btn {
    border: none;
    background: rgba(255,255,255,0.18);
    color: white;

    padding: 11px 15px;
    border-radius: 22px;

    font-weight: bold;
    cursor: pointer;
}

/* CONTAINER */

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.back {
    border: none;
    background: none;

    color: #2864e8;
    font-size: 16px;
    font-weight: bold;

    margin-bottom: 15px;
    cursor: pointer;
}

/* CARD */

.card {
    background: white;
    border-radius: 22px;

    padding: 25px;

    box-shadow: 0 6px 25px rgba(0,0,0,0.07);
}

.title {
    font-size: 27px;
    margin-bottom: 7px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

/* FORM */

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;

    font-weight: bold;

    margin-bottom: 8px;
}

input,
select,
textarea {
    width: 100%;

    padding: 14px;

    border: 1px solid #ccc;
    border-radius: 12px;

    font-size: 16px;

    background: white;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #2864e8;
}

/* PRICE */

.price-box {
    position: relative;
}

.price-box span {
    position: absolute;

    left: 14px;
    top: 14px;

    color: #777;
    font-weight: bold;
}

.price-box input {
    padding-left: 55px;
}

/* IMAGE */

.image-upload {
    border: 2px dashed #c9cef0;

    border-radius: 15px;

    padding: 25px;

    text-align: center;

    background: #f8f9ff;
}

.image-upload input {
    border: none;
    padding: 10px;
}

.preview {
    display: none;

    width: 100%;
    max-height: 280px;

    object-fit: cover;

    border-radius: 15px;

    margin-top: 15px;
}

/* SELLER */

.seller-box {
    background: #f2f4ff;

    padding: 15px;

    border-radius: 13px;

    margin-bottom: 20px;
}

.seller-name {
    color: #2864e8;
    font-weight: bold;
}

.seller-email {
    color: #777;
    font-size: 14px;
    margin-top: 4px;
}

/* BUTTON */

.create-btn {
    width: 100%;

    border: none;

    background: #2864e8;
    color: white;

    padding: 16px;

    border-radius: 13px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;
}

.create-btn:hover {
    background: #1756d0;
}

/* MESSAGE */

.message {
    display: none;

    padding: 13px;

    border-radius: 10px;

    margin-bottom: 15px;

    text-align: center;

    font-weight: bold;
}

.error {
    background: #ffe8e8;
    color: #c62828;
}

.success {
    background: #e5f8ea;
    color: #218838;
}

/* MOBILE */

@media(max-width:600px) {

    .logo {
        font-size: 21px;
    }

    .card {
        padding: 20px;
    }

    .title {
        font-size: 24px;
    }
}
</style>
</head>

<body>


<!-- HEADER -->

<header>

    <div class="logo">
        Gene-rations
    </div>

    <button
        class="header-btn"
        onclick="goMarketplace()">

        Marketplace

    </button>

</header>


<main class="container">

    <button
        class="back"
        onclick="goMarketplace()">

        ← Back to Marketplace

    </button>


    <div class="card">

        <h1 class="title">
            Create Listing
        </h1>

        <p class="subtitle">
            Sell a product or offer a service
            to the Gene-rations community.
        </p>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


        <!-- SELLER -->

        <div class="seller-box">

            <div>
                Seller
            </div>

            <div
                id="sellerName"
                class="seller-name">

                Loading...

            </div>

            <div
                id="sellerEmail"
                class="seller-email">

            </div>

        </div>


        <!-- PRODUCT NAME -->

        <div class="form-group">

            <label for="name">
                Product or Service Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="e.g. Laptop Computer"
                maxlength="100"
                required>

        </div>


        <!-- CATEGORY -->

        <div class="form-group">

            <label for="category">
                Category
            </label>

            <select id="category">

                <option value="">
                    Select category
                </option>

                <option value="Technology">
                    💻 Technology
                </option>

                <option value="Fashion">
                    👕 Fashion
                </option>

                <option value="Home">
                    🏠 Home
                </option>

                <option value="Education">
                    📚 Education
                </option>

                <option value="Services">
                    🛠️ Services
                </option>

                <option value="Agriculture">
                    🌱 Agriculture
                </option>

                <option value="Food">
                    🍲 Food
                </option>

                <option value="Health">
                    ❤️ Health
                </option>

                <option value="Automotive">
                    🚗 Automotive
                </option>

                <option value="Other">
                    📦 Other
                </option>

            </select>

        </div>


        <!-- PRICE -->

        <div class="form-group">

            <label for="price">
                Price
            </label>

            <div class="price-box">

                <span>
                    KES
                </span>

                <input
                    type="number"
                    id="price"
                    placeholder="0"
                    min="0"
                    step="1">

            </div>

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                maxlength="1000"
                placeholder="Describe your product or service...">
            </textarea>

        </div>


        <!-- IMAGE -->

        <div class="form-group">

            <label>
                Product Image
            </label>

            <div class="image-upload">

                <div>
                    📷
                </div>

                <p>
                    Add a photo of your product
                </p>

                <input
                    type="file"
                    id="image"
                    accept="image/*">

                <img
                    id="preview"
                    class="preview"
                    alt="Product preview">

            </div>

        </div>


        <!-- CREATE -->

        <button
            class="create-btn"
            onclick="createListing()">

            + Create Listing

        </button>

    </div>

</main>


<script>

/* =====================================
   USER DATA
===================================== */

const user =
    JSON.parse(
        localStorage.getItem("userData")
    );


/* =====================================
   CHECK USER
===================================== */

if (!user) {

    alert(
        "Please log in before creating a listing."
    );

    window.location.href =
        "login.html";
}


/* =====================================
   SHOW SELLER
===================================== */

if (user) {

    document.getElementById(
        "sellerName"
    ).textContent =
        user.fullName ||
        user.name ||
        "Gene-rations Member";


    document.getElementById(
        "sellerEmail"
    ).textContent =
        user.email || "";

}


/* =====================================
   IMAGE PREVIEW
===================================== */

let imageData = "";


document.getElementById(
    "image"
).addEventListener(
    "change",
    function() {

        const file =
            this.files[0];

        if (!file) return;


        /*
           Limit image size while we are
           using localStorage.
        */

        if (
            file.size >
            2 * 1024 * 1024
        ) {

            showMessage(
                "Image must be smaller than 2 MB.",
                "error"
            );

            this.value = "";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                imageData =
                    event.target.result;


                const preview =
                    document.getElementById(
                        "preview"
                    );


                preview.src =
                    imageData;

                preview.style.display =
                    "block";
            };


        reader.readAsDataURL(file);

    }
);


/* =====================================
   CREATE LISTING
===================================== */

function createListing() {

    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const category =
        document.getElementById(
            "category"
        ).value;


    const price =
        document.getElementById(
            "price"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    /* VALIDATION */

    if (!name) {

        showMessage(
            "Please enter a product or service name.",
            "error"
        );

        return;
    }


    if (!category) {

        showMessage(
            "Please select a category.",
            "error"
        );

        return;
    }


    if (
        price === "" ||
        Number(price) < 0
    ) {

        showMessage(
            "Please enter a valid price.",
            "error"
        );

        return;
    }


    if (!description) {

        showMessage(
            "Please enter a description.",
            "error"
        );

        return;
    }


    /* =================================
       GET EXISTING LISTINGS
    ================================= */

    let listings =
        JSON.parse(
            localStorage.getItem(
                "marketplaceListings"
            )
        ) || [];


    /* =================================
       CREATE UNIQUE ID
    ================================= */

    const productId =
        "product_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 8);


    /* =================================
       CREATE LISTING OBJECT
    ================================= */

    const listing = {

        id: productId,

        name: name,

        category: category,

        price: Number(price),

        description: description,

        image: imageData,

        seller:
            user.fullName ||
            user.name ||
            "Gene-rations Member",

        sellerEmail:
            user.email || "",

        generation:
            user.generation || "",

        createdAt:
            new Date().toISOString()

    };


    /* =================================
       SAVE
    ================================= */

    listings.push(listing);


    localStorage.setItem(
        "marketplaceListings",
        JSON.stringify(listings)
    );


    /* =================================
       SUCCESS
    ================================= */

    showMessage(
        "Listing created successfully!",
        "success"
    );


    /* =================================
       OPEN PRODUCT AFTER SHORT DELAY
    ================================= */

    setTimeout(
        function() {

            window.location.href =
                "product-details.html?id=" +
                encodeURIComponent(
                    productId
                );

        },
        1000
    );

}


/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================
   MARKETPLACE
===================================== */

function goMarketplace() {

    window.location.href =
        "marketplace.html";

}

</script>

</body>
</html>
