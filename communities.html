<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gene-rations | Communities</title>

<style>

/* ==========================================
   RESET
========================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f3ff;
    color: #2d174f;
    min-height: 100vh;
}


/* ==========================================
   HEADER
========================================== */

.header {
    background: linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    color: white;

    padding: 18px 22px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    position: sticky;
    top: 0;

    z-index: 100;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header-btn {
    border: none;
    background: rgba(255,255,255,0.18);
    color: white;

    padding: 12px 16px;

    border-radius: 30px;

    font-weight: bold;

    cursor: pointer;
}

.header-btn:hover {
    background: rgba(255,255,255,0.3);
}


/* ==========================================
   MAIN
========================================== */

.container {
    width: 94%;
    max-width: 1100px;

    margin: auto;

    padding: 25px 0 50px;
}


/* ==========================================
   WELCOME
========================================== */

.welcome-card {
    background: linear-gradient(
        135deg,
        #7c3aed,
        #9333ea
    );

    color: white;

    padding: 28px;

    border-radius: 25px;

    margin-bottom: 22px;

    box-shadow:
        0 12px 30px rgba(70,40,130,0.15);
}

.welcome-card h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.welcome-card p {
    opacity: .9;
}

.generation-badge {
    display: inline-block;

    margin-top: 15px;

    background: rgba(255,255,255,.2);

    padding: 9px 15px;

    border-radius: 25px;

    font-weight: bold;
}


/* ==========================================
   ACTIONS
========================================== */

.actions {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15px;

    margin-bottom: 22px;
}

.action-btn {
    border: none;

    padding: 17px;

    border-radius: 18px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.create-btn {
    background: #7c3aed;
    color: white;
}

.my-btn {
    background: white;
    color: #6d28d9;
}

.action-btn:hover {
    transform: translateY(-1px);
}


/* ==========================================
   SEARCH
========================================== */

.search-box {
    background: white;

    padding: 15px;

    border-radius: 18px;

    margin-bottom: 18px;

    box-shadow:
        0 5px 20px rgba(60,40,100,.07);
}

.search-box input {
    width: 100%;

    border: none;
    outline: none;

    font-size: 16px;

    padding: 10px;
}


/* ==========================================
   FILTERS
========================================== */

.filters {
    display: flex;

    gap: 10px;

    overflow-x: auto;

    padding-bottom: 10px;

    margin-bottom: 20px;
}

.filter-btn {
    border: none;

    background: white;

    padding: 10px 17px;

    border-radius: 25px;

    white-space: nowrap;

    cursor: pointer;

    font-weight: bold;

    color: #555;
}

.filter-btn.active {
    background: #7c3aed;
    color: white;
}


/* ==========================================
   SECTION HEADER
========================================== */

.section-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.section-header h2 {
    font-size: 23px;
}

.community-count {
    color: #777;
}


/* ==========================================
   COMMUNITY GRID
========================================== */

.community-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;
}

.community-card {
    background: white;

    border-radius: 22px;

    padding: 20px;

    box-shadow:
        0 7px 25px rgba(50,30,90,.08);

    cursor: pointer;

    transition: .2s;
}

.community-card:hover {
    transform: translateY(-3px);
}

.community-icon {
    width: 58px;
    height: 58px;

    border-radius: 17px;

    background: #eee7ff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 29px;

    margin-bottom: 15px;
}

.community-card h3 {
    font-size: 19px;

    margin-bottom: 7px;
}

.community-description {
    color: #777;

    line-height: 1.5;

    margin-bottom: 14px;
}

.community-meta {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 8px;

    margin-bottom: 14px;

    color: #777;

    font-size: 14px;
}

.generation-tag {
    background: #f0eaff;

    color: #6d28d9;

    padding: 6px 9px;

    border-radius: 15px;

    font-size: 12px;

    font-weight: bold;
}

.community-actions {
    display: flex;

    gap: 8px;
}

.community-actions button {
    flex: 1;

    border: none;

    padding: 10px;

    border-radius: 12px;

    font-weight: bold;

    cursor: pointer;
}

.open-btn {
    background: #7c3aed;
    color: white;
}

.join-btn {
    background: #eee7ff;
    color: #6d28d9;
}


/* ==========================================
   EMPTY STATE
========================================== */

.empty {
    background: white;

    border-radius: 22px;

    padding: 45px 20px;

    text-align: center;

    color: #777;
}

.empty-icon {
    font-size: 50px;

    margin-bottom: 12px;
}


/* ==========================================
   MODAL
========================================== */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.55);

    z-index: 500;

    padding: 20px;

    align-items: center;
    justify-content: center;
}

.modal.show {
    display: flex;
}

.modal-content {
    background: white;

    width: 100%;

    max-width: 500px;

    max-height: 90vh;

    overflow-y: auto;

    border-radius: 25px;

    padding: 25px;
}

.modal-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;
}

.close-btn {
    border: none;

    background: #eee;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    font-size: 20px;

    cursor: pointer;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-weight: bold;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;

    border: 1px solid #ddd;

    border-radius: 13px;

    padding: 13px;

    font-size: 15px;

    outline: none;
}

.form-group textarea {
    min-height: 100px;

    resize: vertical;
}

.submit-btn {
    width: 100%;

    border: none;

    background: #7c3aed;

    color: white;

    padding: 15px;

    border-radius: 14px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


/* ==========================================
   FOOTER
========================================== */

.footer {
    text-align: center;

    color: #888;

    padding: 30px;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 700px) {

    .header {
        padding: 15px;
    }

    .logo {
        font-size: 21px;
    }

    .header-btn {
        padding: 10px 12px;
        font-size: 13px;
    }

    .actions {
        grid-template-columns: 1fr;
    }

    .community-grid {
        grid-template-columns: 1fr;
    }

    .welcome-card h1 {
        font-size: 24px;
    }
}

</style>
</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

    <div class="logo">
        Gene-rations
    </div>

    <div class="header-right">

        <button
            class="header-btn"
            onclick="goHome()"
        >
            🏠 Generation Hub
        </button>

        <button
            class="header-btn"
            onclick="goProfile()"
        >
            👤
        </button>

    </div>

</header>


<!-- ==========================================
     MAIN
========================================== -->

<main class="container">


    <!-- WELCOME -->

    <section class="welcome-card">

        <h1 id="welcome">
            Welcome to Communities
        </h1>

        <p>
            Connect, discuss ideas and build
            meaningful conversations across
            generations.
        </p>

        <div
            class="generation-badge"
            id="generationBadge"
        >
            Your Generation
        </div>

    </section>


    <!-- ACTIONS -->

    <section class="actions">

        <button
            class="action-btn create-btn"
            onclick="openCreateModal()"
        >
            ＋ Create Discussion Group
        </button>

        <button
            class="action-btn my-btn"
            onclick="showMyCommunities()"
        >
            👥 My Communities
        </button>

    </section>


    <!-- SEARCH -->

    <section class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="🔍 Search communities..."
        >

    </section>


    <!-- FILTERS -->

    <div class="filters">

        <button
            class="filter-btn active"
            data-filter="all"
        >
            All
        </button>

        <button
            class="filter-btn"
            data-filter="generation"
        >
            My Generation
        </button>

        <button
            class="filter-btn"
            data-filter="business"
        >
            💼 Business
        </button>

        <button
            class="filter-btn"
            data-filter="family"
        >
            👨‍👩‍👧 Family
        </button>

        <button
            class="filter-btn"
            data-filter="education"
        >
            📚 Education
        </button>

        <button
            class="filter-btn"
            data-filter="technology"
        >
            💻 Technology
        </button>

        <button
            class="filter-btn"
            data-filter="social"
        >
            💬 Social
        </button>

    </div>


    <!-- SECTION HEADER -->

    <section class="section-header">

        <h2>
            Communities
        </h2>

        <span
            class="community-count"
            id="communityCount"
        >
            0 communities
        </span>

    </section>


    <!-- COMMUNITY LIST -->

    <section
        class="community-grid"
        id="communityGrid"
    ></section>


</main>


<footer class="footer">

    Gene-rations © 2026

</footer>


<!-- ==========================================
     CREATE COMMUNITY MODAL
========================================== -->

<div
    class="modal"
    id="createModal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Create Discussion Group
            </h2>

            <button
                class="close-btn"
                onclick="closeCreateModal()"
            >
                ×
            </button>

        </div>


        <form id="communityForm">


            <div class="form-group">

                <label>
                    Community Name
                </label>

                <input
                    type="text"
                    id="communityName"
                    placeholder="e.g. Generation X Entrepreneurs"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="communityDescription"
                    placeholder="What is this community about?"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <select
                    id="communityCategory"
                    required
                >

                    <option value="social">
                        💬 Social
                    </option>

                    <option value="business">
                        💼 Business
                    </option>

                    <option value="family">
                        👨‍👩‍👧 Family
                    </option>

                    <option value="education">
                        📚 Education
                    </option>

                    <option value="technology">
                        💻 Technology
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Community Type
                </label>

                <select id="communityType">

                    <option value="generation">
                        My Generation
                    </option>

                    <option value="all">
                        All Generations
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Create Community
            </button>


        </form>

    </div>

</div>



<script>

/* ==========================================
   USER DATA
========================================== */

let userData =
    JSON.parse(
        localStorage.getItem("userData")
    );


/* ==========================================
   LOGIN CHECK
========================================== */

if (!userData) {

    window.location.href =
        "login.html";

}


/* ==========================================
   USER GENERATION
========================================== */

const userGeneration =
    userData?.generation ||
    "Unknown";


/* ==========================================
   GENERATION DISPLAY
========================================== */

document.getElementById(
    "welcome"
).textContent =
    `Welcome, ${
        userData?.fullName ||
        "Gene-rations Member"
    }`;

document.getElementById(
    "generationBadge"
).textContent =
    `🏷️ ${userGeneration}`;


/* ==========================================
   STORAGE KEY
========================================== */

const COMMUNITY_STORAGE_KEY =
    "geneRationsCommunities";


/* ==========================================
   LOAD COMMUNITIES
========================================== */

let communities =
    JSON.parse(
        localStorage.getItem(
            COMMUNITY_STORAGE_KEY
        )
    ) || [];


/* ==========================================
   CREATE STARTER COMMUNITIES
   ONLY IF NONE EXIST
========================================== */

if (communities.length === 0) {

    communities = [

        {
            id: "community_" + Date.now() + "_1",

            name:
                `${userGeneration} Community`,

            description:
                `A discussion space for ${
                    userGeneration
                } members to connect,
                share ideas and support one another.`,

            category:
                "social",

            type:
                "generation",

            generation:
                userGeneration,

            icon:
                "👥",

            creator:
                "Gene-rations",

            creatorId:
                "system",

            members:
                [],

            discussions:
                [],

            createdAt:
                new Date().toISOString()
        },

        {
            id: "community_" + Date.now() + "_2",

            name:
                "Gene-rations Business Network",

            description:
                "Discuss entrepreneurship, business ideas, opportunities and professional growth.",

            category:
                "business",

            type:
                "all",

            generation:
                "All Generations",

            icon:
                "💼",

            creator:
                "Gene-rations",

            creatorId:
                "system",

            members:
                [],

            discussions:
                [],

            createdAt:
                new Date().toISOString()
        },

        {
            id:
                "community_" + Date.now() + "_3",

            name:
                "Family & Generations",

            description:
                "A place to discuss family connections, traditions and relationships between generations.",

            category:
                "family",

            type:
                "all",

            generation:
                "All Generations",

            icon:
                "👨‍👩‍👧",

            creator:
                "Gene-rations",

            creatorId:
                "system",

            members:
                [],

            discussions:
                [],

            createdAt:
                new Date().toISOString()
        }

    ];


    saveCommunities();

}


/* ==========================================
   SAVE COMMUNITIES
========================================== */

function saveCommunities() {

    localStorage.setItem(
        COMMUNITY_STORAGE_KEY,
        JSON.stringify(communities)
    );

}


/* ==========================================
   RENDER COMMUNITIES
========================================== */

function renderCommunities(
    filter = "all",
    search = ""
) {

    const grid =
        document.getElementById(
            "communityGrid"
        );

    grid.innerHTML = "";


    const searchTerm =
        search.toLowerCase().trim();


    let filtered =
        communities.filter(
            function (community) {

                const matchesSearch =

                    community.name
                        .toLowerCase()
                        .includes(searchTerm)

                    ||

                    community.description
                        .toLowerCase()
                        .includes(searchTerm);


                if (!matchesSearch) {

                    return false;

                }


                if (filter === "all") {

                    return true;

                }


                if (
                    filter ===
                    "generation"
                ) {

                    return (
                        community.generation ===
                        userGeneration
                    );

                }


                return (
                    community.category ===
                    filter
                );

            }
        );


    document.getElementById(
        "communityCount"
    ).textContent =
        `${filtered.length} ${
            filtered.length === 1
                ? "community"
                : "communities"
        }`;


    if (filtered.length === 0) {

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                <h3>
                    No communities found
                </h3>

                <p>
                    Try another search or
                    create your own discussion group.
                </p>

            </div>

        `;

        return;

    }


    filtered.forEach(
        function (community) {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "community-card";


            const isMember =
                Array.isArray(
                    community.members
                ) &&
                community.members.includes(
                    userData.email
                );


            const memberCount =
                Array.isArray(
                    community.members
                )
                    ? community.members.length
                    : 0;


            card.innerHTML = `

                <div class="community-icon">
                    ${
                        community.icon ||
                        "👥"
                    }
                </div>

                <h3>
                    ${escapeHTML(
                        community.name
                    )}
                </h3>

                <p class="community-description">
                    ${escapeHTML(
                        community.description
                    )}
                </p>

                <div class="community-meta">

                    <span>
                        👥 ${memberCount} members
                    </span>

                    <span class="generation-tag">
                        ${
                            community.generation ||
                            "All Generations"
                        }
                    </span>

                </div>

                <div class="community-actions">

                    <button
                        class="open-btn"
                        onclick="openCommunity('${community.id}')"
                    >
                        Open
                    </button>

                    <button
                        class="join-btn"
                        onclick="toggleMembership(
                            '${community.id}',
                            event
                        )"
                    >
                        ${
                            isMember
                                ? "Leave"
                                : "Join"
                        }
                    </button>

                </div>

            `;


            grid.appendChild(card);

        }
    );

}


/* ==========================================
   OPEN COMMUNITY
========================================== */

function openCommunity(
    communityId
) {

    const community =
        communities.find(
            function (item) {

                return item.id ===
                    communityId;

            }
        );


    if (!community) {

        alert(
            "Community could not be found."
        );

        return;

    }


    /* IMPORTANT:
       Save the exact community ID
       before opening details page.
    */

    localStorage.setItem(
        "selectedCommunityId",
        community.id
    );


    window.location.href =
        "communities-details.html";

}


/* ==========================================
   JOIN / LEAVE COMMUNITY
========================================== */

function toggleMembership(
    communityId,
    event
) {

    if (event) {

        event.stopPropagation();

    }


    const community =
        communities.find(
            function (item) {

                return item.id ===
                    communityId;

            }
        );


    if (!community) {

        return;

    }


    if (!Array.isArray(
        community.members
    )) {

        community.members = [];

    }


    const email =
        userData.email;


    const index =
        community.members.indexOf(
            email
        );


    if (index === -1) {

        community.members.push(
            email
        );

    } else {

        community.members.splice(
            index,
            1
        );

    }


    saveCommunities();

    renderCommunities(
        currentFilter,
        document.getElementById(
            "searchInput"
        ).value
    );

}


/* ==========================================
   CREATE MODAL
========================================== */

function openCreateModal() {

    document.getElementById(
        "createModal"
    ).classList.add("show");

}


function closeCreateModal() {

    document.getElementById(
        "createModal"
    ).classList.remove("show");

}


/* ==========================================
   CREATE COMMUNITY
========================================== */

document.getElementById(
    "communityForm"
).addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        const name =
            document.getElementById(
                "communityName"
            ).value.trim();


        const description =
            document.getElementById(
                "communityDescription"
            ).value.trim();


        const category =
            document.getElementById(
                "communityCategory"
            ).value;


        const type =
            document.getElementById(
                "communityType"
            ).value;


        if (
            !name ||
            !description
        ) {

            return;

        }


        const newCommunity = {

            id:
                "community_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 8),

            name:
                name,

            description:
                description,

            category:
                category,

            type:
                type,

            generation:
                type === "generation"
                    ? userGeneration
                    : "All Generations",

            icon:
                getCategoryIcon(
                    category
                ),

            creator:
                userData.fullName ||
                "Gene-rations Member",

            creatorId:
                userData.email,

            members:
                [
                    userData.email
                ],

            discussions:
                [],

            createdAt:
                new Date().toISOString()

        };


        communities.unshift(
            newCommunity
        );


        saveCommunities();


        document.getElementById(
            "communityForm"
        ).reset();


        closeCreateModal();


        currentFilter =
            "all";


        renderCommunities();


        /* Automatically open
           the new community */

        localStorage.setItem(
            "selectedCommunityId",
            newCommunity.id
        );


        window.location.href =
            "communities-details.html";

    }
);


/* ==========================================
   CATEGORY ICON
========================================== */

function getCategoryIcon(
    category
) {

    const icons = {

        business: "💼",

        family: "👨‍👩‍👧",

        education: "📚",

        technology: "💻",

        social: "💬"

    };


    return (
        icons[category] ||
        "👥"
    );

}


/* ==========================================
   SEARCH
========================================== */

document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    function () {

        renderCommunities(
            currentFilter,
            this.value
        );

    }
);


/* ==========================================
   FILTER
========================================== */

let currentFilter =
    "all";


document.querySelectorAll(
    ".filter-btn"
).forEach(
    function (button) {

        button.addEventListener(
            "click",
            function () {

                document
                    .querySelectorAll(
                        ".filter-btn"
                    )
                    .forEach(
                        function (btn) {

                            btn.classList.remove(
                                "active"
                            );

                        }
                    );


                this.classList.add(
                    "active"
                );


                currentFilter =
                    this.dataset.filter;


                renderCommunities(
                    currentFilter,
                    document.getElementById(
                        "searchInput"
                    ).value
                );

            }
        );

    }
);


/* ==========================================
   MY COMMUNITIES
========================================== */

function showMyCommunities() {

    const grid =
        document.getElementById(
            "communityGrid"
        );


    const myCommunities =
        communities.filter(
            function (community) {

                return (
                    Array.isArray(
                        community.members
                    ) &&
                    community.members.includes(
                        userData.email
                    )
                );

            }
        );


    grid.innerHTML = "";


    document.getElementById(
        "communityCount"
    ).textContent =
        `${myCommunities.length} ${
            myCommunities.length === 1
                ? "community"
                : "communities"
        }`;


    if (myCommunities.length === 0) {

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    👥
                </div>

                <h3>
                    You haven't joined any communities yet.
                </h3>

                <p>
                    Join a community or create your
                    own discussion group.
                </p>

            </div>

        `;

        return;

    }


    myCommunities.forEach(
        function (community) {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "community-card";


            card.innerHTML = `

                <div class="community-icon">
                    ${
                        community.icon ||
                        "👥"
                    }
                </div>

                <h3>
                    ${escapeHTML(
                        community.name
                    )}
                </h3>

                <p class="community-description">
                    ${escapeHTML(
                        community.description
                    )}
                </p>

                <div class="community-meta">

                    <span>
                        👥 ${
                            community.members.length
                        } members
                    </span>

                    <span class="generation-tag">
                        ${
                            community.generation
                        }
                    </span>

                </div>

                <div class="community-actions">

                    <button
                        class="open-btn"
                        onclick="openCommunity(
                            '${community.id}'
                        )"
                    >
                        Open Community
                    </button>

                </div>

            `;


            grid.appendChild(card);

        }
    );

}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value || "";

    return div.innerHTML;

}


/* ==========================================
   NAVIGATION
========================================== */

function goHome() {

    window.location.href =
        "generations.html";

}


function goProfile() {

    window.location.href =
        "profile.html";

}


/* ==========================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================== */

document.getElementById(
    "createModal"
).addEventListener(
    "click",
    function (event) {

        if (
            event.target === this
        ) {

            closeCreateModal();

        }

    }
);


/* ==========================================
   INITIAL LOAD
========================================== */

renderCommunities();


</script>

</body>
</html>
