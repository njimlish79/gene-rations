<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gene-rations Live</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#d32f2f;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.live-badge{
    background:white;
    color:#d32f2f;
    padding:6px 12px;
    border-radius:20px;
    font-weight:bold;
}

.container{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    padding:20px;
}

.stream-section,
.chat-section{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.video-placeholder{
    height:450px;
    background:#222;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    font-size:24px;
}

.stream-info{
    margin-top:20px;
}

.stream-info h2{
    margin-bottom:10px;
}

.stats{
    display:flex;
    gap:20px;
    margin-top:10px;
}

.chat-messages{
    height:400px;
    overflow-y:auto;
    border:1px solid #ddd;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}

.message{
    margin-bottom:10px;
}

.message strong{
    color:#2e7d32;
}

.chat-input{
    display:flex;
    gap:10px;
}

.chat-input input{
    flex:1;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

.send-btn{
    background:#2e7d32;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

.stream-controls{
    margin-top:20px;
    display:flex;
    gap:10px;
}

.control-btn{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    color:white;
}

.start{
    background:#2e7d32;
}

.stop{
    background:#d32f2f;
}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.video-placeholder{
    height:250px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
📡 Gene-rations Live
</div>

<div class="live-badge">
LIVE
</div>

</header>

<div class="container">

<div class="stream-section">

<div class="video-placeholder">
🎥 Live Stream Player
</div>

<div class="stream-info">

<h2>
Connecting Generations Live
</h2>

<p>
Join creators and communities in real-time conversations.
</p>

<div class="stats">

<div>
👀 1,284 Watching
</div>

<div>
❤️ 845 Likes
</div>

<div>
💬 312 Comments
</div>

</div>

<div class="stream-controls">

<button
class="control-btn start"
onclick="startStream()">

Start Stream

</button>

<button
class="control-btn stop"
onclick="stopStream()">

End Stream

</button>

</div>

</div>

</div>

<div class="chat-section">

<h3>Live Chat</h3>

<br>

<div
class="chat-messages"
id="chatMessages">

<div class="message">
<strong>James:</strong>
Hello everyone!
</div>

<div class="message">
<strong>Sarah:</strong>
Greetings from the Millennial Network.
</div>

<div class="message">
<strong>John:</strong>
Excited for today's discussion.
</div>

</div>

<div class="chat-input">

<input
type="text"
id="chatInput"
placeholder="Type a message...">

<button
class="send-btn"
onclick="sendMessage()">

Send

</button>

</div>

</div>

</div>

<script>

function sendMessage(){

const input =
document.getElementById("chatInput");

const text =
input.value.trim();

if(text === ""){
return;
}

const message =
document.createElement("div");

message.className = "message";

message.innerHTML =
"<strong>You:</strong> " + text;

document
.getElementById("chatMessages")
.appendChild(message);

input.value = "";

}

function startStream(){

alert(
"Live stream started successfully."
);

}

function stopStream(){

alert(
"Live stream ended."
);

}

</script>

</body>
</html>
