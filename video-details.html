<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gene-rations | Video</title>


<style>

/* ==========================================
   RESET
========================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family: Arial, sans-serif;

    background: #f5f3fb;

    color: #292238;

    min-height: 100vh;
}


/* ==========================================
   HEADER
========================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    height: 62px;

    padding: 0 16px;

    display: flex;

    align-items: center;

    gap: 12px;

    position: sticky;

    top: 0;

    z-index: 100;
}


.back-button {

    width: 40px;

    height: 40px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,.18);

    color: white;

    font-size: 21px;

    cursor: pointer;
}


.logo {

    flex: 1;

    font-size: 20px;

    font-weight: bold;
}


.hub-button {

    border: none;

    background:
        rgba(255,255,255,.18);

    color: white;

    padding: 9px 13px;

    border-radius: 18px;

    font-weight: bold;

    cursor: pointer;
}


/* ==========================================
   MAIN
========================================== */

.container {

    width: 94%;

    max-width: 1000px;

    margin: auto;

    padding: 20px 0 50px;
}


/* ==========================================
   VIDEO AREA
========================================== */

.video-box {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #111;

    border-radius: 20px;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;
}


.video-box video {

    width: 100%;

    height: 100%;

    object-fit: contain;

    background: #000;
}


.video-placeholder {

    width: 100%;

    height: 100%;

    background:
        linear-gradient(
            135deg,
            #312e81,
            #7c3aed
        );

    color: white;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 10px;

    text-align: center;
}


.video-icon {

    font-size: 65px;
}


/* ==========================================
   VIDEO INFORMATION
========================================== */

.video-card {

    background: white;

    border-radius: 20px;

    padding: 20px;

    margin-top: 15px;

    box-shadow:
        0 5px 20px
        rgba(40,20,80,.06);
}


.video-title {

    font-size: 25px;

    line-height: 1.3;

    margin-bottom: 10px;
}


.video-meta {

    color: #777;

    font-size: 13px;

    display: flex;

    flex-wrap: wrap;

    gap: 14px;

    margin-bottom: 17px;
}


/* ==========================================
   ACTIONS
========================================== */

.actions {

    display: flex;

    flex-wrap: wrap;

    gap: 9px;

    border-top:
        1px solid #eee;

    padding-top: 15px;
}


.action-button {

    border: none;

    background: #f0ebf8;

    color: #49385c;

    padding: 10px 15px;

    border-radius: 20px;

    font-weight: bold;

    cursor: pointer;
}


.action-button.active {

    background: #7c3aed;

    color: white;
}


/* ==========================================
   CREATOR
========================================== */

.creator-card {

    background: white;

    border-radius: 20px;

    padding: 17px;

    margin-top: 15px;

    display: flex;

    align-items: center;

    gap: 12px;

    box-shadow:
        0 5px 20px
        rgba(40,20,80,.06);
}


.creator-photo {

    width: 50px;

    height: 50px;

    min-width: 50px;

    border-radius: 50%;

    background: #ddd6fe;

    color: #5b21b6;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;

    overflow: hidden;
}


.creator-photo img {

    width: 100%;

    height: 100%;

    object-fit: cover;
}


.creator-info {

    flex: 1;
}


.creator-name {

    font-weight: bold;

    margin-bottom: 4px;
}


.creator-generation {

    color: #888;

    font-size: 12px;
}


.profile-button {

    border: none;

    background: #7c3aed;

    color: white;

    padding: 10px 14px;

    border-radius: 14px;

    font-weight: bold;

    cursor: pointer;
}


/* ==========================================
   DESCRIPTION
========================================== */

.section-card {

    background: white;

    border-radius: 20px;

    padding: 20px;

    margin-top: 15px;

    box-shadow:
        0 5px 20px
        rgba(40,20,80,.06);
}


.section-card h2 {

    font-size: 18px;

    margin-bottom: 10px;
}


.description {

    color: #666;

    line-height: 1.6;

    white-space: pre-wrap;
}


/* ==========================================
   COMMENTS
========================================== */

.comment-form {

    display: flex;

    gap: 8px;

    margin-bottom: 15px;
}


.comment-input {

    flex: 1;

    border: 1px solid #ddd;

    outline: none;

    padding: 11px 14px;

    border-radius: 20px;

    font-size: 14px;
}


.comment-input:focus {

    border-color: #7c3aed;
}


.comment-send {

    border: none;

    background: #7c3aed;

    color: white;

    padding: 10px 15px;

    border-radius: 20px;

    font-weight: bold;

    cursor: pointer;
}


.comment {

    display: flex;

    gap: 10px;

    padding: 13px 0;

    border-top: 1px solid #eee;
}


.comment-avatar {

    width: 36px;

    height: 36px;

    min-width: 36px;

    border-radius: 50%;

    background: #ede9fe;

    color: #5b21b6;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 12px;

    font-weight: bold;
}


.comment-body {

    flex: 1;
}


.comment-name {

    font-weight: bold;

    font-size: 13px;

    margin-bottom: 4px;
}


.comment-text {

    color: #666;

    font-size: 14px;

    line-height: 1.4;
}


.comment-time {

    color: #999;

    font-size: 11px;

    margin-top: 4px;
}


/* ==========================================
   EMPTY
========================================== */

.empty {

    background: white;

    border-radius: 20px;

    padding: 60px 20px;

    text-align: center;

    color: #777;
}


.empty-icon {

    font-size: 55px;

    margin-bottom: 12px;
}


.empty h2 {

    color: #3f354a;

    margin-bottom: 8px;
}


.empty button {

    border: none;

    background: #7c3aed;

    color: white;

    padding: 12px 18px;

    border-radius: 14px;

    margin-top: 17px;

    font-weight: bold;

    cursor: pointer;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 600px) {

    .logo {

        font-size: 18px;
    }


    .hub-button {

        font-size: 11px;

        padding: 8px 10px;
    }


    .video-title {

        font-size: 20px;
    }


    .video-card,
    .section-card {

        padding: 16px;
    }


    .creator-card {

        padding: 14px;
    }


    .profile-button {

        padding: 9px 10px;

        font-size: 11px;
    }

}

</style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">


    <button
        class="back-button"
        onclick="goBack()">

        ←

    </button>


    <div class="logo">

        Gene-rations

    </div>


    <button
        class="hub-button"
        onclick="goHub()">

        🏠 Generations Hub

    </button>

</header>



<!-- ==========================================
     CONTENT
========================================== -->

<main class="container">

    <div id="videoPage"></div>

</main>



<script>

/* ==========================================
   USER DATA
========================================== */

const userData =
    JSON.parse(
        localStorage.getItem(
            "userData"
        )
    );


/* ==========================================
   LOGIN CHECK
========================================== */

if (!userData) {

    window.location.href =
        "login.html";

}


/* ==========================================
   VIDEO STORAGE
========================================== */

const VIDEO_KEY =
    "geneRationsVideos";


let videos =
    JSON.parse(
        localStorage.getItem(
            VIDEO_KEY
        )
    ) || [];


/* ==========================================
   SELECTED VIDEO
========================================== */

const selectedVideoId =
    localStorage.getItem(
        "selectedVideoId"
    );


const video =
    videos.find(
        function(item) {

            return String(item.id)
                ===
                String(
                    selectedVideoId
                );

        }
    );


const page =
    document.getElementById(
        "videoPage"
    );


/* ==========================================
   CHECK VIDEO
========================================== */

if (!video) {

    showEmpty();

} else {

    renderVideo();

}


/* ==========================================
   EMPTY STATE
========================================== */

function showEmpty() {

    page.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🎬
            </div>

            <h2>
                Video not found
            </h2>

            <p>
                This video is no longer
                available.
            </p>

            <button
                onclick="goVideos()">

                Back to Videos

            </button>

        </div>

    `;

}


/* ==========================================
   RENDER VIDEO
========================================== */

function renderVideo() {

    const title =
        video.title ||
        "Untitled video";


    const description =
        video.description ||
        "No description provided.";


    const authorName =
        video.authorName ||
        "Gene-rations Member";


    const generation =
        video.generation ||
        "Gene-rations Member";


    const initials =
        getInitials(
            authorName
        );


    page.innerHTML = `

        <!-- VIDEO -->

        <section
            class="video-box"
            id="videoBox">

        </section>


        <!-- INFORMATION -->

        <section
            class="video-card">


            <h1 class="video-title">

                ${escapeHTML(title)}

            </h1>


            <div class="video-meta">

                <span>
                    👁️
                    ${formatNumber(
                        video.views || 0
                    )}
                    views
                </span>


                <span>
                    🕐
                    ${timeAgo(
                        video.createdAt
                    )}
                </span>


                ${
                    video.category

                    ?

                    `<span>
                        📂
                        ${escapeHTML(
                            video.category
                        )}
                    </span>`

                    :

                    ""

                }

            </div>


            <div class="actions">


                <button
                    id="likeButton"
                    class="action-button"
                    onclick="toggleLike()">

                    👍
                    <span
                        id="likeText">

                        Like

                    </span>

                </button>


                <button
                    class="action-button"
                    onclick="shareVideo()">

                    🔗 Share

                </button>


                <button
                    id="saveButton"
                    class="action-button"
                    onclick="toggleSave()">

                    🔖
                    <span
                        id="saveText">

                        Save

                    </span>

                </button>


            </div>

        </section>


        <!-- CREATOR -->

        <section
            class="creator-card">


            <div
                class="creator-photo">

                ${
                    video.authorPhoto

                    ?

                    `<img
                        src="${escapeAttribute(
                            video.authorPhoto
                        )}"
                        alt="Creator">`

                    :

                    initials

                }

            </div>


            <div
                class="creator-info">


                <div
                    class="creator-name">

                    ${escapeHTML(
                        authorName
                    )}

                </div>


                <div
                    class="creator-generation">

                    ${escapeHTML(
                        generation
                    )}

                </div>


            </div>


            <button
                class="profile-button"
                onclick="openCreatorProfile()">

                Profile

            </button>


        </section>


        <!-- DESCRIPTION -->

        <section
            class="section-card">


            <h2>
                About this video
            </h2>


            <div
                class="description">

                ${escapeHTML(
                    description
                )}

            </div>

        </section>


        <!-- COMMENTS -->

        <section
            class="section-card">


            <h2>

                💬 Comments
                (<span id="commentCount">
                    0
                </span>)

            </h2>


            <br>


            <div
                class="comment-form">


                <input
                    id="commentInput"
                    class="comment-input"
                    type="text"
                    placeholder="Write a comment..."
                >


                <button
                    class="comment-send"
                    onclick="addComment()">

                    Send

                </button>

            </div>


            <div
                id="commentsList">

            </div>


        </section>

    `;


    renderPlayer();

    updateLikeButton();

    updateSaveButton();

    renderComments();

}


/* ==========================================
   VIDEO PLAYER
========================================== */

function renderPlayer() {

    const box =
        document.getElementById(
            "videoBox"
        );


    /*
       Gene-rations uploaded video
    */

    if (video.videoUrl) {

        box.innerHTML = `

            <video
                controls
                playsinline
                ${
                    video.thumbnail
                    ?
                    `poster="${escapeAttribute(
                        video.thumbnail
                    )}"`
                    :
                    ""
                }>

                <source
                    src="${escapeAttribute(
                        video.videoUrl
                    )}"
                    type="video/mp4"
                >

                Your browser does not
                support video playback.

            </video>

        `;

        return;

    }


    /*
       If creator has not uploaded
       the actual video yet.
    */

    box.innerHTML = `

        <div class="video-placeholder">

            <div class="video-icon">
                🎬
            </div>

            <strong>
                Video preview
            </strong>

            <span>
                The video will appear here
                after it has been uploaded.
            </span>

        </div>

    `;

}


/* ==========================================
   LIKE
========================================== */

function toggleLike() {

    if (!Array.isArray(video.likes)) {

        video.likes = [];

    }


    const email =
        userData.email;


    const index =
        video.likes.indexOf(
            email
        );


    if (index === -1) {

        video.likes.push(
            email
        );

    } else {

        video.likes.splice(
            index,
            1
        );

    }


    saveVideos();

    updateLikeButton();

}


function updateLikeButton() {

    const button =
        document.getElementById(
            "likeButton"
        );


    const text =
        document.getElementById(
            "likeText"
        );


    if (!button || !text) {

        return;

    }


    const liked =
        Array.isArray(
            video.likes
        )
        &&
        video.likes.includes(
            userData.email
        );


    button.classList.toggle(
        "active",
        liked
    );


    text.textContent =
        liked
        ?
        "Liked"
        :
        "Like";

}


/* ==========================================
   SAVE
========================================== */

function toggleSave() {

    if (
        !Array.isArray(
            userData.savedVideos
        )
    ) {

        userData.savedVideos = [];

    }


    const index =
        userData.savedVideos.indexOf(
            video.id
        );


    if (index === -1) {

        userData.savedVideos.push(
            video.id
        );

    } else {

        userData.savedVideos.splice(
            index,
            1
        );

    }


    localStorage.setItem(
        "userData",
        JSON.stringify(
            userData
        )
    );


    updateSaveButton();

}


function updateSaveButton() {

    const button =
        document.getElementById(
            "saveButton"
        );


    const text =
        document.getElementById(
            "saveText"
        );


    if (!button || !text) {

        return;

    }


    const saved =
        Array.isArray(
            userData.savedVideos
        )
        &&
        userData.savedVideos.includes(
            video.id
        );


    button.classList.toggle(
        "active",
        saved
    );


    text.textContent =
        saved
        ?
        "Saved"
        :
        "Save";

}


/* ==========================================
   SHARE
========================================== */

function shareVideo() {

    const shareText =
        video.title ||
        "Gene-rations video";


    if (
        navigator.share
    ) {

        navigator.share({

            title:
                shareText,

            text:
                "Watch this video on Gene-rations."

        }).catch(
            function() {}
        );

    } else {

        navigator.clipboard
            .writeText(
                shareText
            )
            .then(
                function() {

                    alert(
                        "Video information copied."
                    );

                }
            )
            .catch(
                function() {

                    alert(
                        "Unable to copy."
                    );

                }
            );

    }

}


/* ==========================================
   COMMENTS
========================================== */

function renderComments() {

    const list =
        document.getElementById(
            "commentsList"
        );


    const count =
        document.getElementById(
            "commentCount"
        );


    if (!list) {

        return;

    }


    const comments =
        Array.isArray(
            video.comments
        )
        ?
        video.comments
        :
        [];


    if (count) {

        count.textContent =
            comments.length;

    }


    if (
        comments.length === 0
    ) {

        list.innerHTML = `

            <p
                style="
                    color:#999;
                    text-align:center;
                    padding:20px 0;
                ">

                No comments yet.

            </p>

        `;

        return;

    }


    list.innerHTML = "";


    comments
        .slice()
        .reverse()
        .forEach(
            function(comment) {

                const name =
                    comment.authorName ||
                    "Gene-rations Member";


                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "comment";


                element.innerHTML = `

                    <div
                        class="comment-avatar">

                        ${getInitials(
                            name
                        )}

                    </div>


                    <div
                        class="comment-body">


                        <div
                            class="comment-name">

                            ${escapeHTML(
                                name
                            )}

                        </div>


                        <div
                            class="comment-text">

                            ${escapeHTML(
                                comment.text
                            )}

                        </div>


                        <div
                            class="comment-time">

                            ${timeAgo(
                                comment.createdAt
                            )}

                        </div>


                    </div>

                `;


                list.appendChild(
                    element
                );

            }
        );

}


/* ==========================================
   ADD COMMENT
========================================== */

function addComment() {

    const input =
        document.getElementById(
            "commentInput"
        );


    if (!input) {

        return;

    }


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    if (!Array.isArray(
        video.comments
    )) {

        video.comments = [];

    }


    video.comments.push({

        id:
            "comment-" +
            Date.now(),

        authorName:
            userData.fullName ||
            "Gene-rations Member",

        authorEmail:
            userData.email || "",

        text:
            text,

        createdAt:
            new Date()
                .toISOString()

    });


    saveVideos();


    input.value = "";


    renderComments();

}


/* ==========================================
   CREATOR PROFILE
========================================== */

function openCreatorProfile() {

    if (
        video.authorEmail
    ) {

        localStorage.setItem(

            "selectedProfileEmail",

            video.authorEmail

        );

    }


    window.location.href =
        "profile.html";

}


/* ==========================================
   NAVIGATION
========================================== */

function goBack() {

    window.location.href =
        "videos.html";

}


function goVideos() {

    window.location.href =
        "videos.html";

}


function goHub() {

    window.location.href =
        "generations.html";

}


/* ==========================================
   SAVE VIDEOS
========================================== */

function saveVideos() {

    localStorage.setItem(

        VIDEO_KEY,

        JSON.stringify(
            videos
        )

    );

}


/* ==========================================
   HELPERS
========================================== */

function getInitials(name) {

    return String(
        name || "GM"
    )
    .split(" ")
    .filter(Boolean)
    .slice(0, 2)
    .map(
        function(word) {

            return word
                .charAt(0)
                .toUpperCase();

        }
    )
    .join("");

}


function formatNumber(number) {

    number =
        Number(number) || 0;


    if (number >= 1000000) {

        return (
            number / 1000000
        ).toFixed(1) + "M";

    }


    if (number >= 1000) {

        return (
            number / 1000
        ).toFixed(1) + "K";

    }


    return number;

}


function timeAgo(date) {

    if (!date) {

        return "";

    }


    const timestamp =
        new Date(date)
            .getTime();


    if (isNaN(timestamp)) {

        return "";

    }


    const seconds =
        Math.floor(
            (
                Date.now() -
                timestamp
            ) / 1000
        );


    if (seconds < 60) {

        return "just now";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    if (minutes < 60) {

        return minutes + "m ago";

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if (hours < 24) {

        return hours + "h ago";

    }


    const days =
        Math.floor(
            hours / 24
        );


    if (days < 30) {

        return days + "d ago";

    }


    return Math.floor(
        days / 30
    ) + "mo ago";

}


function escapeHTML(value) {

    const element =
        document.createElement(
            "div"
        );


    element.textContent =
        value || "";


    return element.innerHTML;

}


function escapeAttribute(value) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );

}

</script>


</body>

</html>
