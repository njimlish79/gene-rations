<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gene-rations | Notifications</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f3ff;

    color: #29194d;

    min-height: 100vh;
}


/* ==========================================
   HEADER
========================================== */

.header {

    position: sticky;

    top: 0;

    z-index: 100;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    padding: 17px 20px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}


.logo {

    font-size: 24px;

    font-weight: 800;

    white-space: nowrap;
}


.header-actions {

    display: flex;

    gap: 9px;

    align-items: center;
}


.header-button {

    border: none;

    border-radius: 25px;

    padding: 11px 15px;

    background:
        rgba(255,255,255,0.16);

    color: white;

    font-weight: 700;

    cursor: pointer;
}


.header-button:hover {

    background:
        rgba(255,255,255,0.27);
}


/* ==========================================
   MAIN
========================================== */

.container {

    max-width: 850px;

    margin: auto;

    padding:
        25px
        16px
        50px;
}


/* ==========================================
   TITLE
========================================== */

.page-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 22px;
}


.page-header h1 {

    font-size: 30px;
}


.page-header p {

    margin-top: 6px;

    color: #777;
}


.unread-badge {

    min-width: 42px;

    height: 42px;

    padding: 0 12px;

    border-radius: 50px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #7c3aed;

    color: white;

    font-weight: 800;
}


/* ==========================================
   TOOLBAR
========================================== */

.toolbar {

    background: white;

    padding: 14px;

    border-radius: 18px;

    margin-bottom: 18px;

    display: flex;

    flex-wrap: wrap;

    gap: 9px;

    box-shadow:
        0 6px 20px
        rgba(70,50,120,0.06);
}


.filter-button {

    border: none;

    background: #f0ebff;

    color: #6335a7;

    padding: 10px 15px;

    border-radius: 20px;

    font-weight: 700;

    cursor: pointer;
}


.filter-button.active {

    background: #7c3aed;

    color: white;
}


.mark-read-button {

    margin-left: auto;

    border: none;

    background: #e8f0ff;

    color: #2458bb;

    padding: 10px 15px;

    border-radius: 20px;

    font-weight: 700;

    cursor: pointer;
}


/* ==========================================
   NOTIFICATION LIST
========================================== */

.notification-list {

    display: flex;

    flex-direction: column;

    gap: 12px;
}


.notification {

    background: white;

    border-radius: 20px;

    padding: 17px;

    display: flex;

    gap: 13px;

    align-items: flex-start;

    position: relative;

    box-shadow:
        0 6px 20px
        rgba(70,50,120,0.06);

    transition:
        transform .15s,
        background .15s;
}


.notification:hover {

    transform:
        translateY(-1px);
}


.notification.unread {

    background: #f0eaff;

    border-left:
        4px solid #7c3aed;
}


.notification-icon {

    width: 47px;

    height: 47px;

    min-width: 47px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 21px;

    background: #eee7ff;
}


.notification-content {

    flex: 1;

    min-width: 0;
}


.notification-title {

    font-weight: 800;

    margin-bottom: 5px;
}


.notification-message {

    color: #666;

    line-height: 1.45;

    font-size: 14px;
}


.notification-time {

    color: #999;

    font-size: 12px;

    margin-top: 7px;
}


.notification-actions {

    display: flex;

    gap: 5px;
}


.notification-action {

    border: none;

    background: transparent;

    width: 32px;

    height: 32px;

    border-radius: 50%;

    cursor: pointer;

    color: #777;

    font-size: 16px;
}


.notification-action:hover {

    background: #eee9f8;
}


.unread-dot {

    position: absolute;

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: #7c3aed;

    top: 15px;

    right: 15px;
}


/* ==========================================
   EMPTY STATE
========================================== */

.empty-state {

    background: white;

    border-radius: 25px;

    padding: 55px 25px;

    text-align: center;

    box-shadow:
        0 6px 20px
        rgba(70,50,120,0.06);
}


.empty-icon {

    font-size: 50px;

    margin-bottom: 15px;
}


.empty-state h2 {

    margin-bottom: 8px;
}


.empty-state p {

    color: #777;

    line-height: 1.5;
}


/* ==========================================
   FOOTER
========================================== */

footer {

    text-align: center;

    padding: 25px;

    color: #888;

    font-size: 13px;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 600px) {

    .header {

        padding: 14px;
    }

    .logo {

        font-size: 20px;
    }

    .header-button {

        padding:
            9px 11px;

        font-size: 12px;
    }

    .container {

        padding:
            20px
            12px
            40px;
    }

    .page-header h1 {

        font-size: 26px;
    }

    .mark-read-button {

        margin-left: 0;

        width: 100%;
    }

    .notification {

        padding: 14px;
    }

    .notification-icon {

        width: 42px;

        height: 42px;

        min-width: 42px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="logo">
        Gene-rations
    </div>


    <div class="header-actions">

        <button
            class="header-button"
            id="hubButton">

            🏠 Generation Hub

        </button>


        <button
            class="header-button"
            id="settingsButton">

            ⚙️

        </button>

    </div>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="container">


    <section class="page-header">

        <div>

            <h1>
                Notifications
            </h1>

            <p>
                Stay updated with what is happening
                in your Gene-rations community.
            </p>

        </div>


        <div
            id="unreadCount"
            class="unread-badge">

            0

        </div>

    </section>



    <!-- =====================================
         TOOLBAR
    ====================================== -->

    <section class="toolbar">


        <button
            class="filter-button active"
            data-filter="all">

            All

        </button>


        <button
            class="filter-button"
            data-filter="unread">

            Unread

        </button>


        <button
            class="filter-button"
            data-filter="social">

            Social

        </button>


        <button
            class="filter-button"
            data-filter="community">

            Communities

        </button>


        <button
            class="filter-button"
            data-filter="events">

            Events

        </button>


        <button
            class="mark-read-button"
            id="markAllRead">

            ✓ Mark all as read

        </button>

    </section>



    <!-- =====================================
         NOTIFICATIONS
    ====================================== -->

    <section
        id="notificationList"
        class="notification-list">

    </section>



    <!-- =====================================
         EMPTY STATE
    ====================================== -->

    <section
        id="emptyState"
        class="empty-state"
        style="display:none;">

        <div class="empty-icon">
            🔔
        </div>

        <h2>
            No notifications
        </h2>

        <p>
            You're all caught up.
            New activity will appear here.
        </p>

    </section>


</main>



<footer>

    Gene-rations © 2026

</footer>



<script>

/* ==================================================
   GENE-RATIONS NOTIFICATION ENGINE
================================================== */


/* ================================================
   CURRENT USER
================================================ */

let userData =
    JSON.parse(
        localStorage.getItem("userData")
    );


if (!userData) {

    window.location.href =
        "login.html";

}


/* ================================================
   STORAGE KEY
================================================ */

const notificationKey =
    "geneRationsNotifications";


/* ================================================
   LOAD NOTIFICATIONS
================================================ */

let notifications =
    JSON.parse(
        localStorage.getItem(
            notificationKey
        )
    );


if (!Array.isArray(notifications)) {

    notifications = [];

}


/* ================================================
   MAKE SURE OLD NOTIFICATIONS HAVE DATA
================================================ */

notifications =
    notifications.map(
        function(notification) {

            return {

                id:
                    notification.id ||
                    Date.now() +
                    Math.random(),

                userEmail:
                    notification.userEmail ||
                    userData.email,

                type:
                    notification.type ||
                    "system",

                title:
                    notification.title ||
                    "Gene-rations Update",

                message:
                    notification.message ||
                    "",

                icon:
                    notification.icon ||
                    "🔔",

                createdAt:
                    notification.createdAt ||
                    new Date().toISOString(),

                read:
                    notification.read === true

            };

        }
    );


saveNotifications();


/* ================================================
   CURRENT FILTER
================================================ */

let currentFilter =
    "all";


/* ================================================
   SAVE NOTIFICATIONS
================================================ */

function saveNotifications() {

    localStorage.setItem(
        notificationKey,
        JSON.stringify(
            notifications
        )
    );

}


/* ================================================
   GET CURRENT USER NOTIFICATIONS
================================================ */

function getUserNotifications() {

    return notifications.filter(
        function(notification) {

            return (
                notification.userEmail ===
                userData.email
            );

        }
    );

}


/* ================================================
   CREATE NOTIFICATION
================================================ */

/*
   Other Gene-rations pages can eventually
   use this function.

   Example:

   createNotification({
       type: "social",
       title: "New follower",
       message: "Someone followed you.",
       icon: "👤"
   });
*/

function createNotification(data) {

    const notification = {

        id:
            Date.now() +
            Math.random(),

        userEmail:
            userData.email,

        type:
            data.type ||
            "system",

        title:
            data.title ||
            "Gene-rations Update",

        message:
            data.message ||
            "",

        icon:
            data.icon ||
            "🔔",

        createdAt:
            new Date().toISOString(),

        read:
            false

    };


    notifications.unshift(
        notification
    );


    saveNotifications();


    renderNotifications();

}


/* ================================================
   FORMAT TIME
================================================ */

function formatTime(dateString) {

    const date =
        new Date(dateString);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "Recently";

    }


    const now =
        new Date();


    const difference =
        now.getTime()
        -
        date.getTime();


    const seconds =
        Math.floor(
            difference / 1000
        );


    if (seconds < 60) {

        return "Just now";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    if (minutes < 60) {

        return (
            minutes +
            (minutes === 1
                ? " minute ago"
                : " minutes ago")
        );

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if (hours < 24) {

        return (
            hours +
            (hours === 1
                ? " hour ago"
                : " hours ago")
        );

    }


    const days =
        Math.floor(
            hours / 24
        );


    if (days < 7) {

        return (
            days +
            (days === 1
                ? " day ago"
                : " days ago")
        );

    }


    return date.toLocaleDateString();

}


/* ================================================
   ESCAPE HTML
================================================ */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ================================================
   FILTER NOTIFICATIONS
================================================ */

function getFilteredNotifications() {

    const userNotifications =
        getUserNotifications();


    if (
        currentFilter ===
        "all"
    ) {

        return userNotifications;

    }


    if (
        currentFilter ===
        "unread"
    ) {

        return userNotifications.filter(
            function(notification) {

                return !notification.read;

            }
        );

    }


    return userNotifications.filter(
        function(notification) {

            return (
                notification.type ===
                currentFilter
            );

        }
    );

}


/* ================================================
   RENDER
================================================ */

function renderNotifications() {

    const list =
        document.getElementById(
            "notificationList"
        );


    const emptyState =
        document.getElementById(
            "emptyState"
        );


    list.innerHTML = "";


    const filtered =
        getFilteredNotifications();


    if (
        filtered.length === 0
    ) {

        list.style.display =
            "none";

        emptyState.style.display =
            "block";

    } else {

        list.style.display =
            "flex";

        emptyState.style.display =
            "none";

    }


    filtered.forEach(
        function(notification) {

            const item =
                document.createElement(
                    "article"
                );


            item.className =
                "notification" +
                (
                    notification.read
                        ? ""
                        : " unread"
                );


            item.innerHTML = `

                <div class="notification-icon">
                    ${escapeHTML(
                        notification.icon
                    )}
                </div>


                <div class="notification-content">

                    <div class="notification-title">
                        ${escapeHTML(
                            notification.title
                        )}
                    </div>


                    <div class="notification-message">
                        ${escapeHTML(
                            notification.message
                        )}
                    </div>


                    <div class="notification-time">
                        ${formatTime(
                            notification.createdAt
                        )}
                    </div>

                </div>


                <div class="notification-actions">

                    <button
                        class="notification-action"
                        title="Mark as read"
                        onclick="toggleRead('${notification.id}')">

                        ✓

                    </button>


                    <button
                        class="notification-action"
                        title="Delete"
                        onclick="deleteNotification('${notification.id}')">

                        🗑️

                    </button>

                </div>


                ${
                    notification.read
                    ? ""
                    : `
                        <span class="unread-dot"></span>
                    `
                }

            `;


            list.appendChild(
                item
            );

        }
    );


    updateUnreadCount();

}


/* ================================================
   UPDATE UNREAD COUNT
================================================ */

function updateUnreadCount() {

    const unread =
        getUserNotifications()
            .filter(
                function(notification) {

                    return !notification.read;

                }
            )
            .length;


    document.getElementById(
        "unreadCount"
    ).textContent =
        unread;


    document.title =
        unread > 0
            ? `(${unread}) Notifications | Gene-rations`
            : "Gene-rations | Notifications";

}


/* ================================================
   TOGGLE READ
================================================ */

function toggleRead(id) {

    const notification =
        notifications.find(
            function(item) {

                return String(item.id) ===
                    String(id);

            }
        );


    if (!notification) {
        return;
    }


    notification.read =
        !notification.read;


    saveNotifications();

    renderNotifications();

}


/* ================================================
   DELETE
================================================ */

function deleteNotification(id) {

    notifications =
        notifications.filter(
            function(notification) {

                return String(notification.id) !==
                    String(id);

            }
        );


    saveNotifications();

    renderNotifications();

}


/* ================================================
   MARK ALL READ
================================================ */

document.getElementById(
    "markAllRead"
).addEventListener(
    "click",
    function() {

        notifications.forEach(
            function(notification) {

                if (
                    notification.userEmail ===
                    userData.email
                ) {

                    notification.read =
                        true;

                }

            }
        );


        saveNotifications();

        renderNotifications();

    }
);


/* ================================================
   FILTER BUTTONS
================================================ */

document
    .querySelectorAll(
        ".filter-button"
    )
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".filter-button"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    this.classList.add(
                        "active"
                    );


                    currentFilter =
                        this.dataset.filter;


                    renderNotifications();

                }
            );

        }
    );


/* ================================================
   NAVIGATION
================================================ */

document.getElementById(
    "hubButton"
).addEventListener(
    "click",
    function() {

        window.location.href =
            "generations.html";

    }
);


document.getElementById(
    "settingsButton"
).addEventListener(
    "click",
    function() {

        window.location.href =
            "settings.html";

    }
);


/* ================================================
   SAMPLE NOTIFICATIONS
================================================ */

/*
   We only create examples if this user
   has never received notifications.

   This makes the page easier to test.
*/

function createTestNotifications() {

    const existing =
        getUserNotifications();


    if (
        existing.length > 0
    ) {

        return;

    }


    createNotification({

        type:
            "social",

        title:
            "Welcome to Gene-rations",

        message:
            `Welcome ${userData.fullName || "Member"}! Your Gene-rations journey has started.`,

        icon:
            "🎉"

    });


    createNotification({

        type:
            "community",

        title:
            "Generation community",

        message:
            `Welcome to the ${userData.generation || "Gene-rations"} community.`,

        icon:
            "👥"

    });

}


/* ================================================
   INITIALIZE
================================================ */

renderNotifications();


/*
   Uncomment this while testing if you want
   sample notifications.

   createTestNotifications();
*/


</script>

</body>
</html>
