<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gene-rations | Conversation</title>


<style>

/* ==========================================
   RESET
========================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family: Arial, sans-serif;

    background: #f5f3fb;

    color: #292238;

    min-height: 100vh;

    display: flex;

    flex-direction: column;
}


/* ==========================================
   HEADER
========================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    padding: 14px 18px;

    display: flex;

    align-items: center;

    gap: 12px;

    position: sticky;

    top: 0;

    z-index: 100;
}


.back-btn {

    border: none;

    background:
        rgba(255,255,255,.18);

    color: white;

    width: 40px;

    height: 40px;

    border-radius: 50%;

    font-size: 21px;

    cursor: pointer;
}


.back-btn:hover {

    background:
        rgba(255,255,255,.3);
}


/* ==========================================
   CHAT USER
========================================== */

.chat-user {

    display: flex;

    align-items: center;

    gap: 11px;

    flex: 1;

    min-width: 0;
}


.chat-avatar {

    width: 45px;

    height: 45px;

    min-width: 45px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ddd6fe,
            #c4b5fd
        );

    display: flex;

    align-items: center;

    justify-content: center;

    color: #5b21b6;

    font-weight: bold;

    overflow: hidden;
}


.chat-avatar img {

    width: 100%;

    height: 100%;

    object-fit: cover;
}


.chat-user-info {

    min-width: 0;
}


.chat-user-name {

    font-size: 16px;

    font-weight: bold;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.chat-status {

    font-size: 12px;

    opacity: .85;

    margin-top: 3px;
}


.header-menu {

    border: none;

    background:
        rgba(255,255,255,.18);

    color: white;

    width: 40px;

    height: 40px;

    border-radius: 50%;

    font-size: 20px;

    cursor: pointer;
}


/* ==========================================
   CHAT AREA
========================================== */

.chat-container {

    flex: 1;

    width: 100%;

    max-width: 900px;

    margin: auto;

    display: flex;

    flex-direction: column;

    min-height: 0;
}


.messages-area {

    flex: 1;

    overflow-y: auto;

    padding: 22px 18px 25px;
}


/* ==========================================
   DATE DIVIDER
========================================== */

.date-divider {

    text-align: center;

    margin: 15px 0;

    color: #888;

    font-size: 12px;
}


.date-divider span {

    background: #eae6f2;

    padding: 7px 12px;

    border-radius: 15px;
}


/* ==========================================
   MESSAGE ROW
========================================== */

.message-row {

    display: flex;

    margin-bottom: 12px;
}


.message-row.sent {

    justify-content: flex-end;
}


.message-row.received {

    justify-content: flex-start;
}


/* ==========================================
   MESSAGE BUBBLE
========================================== */

.message-bubble {

    max-width: 75%;

    padding: 11px 14px;

    border-radius: 18px;

    line-height: 1.5;

    font-size: 15px;

    position: relative;

    word-wrap: break-word;
}


.received .message-bubble {

    background: white;

    border-bottom-left-radius: 5px;

    box-shadow:
        0 3px 12px
        rgba(40,20,80,.06);
}


.sent .message-bubble {

    background:
        linear-gradient(
            135deg,
            #6d28d9,
            #7c3aed
        );

    color: white;

    border-bottom-right-radius: 5px;
}


.message-time {

    font-size: 10px;

    opacity: .65;

    margin-top: 5px;

    text-align: right;
}


/* ==========================================
   EMPTY
========================================== */

.empty {

    height: 100%;

    min-height: 350px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: #777;
}


.empty-icon {

    font-size: 50px;

    margin-bottom: 12px;
}


/* ==========================================
   COMPOSER
========================================== */

.composer {

    background: white;

    border-top:
        1px solid #e7e3ee;

    padding: 12px 15px;

    display: flex;

    align-items: flex-end;

    gap: 9px;

    position: sticky;

    bottom: 0;
}


.attach-btn {

    width: 42px;

    height: 42px;

    min-width: 42px;

    border: none;

    background: #f0ecf8;

    color: #643bb2;

    border-radius: 50%;

    font-size: 19px;

    cursor: pointer;
}


.message-input {

    flex: 1;

    border: 1px solid #ddd7e7;

    border-radius: 22px;

    padding: 11px 15px;

    font-size: 15px;

    outline: none;

    resize: none;

    max-height: 120px;

    min-height: 43px;

    font-family: inherit;
}


.message-input:focus {

    border-color: #7c3aed;
}


.send-btn {

    width: 44px;

    height: 44px;

    min-width: 44px;

    border: none;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    font-size: 19px;

    cursor: pointer;
}


.send-btn:disabled {

    opacity: .5;

    cursor: not-allowed;
}


/* ==========================================
   ATTACHMENT MENU
========================================== */

.attach-menu {

    display: none;

    position: absolute;

    bottom: 70px;

    left: 15px;

    background: white;

    border-radius: 17px;

    padding: 8px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.15);
}


.attach-menu.show {

    display: block;
}


.attach-option {

    border: none;

    background: transparent;

    padding: 11px 15px;

    display: block;

    width: 100%;

    text-align: left;

    border-radius: 10px;

    cursor: pointer;
}


.attach-option:hover {

    background: #f4f0fa;
}


/* ==========================================
   MENU
========================================== */

.chat-menu {

    display: none;

    position: fixed;

    right: 15px;

    top: 68px;

    background: white;

    width: 190px;

    border-radius: 17px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.15);

    z-index: 300;

    overflow: hidden;
}


.chat-menu.show {

    display: block;
}


.menu-option {

    width: 100%;

    border: none;

    background: white;

    padding: 14px;

    text-align: left;

    cursor: pointer;

    font-size: 14px;
}


.menu-option:hover {

    background: #f5f2fa;
}


/* ==========================================
   MODAL
========================================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.55);

    z-index: 500;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


.modal.show {

    display: flex;
}


.modal-content {

    background: white;

    width: 100%;

    max-width: 400px;

    border-radius: 22px;

    padding: 24px;
}


.modal-content h2 {

    margin-bottom: 12px;
}


.modal-content p {

    color: #777;

    line-height: 1.5;

    margin-bottom: 20px;
}


.modal-buttons {

    display: flex;

    gap: 10px;
}


.modal-buttons button {

    flex: 1;

    border: none;

    padding: 12px;

    border-radius: 13px;

    font-weight: bold;

    cursor: pointer;
}


.cancel-btn {

    background: #eee;

    color: #333;
}


.confirm-btn {

    background: #dc2626;

    color: white;
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px) {

    .header {

        padding: 12px;
    }


    .message-bubble {

        max-width: 84%;
    }


    .messages-area {

        padding-left: 12px;

        padding-right: 12px;
    }


    .composer {

        padding:
            9px 10px;
    }

}

</style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">


    <button
        class="back-btn"
        onclick="goBack()">

        ←

    </button>


    <div class="chat-user">


        <div
            class="chat-avatar"
            id="chatAvatar">

            👤

        </div>


        <div class="chat-user-info">

            <div
                class="chat-user-name"
                id="chatUserName">

                Loading...

            </div>


            <div
                class="chat-status"
                id="chatStatus">

                Gene-rations member

            </div>

        </div>


    </div>


    <button
        class="header-menu"
        onclick="toggleChatMenu()">

        ⋮

    </button>


</header>



<!-- ==========================================
     CHAT MENU
========================================== -->

<div
    class="chat-menu"
    id="chatMenu">


    <button
        class="menu-option"
        onclick="viewProfile()">

        👤 View Profile

    </button>


    <button
        class="menu-option"
        onclick="clearConversation()">

        🗑️ Clear Conversation

    </button>


    <button
        class="menu-option"
        onclick="closeChatMenu()">

        ✕ Close

    </button>


</div>



<!-- ==========================================
     CHAT
========================================== -->

<main class="chat-container">


    <section
        class="messages-area"
        id="messagesArea">

        <!-- Dynamic messages -->

    </section>


    <!-- ======================================
         COMPOSER
    ======================================= -->

    <div class="composer">


        <button
            class="attach-btn"
            onclick="toggleAttachMenu()">

            ＋

        </button>


        <div
            class="attach-menu"
            id="attachMenu">


            <button
                class="attach-option"
                onclick="chooseAttachment('photo')">

                📷 Photo

            </button>


            <button
                class="attach-option"
                onclick="chooseAttachment('file')">

                📎 File

            </button>


        </div>


        <textarea
            class="message-input"
            id="messageInput"
            placeholder="Write a message..."
            rows="1"
        ></textarea>


        <button
            class="send-btn"
            id="sendButton"
            onclick="sendMessage()">

            ➤

        </button>


    </div>


</main>



<!-- ==========================================
     CLEAR MODAL
========================================== -->

<div
    class="modal"
    id="clearModal">


    <div class="modal-content">

        <h2>
            Clear conversation?
        </h2>


        <p>
            This will remove the messages
            from this conversation on this
            device.
        </p>


        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeClearModal()">

                Cancel

            </button>


            <button
                class="confirm-btn"
                onclick="confirmClearConversation()">

                Clear

            </button>

        </div>

    </div>

</div>



<script>

/* =====================================================
   USER DATA
===================================================== */

let userData =
    JSON.parse(
        localStorage.getItem("userData")
    );


if (!userData) {

    window.location.href =
        "login.html";

}


/* =====================================================
   STORAGE
===================================================== */

const MESSAGE_KEY =
    "geneRationsMessages";


/* =====================================================
   SELECTED CONVERSATION
===================================================== */

const selectedConversationId =
    localStorage.getItem(
        "selectedConversationId"
    );


/* =====================================================
   LOAD ALL MESSAGES
===================================================== */

let messageData =
    JSON.parse(
        localStorage.getItem(
            MESSAGE_KEY
        )
    ) || [];


/* =====================================================
   FIND CONVERSATION
===================================================== */

let conversation =
    messageData.find(
        function(item) {

            return String(
                item.id
            ) ===
            String(
                selectedConversationId
            );

        }
    );


/* =====================================================
   IF CONVERSATION DOES NOT EXIST
===================================================== */

if (!conversation) {

    document.getElementById(
        "chatUserName"
    ).textContent =
        "Conversation unavailable";


    document.getElementById(
        "messagesArea"
    ).innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                💬
            </div>

            <h3>
                Conversation not found
            </h3>

            <p>
                Return to Messages and select
                a conversation.
            </p>

        </div>

    `;

}


/* =====================================================
   OTHER PARTICIPANT
===================================================== */

function getOtherParticipant() {

    if (!conversation) {

        return null;

    }


    const other =
        conversation.participants.find(
            function(participant) {

                return participant !==
                    userData.email;

            }
        );


    if (
        other &&
        typeof other === "object"
    ) {

        return other;

    }


    /*
       Try registered users
    */

    const users =
        JSON.parse(
            localStorage.getItem(
                "geneRationsUsers"
            )
        ) || [];


    const found =
        users.find(
            function(user) {

                return user.email ===
                    other;

            }
        );


    if (found) {

        return found;

    }


    return {

        email:
            other ||
            "Unknown Member",

        fullName:
            other ||
            "Gene-rations Member",

        profilePhoto:
            ""

    };

}


const otherUser =
    getOtherParticipant();



/* =====================================================
   LOAD USER INFORMATION
===================================================== */

function loadChatUser() {

    if (!otherUser) {

        return;

    }


    const name =
        otherUser.fullName ||
        otherUser.name ||
        otherUser.email ||
        "Gene-rations Member";


    document.getElementById(
        "chatUserName"
    ).textContent =
        name;


    document.getElementById(
        "chatStatus"
    ).textContent =

        otherUser.generation

        ?

        otherUser.generation

        :

        "Gene-rations member";


    const avatar =
        document.getElementById(
            "chatAvatar"
        );


    if (
        otherUser.profilePhoto
    ) {

        avatar.innerHTML = `

            <img
                src="${escapeAttribute(
                    otherUser.profilePhoto
                )}"
                alt="Profile"
            >

        `;

    } else {

        avatar.textContent =
            getInitials(
                name
            );

    }

}


/* =====================================================
   SAVE
===================================================== */

function saveMessages() {

    localStorage.setItem(

        MESSAGE_KEY,

        JSON.stringify(
            messageData
        )

    );

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

function loadMessages() {

    const area =
        document.getElementById(
            "messagesArea"
        );


    area.innerHTML = "";


    if (!conversation) {

        return;

    }


    if (
        !Array.isArray(
            conversation.messages
        ) ||
        conversation.messages.length === 0
    ) {

        area.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    👋
                </div>

                <h3>
                    Start the conversation
                </h3>

                <p>
                    Send a message to
                    ${
                        escapeHTML(
                            otherUser?.fullName ||
                            otherUser?.name ||
                            "this member"
                        )
                    }.
                </p>

            </div>

        `;

        return;

    }


    let currentDate = "";


    conversation.messages.forEach(
        function(message) {

            const date =
                new Date(
                    message.createdAt
                );


            const dateString =
                date.toDateString();


            if (
                dateString !==
                currentDate
            ) {

                currentDate =
                    dateString;


                const divider =
                    document.createElement(
                        "div"
                    );


                divider.className =
                    "date-divider";


                divider.innerHTML = `

                    <span>
                        ${
                            formatDate(
                                date
                            )
                        }
                    </span>

                `;


                area.appendChild(
                    divider
                );

            }


            const sent =
                message.sender ===
                userData.email;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                sent
                    ? "message-row sent"
                    : "message-row received";


            row.innerHTML = `

                <div class="message-bubble">

                    <div>

                        ${escapeHTML(
                            message.text ||
                            ""
                        )}

                    </div>


                    <div class="message-time">

                        ${
                            formatTime(
                                message.createdAt
                            )
                        }

                        ${
                            sent
                                ? (
                                    message.read
                                        ? " ✓✓"
                                        : " ✓"
                                  )
                                : ""
                        }

                    </div>

                </div>

            `;


            area.appendChild(
                row
            );


            /*
               Mark received messages
               as read.
            */

            if (!sent) {

                message.read = true;

            }

        }
    );


    saveMessages();


    scrollToBottom();

}


/* =====================================================
   SEND MESSAGE
===================================================== */

function sendMessage() {

    if (!conversation) {

        alert(
            "No conversation selected."
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    if (
        !Array.isArray(
            conversation.messages
        )
    ) {

        conversation.messages = [];

    }


    conversation.messages.push({

        id:
            "message-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,7),

        sender:
            userData.email,

        receiver:
            getOtherEmail(),

        text:
            text,

        createdAt:
            new Date()
                .toISOString(),

        read:
            true

    });


    conversation.updatedAt =
        new Date()
            .toISOString();


    saveMessages();


    input.value = "";

    input.style.height =
        "43px";


    loadMessages();

}


/* =====================================================
   GET OTHER EMAIL
===================================================== */

function getOtherEmail() {

    if (!conversation) {

        return "";

    }


    const other =
        conversation.participants.find(
            function(participant) {

                if (
                    typeof participant ===
                    "object"
                ) {

                    return (
                        participant.email !==
                        userData.email
                    );

                }


                return participant !==
                    userData.email;

            }
        );


    if (
        typeof other ===
        "object"
    ) {

        return other.email || "";

    }


    return other || "";

}


/* =====================================================
   ENTER TO SEND
===================================================== */

document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   AUTO RESIZE TEXTAREA
===================================================== */

document.getElementById(
    "messageInput"
).addEventListener(
    "input",
    function() {

        this.style.height =
            "43px";


        this.style.height =
            Math.min(
                this.scrollHeight,
                120
            ) + "px";

    }
);


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom() {

    const area =
        document.getElementById(
            "messagesArea"
        );


    setTimeout(
        function() {

            area.scrollTop =
                area.scrollHeight;

        },
        50
    );

}


/* =====================================================
   BACK
===================================================== */

function goBack() {

    window.location.href =
        "messages.html";

}


/* =====================================================
   PROFILE
===================================================== */

function viewProfile() {

    if (!otherUser) {

        return;

    }


    /*
       Save the selected person's
       email for the future profile
       system.
    */

    localStorage.setItem(
        "selectedProfileEmail",
        getOtherEmail()
    );


    window.location.href =
        "profile.html";

}


/* =====================================================
   CHAT MENU
===================================================== */

function toggleChatMenu() {

    document.getElementById(
        "chatMenu"
    ).classList.toggle(
        "show"
    );

}


function closeChatMenu() {

    document.getElementById(
        "chatMenu"
    ).classList.remove(
        "show"
    );

}


/* =====================================================
   CLEAR CONVERSATION
===================================================== */

function clearConversation() {

    closeChatMenu();


    document.getElementById(
        "clearModal"
    ).classList.add(
        "show"
    );

}


function closeClearModal() {

    document.getElementById(
        "clearModal"
    ).classList.remove(
        "show"
    );

}


function confirmClearConversation() {

    if (!conversation) {

        return;

    }


    conversation.messages = [];


    conversation.updatedAt =
        new Date()
            .toISOString();


    saveMessages();


    closeClearModal();


    loadMessages();

}


/* =====================================================
   ATTACHMENT MENU
===================================================== */

function toggleAttachMenu() {

    document.getElementById(
        "attachMenu"
    ).classList.toggle(
        "show"
    );

}


function chooseAttachment(
    type
) {

    document.getElementById(
        "attachMenu"
    ).classList.remove(
        "show"
    );


    if (type === "photo") {

        alert(
            "Photo messaging will be connected to the media system later."
        );

    }


    if (type === "file") {

        alert(
            "File messaging will be connected later."
        );

    }

}


/* =====================================================
   UTILITIES
===================================================== */

function getInitials(
    name
) {

    return name
        .split(" ")
        .filter(Boolean)
        .slice(0,2)
        .map(
            function(word) {

                return word
                    .charAt(0)
                    .toUpperCase();

            }
        )
        .join("");

}


function formatTime(
    date
) {

    const d =
        new Date(date);


    if (
        isNaN(
            d.getTime()
        )
    ) {

        return "";

    }


    return d.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function formatDate(
    date
) {

    const d =
        new Date(date);


    if (
        isNaN(
            d.getTime()
        )
    ) {

        return "";

    }


    const today =
        new Date();


    const yesterday =
        new Date();


    yesterday.setDate(
        yesterday.getDate() - 1
    );


    if (
        d.toDateString() ===
        today.toDateString()
    ) {

        return "Today";

    }


    if (
        d.toDateString() ===
        yesterday.toDateString()
    ) {

        return "Yesterday";

    }


    return d.toLocaleDateString(
        [],
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );

}


function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value || "";


    return div.innerHTML;

}


function escapeAttribute(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );

}


/* =====================================================
   CLOSE MENUS WHEN CLICKING OUTSIDE
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "chatMenu"
            );


        const headerMenu =
            document.querySelector(
                ".header-menu"
            );


        if (
            !menu.contains(event.target) &&
            !headerMenu.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }


        const attachMenu =
            document.getElementById(
                "attachMenu"
            );


        const attachButton =
            document.querySelector(
                ".attach-btn"
            );


        if (
            !attachMenu.contains(event.target) &&
            !attachButton.contains(event.target)
        ) {

            attachMenu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

if (conversation) {

    loadChatUser();

    loadMessages();

}

</script>
