<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gene-rations | Messages</title>


<style>

/* ==========================================
   RESET
========================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family: Arial, sans-serif;

    background: #f5f3fb;

    color: #292238;

    min-height: 100vh;
}


/* ==========================================
   HEADER
========================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    padding: 17px 20px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    position: sticky;

    top: 0;

    z-index: 100;
}


.logo {

    font-size: 23px;

    font-weight: bold;
}


.header-actions {

    display: flex;

    gap: 8px;
}


.header-btn {

    border: none;

    background:
        rgba(255,255,255,.18);

    color: white;

    padding: 11px 15px;

    border-radius: 25px;

    font-weight: bold;

    cursor: pointer;
}


.header-btn:hover {

    background:
        rgba(255,255,255,.30);
}


/* ==========================================
   MAIN
========================================== */

.container {

    width: 94%;

    max-width: 850px;

    margin: auto;

    padding: 22px 0 50px;
}


/* ==========================================
   PAGE TITLE
========================================== */

.page-title {

    margin-bottom: 20px;
}


.page-title h1 {

    font-size: 28px;

    margin-bottom: 5px;
}


.page-title p {

    color: #777;
}


/* ==========================================
   SEARCH
========================================== */

.search-box {

    background: white;

    padding: 14px 16px;

    border-radius: 18px;

    margin-bottom: 18px;

    box-shadow:
        0 5px 20px
        rgba(40,20,80,.06);
}


.search-box input {

    width: 100%;

    border: none;

    outline: none;

    font-size: 16px;

    background: transparent;
}


/* ==========================================
   MESSAGE CARD
========================================== */

.messages-card {

    background: white;

    border-radius: 23px;

    overflow: hidden;

    box-shadow:
        0 6px 25px
        rgba(40,20,80,.07);
}


/* ==========================================
   CARD HEADER
========================================== */

.messages-header {

    padding: 18px 20px;

    border-bottom: 1px solid #eee;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.messages-header h2 {

    font-size: 20px;
}


.unread-total {

    background: #7c3aed;

    color: white;

    min-width: 28px;

    height: 28px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 13px;

    font-weight: bold;
}


/* ==========================================
   CONVERSATION
========================================== */

.conversation {

    display: flex;

    align-items: center;

    gap: 14px;

    padding: 17px 20px;

    border-bottom: 1px solid #f0edf5;

    cursor: pointer;

    transition: .2s;
}


.conversation:hover {

    background: #faf8ff;
}


.conversation.unread {

    background: #f7f3ff;
}


/* ==========================================
   AVATAR
========================================== */

.avatar {

    width: 55px;

    height: 55px;

    min-width: 55px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ddd6fe,
            #c4b5fd
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 23px;

    font-weight: bold;

    color: #5b21b6;

    overflow: hidden;
}


.avatar img {

    width: 100%;

    height: 100%;

    object-fit: cover;
}


/* ==========================================
   CONVERSATION CONTENT
========================================== */

.conversation-content {

    flex: 1;

    min-width: 0;
}


.conversation-top {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 5px;
}


.conversation-name {

    font-weight: bold;

    font-size: 16px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.conversation-time {

    color: #999;

    font-size: 12px;

    white-space: nowrap;
}


.last-message {

    color: #777;

    font-size: 14px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.unread .last-message {

    color: #3f3158;

    font-weight: bold;
}


/* ==========================================
   RIGHT SIDE
========================================== */

.conversation-right {

    display: flex;

    flex-direction: column;

    align-items: flex-end;

    gap: 7px;
}


.unread-badge {

    background: #7c3aed;

    color: white;

    min-width: 22px;

    height: 22px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 11px;

    font-weight: bold;
}


/* ==========================================
   EMPTY
========================================== */

.empty {

    padding: 55px 20px;

    text-align: center;

    color: #777;
}


.empty-icon {

    font-size: 50px;

    margin-bottom: 12px;
}


.empty h3 {

    color: #40364d;

    margin-bottom: 8px;
}


/* ==========================================
   NEW MESSAGE BUTTON
========================================== */

.new-message-btn {

    position: fixed;

    right: 25px;

    bottom: 25px;

    width: 58px;

    height: 58px;

    border: none;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    font-size: 25px;

    cursor: pointer;

    box-shadow:
        0 8px 25px
        rgba(80,40,180,.3);
}


/* ==========================================
   MODAL
========================================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.55);

    z-index: 500;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


.modal.show {

    display: flex;
}


.modal-content {

    background: white;

    width: 100%;

    max-width: 450px;

    border-radius: 24px;

    padding: 25px;
}


.modal-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;
}


.close-btn {

    width: 38px;

    height: 38px;

    border: none;

    border-radius: 50%;

    background: #eee;

    font-size: 20px;

    cursor: pointer;
}


.form-group {

    margin-bottom: 16px;
}


.form-group label {

    display: block;

    margin-bottom: 7px;

    font-weight: bold;
}


.form-group input {

    width: 100%;

    padding: 13px;

    border: 1px solid #ddd;

    border-radius: 13px;

    outline: none;

    font-size: 15px;
}


.start-btn {

    width: 100%;

    border: none;

    background: #7c3aed;

    color: white;

    padding: 14px;

    border-radius: 14px;

    font-weight: bold;

    cursor: pointer;
}


/* ==========================================
   FOOTER
========================================== */

.footer {

    text-align: center;

    padding: 30px;

    color: #888;
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px) {

    .header {

        padding: 14px;
    }


    .logo {

        font-size: 20px;
    }


    .header-btn {

        padding: 9px 11px;

        font-size: 12px;
    }


    .container {

        width: 96%;
    }


    .conversation {

        padding: 15px;
    }


    .avatar {

        width: 50px;

        height: 50px;

        min-width: 50px;
    }


    .conversation-time {

        font-size: 11px;
    }

}

</style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

    <div class="logo">

        Gene-rations

    </div>


    <div class="header-actions">

        <button
            class="header-btn"
            onclick="goGenerationHub()">

            🏠 Generation Hub

        </button>


        <button
            class="header-btn"
            onclick="goProfile()">

            👤

        </button>

    </div>

</header>



<!-- ==========================================
     MAIN
========================================== -->

<main class="container">


    <section class="page-title">

        <h1>

            Messages

        </h1>


        <p id="messageWelcome">

            Connect with other Gene-rations members.

        </p>

    </section>



    <!-- SEARCH -->

    <section class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="🔍 Search conversations..."
        >

    </section>



    <!-- MESSAGES -->

    <section class="messages-card">


        <div class="messages-header">

            <h2>

                Conversations

            </h2>


            <span
                class="unread-total"
                id="unreadTotal">

                0

            </span>

        </div>


        <div id="conversationList">

            <!-- Dynamic conversations -->

        </div>


    </section>


</main>



<!-- ==========================================
     NEW MESSAGE BUTTON
========================================== -->

<button
    class="new-message-btn"
    onclick="openNewMessage()"
    title="New message">

    ✉️

</button>



<!-- ==========================================
     NEW MESSAGE MODAL
========================================== -->

<div
    class="modal"
    id="newMessageModal">


    <div class="modal-content">


        <div class="modal-header">

            <h2>

                New Message

            </h2>


            <button
                class="close-btn"
                onclick="closeNewMessage()">

                ×

            </button>

        </div>


        <form
            id="newMessageForm">


            <div class="form-group">

                <label>

                    Recipient email

                </label>


                <input
                    type="email"
                    id="recipientEmail"
                    placeholder="Enter member email"
                    required
                >

            </div>


            <div class="form-group">

                <label>

                    First message

                </label>


                <input
                    type="text"
                    id="firstMessage"
                    placeholder="Write your message..."
                    required
                >

            </div>


            <button
                class="start-btn"
                type="submit">

                Start Conversation

            </button>


        </form>

    </div>

</div>



<footer class="footer">

    Gene-rations © 2026

</footer>



<script>

/* =====================================================
   USER DATA
===================================================== */

let userData =
    JSON.parse(
        localStorage.getItem("userData")
    );


/* =====================================================
   LOGIN CHECK
===================================================== */

if (!userData) {

    window.location.href =
        "login.html";

}


/* =====================================================
   USER NAME
===================================================== */

document.getElementById(
    "messageWelcome"
).textContent =

    `Connect with other Gene-rations members, ${
        userData.fullName ||
        "Member"
    }.`;



/* =====================================================
   STORAGE
===================================================== */

const MESSAGE_KEY =
    "geneRationsMessages";



/* =====================================================
   LOAD MESSAGE DATA
===================================================== */

let messageData =
    JSON.parse(
        localStorage.getItem(
            MESSAGE_KEY
        )
    ) || [];



/*
    Structure:

    {
        id,
        participants: [],
        messages: [],
        updatedAt
    }

*/



/* =====================================================
   SAVE
===================================================== */

function saveMessages() {

    localStorage.setItem(

        MESSAGE_KEY,

        JSON.stringify(
            messageData
        )

    );

}



/* =====================================================
   GET CONVERSATIONS
===================================================== */

function getConversations() {

    return messageData
        .filter(function(conversation) {

            return (
                Array.isArray(
                    conversation.participants
                )
                &&
                conversation.participants
                    .includes(
                        userData.email
                    )
            );

        })
        .sort(function(a,b) {

            return (
                new Date(
                    b.updatedAt || 0
                )
                -
                new Date(
                    a.updatedAt || 0
                )
            );

        });

}



/* =====================================================
   RENDER
===================================================== */

function renderMessages(
    search = ""
) {

    const list =
        document.getElementById(
            "conversationList"
        );


    list.innerHTML = "";


    const conversations =
        getConversations();


    const searchTerm =
        search
            .toLowerCase()
            .trim();


    const filtered =
        conversations.filter(
            function(conversation) {

                const otherUser =
                    getOtherParticipant(
                        conversation
                    );


                const name =
                    otherUser.name ||
                    otherUser.email ||
                    "";


                const last =
                    getLastMessage(
                        conversation
                    );


                return (

                    name
                        .toLowerCase()
                        .includes(
                            searchTerm
                        )

                    ||

                    (
                        last.text ||
                        ""
                    )
                    .toLowerCase()
                    .includes(
                        searchTerm
                    )

                );

            }
        );


    /* ===============================
       UNREAD
    =============================== */

    let totalUnread = 0;


    conversations.forEach(
        function(conversation) {

            totalUnread +=
                getUnreadCount(
                    conversation
                );

        }
    );


    document.getElementById(
        "unreadTotal"
    ).textContent =
        totalUnread;


    /* ===============================
       EMPTY
    =============================== */

    if (
        filtered.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    💬

                </div>


                <h3>

                    ${
                        search
                            ? "No conversations found"
                            : "No messages yet"
                    }

                </h3>


                <p>

                    ${
                        search
                            ? "Try another search."
                            : "Start a conversation with another Gene-rations member."
                    }

                </p>

            </div>

        `;

        return;

    }



    /* ===============================
       CONVERSATIONS
    =============================== */

    filtered.forEach(
        function(conversation) {

            const otherUser =
                getOtherParticipant(
                    conversation
                );


            const last =
                getLastMessage(
                    conversation
                );


            const unread =
                getUnreadCount(
                    conversation
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "conversation" +
                (
                    unread > 0
                        ? " unread"
                        : ""
                );


            item.onclick =
                function() {

                    openConversation(
                        conversation.id
                    );

                };


            const name =
                otherUser.name ||
                otherUser.email ||
                "Gene-rations Member";


            const initials =
                getInitials(
                    name
                );


            const photo =
                otherUser.profilePhoto ||
                "";


            item.innerHTML = `

                <div class="avatar">

                    ${
                        photo

                        ?

                        `<img
                            src="${photo}"
                            alt="Profile"
                        >`

                        :

                        initials
                    }

                </div>


                <div
                    class="conversation-content">


                    <div
                        class="conversation-top">


                        <div
                            class="conversation-name">

                            ${escapeHTML(
                                name
                            )}

                        </div>


                        <div
                            class="conversation-time">

                            ${
                                formatTime(
                                    last?.createdAt
                                )
                            }

                        </div>


                    </div>


                    <div
                        class="last-message">

                        ${
                            last

                                ?

                                escapeHTML(
                                    last.text ||
                                    ""
                                )

                                :

                                "No messages yet"
                        }

                    </div>


                </div>


                <div
                    class="conversation-right">


                    ${
                        unread > 0

                        ?

                        `<span
                            class="unread-badge">

                            ${unread}

                        </span>`

                        :

                        ""

                    }


                </div>

            `;


            list.appendChild(
                item
            );

        }
    );

}



/* =====================================================
   GET OTHER PARTICIPANT
===================================================== */

function getOtherParticipant(
    conversation
) {

    const email =
        conversation.participants
            .find(function(participant) {

                return (
                    participant !==
                    userData.email
                );

            });


    /*
       If participant is an object
    */

    if (
        email &&
        typeof email ===
        "object"
    ) {

        return email;

    }


    /*
       Search saved user profiles if
       available later.
    */

    const users =
        JSON.parse(
            localStorage.getItem(
                "geneRationsUsers"
            )
        ) || [];


    const found =
        users.find(
            function(user) {

                return (
                    user.email ===
                    email
                );

            }
        );


    if (found) {

        return found;

    }


    /*
       Fallback
    */

    return {

        email:
            email ||
            "Unknown Member",

        name:
            email ||
            "Gene-rations Member",

        profilePhoto:
            ""

    };

}



/* =====================================================
   GET LAST MESSAGE
===================================================== */

function getLastMessage(
    conversation
) {

    if (
        !Array.isArray(
            conversation.messages
        )
        ||
        conversation.messages.length === 0
    ) {

        return null;

    }


    return conversation.messages[
        conversation.messages.length - 1
    ];

}



/* =====================================================
   UNREAD COUNT
===================================================== */

function getUnreadCount(
    conversation
) {

    if (
        !Array.isArray(
            conversation.messages
        )
    ) {

        return 0;

    }


    return conversation.messages.filter(
        function(message) {

            return (
                message.sender !==
                userData.email

                &&

                message.read !== true
            );

        }
    ).length;

}



/* =====================================================
   OPEN CONVERSATION
===================================================== */

function openConversation(
    conversationId
) {

    localStorage.setItem(

        "selectedConversationId",

        conversationId

    );


    /*
       We will build this page next.
    */

    window.location.href =
        "message-details.html";

}



/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    function() {

        renderMessages(
            this.value
        );

    }
);



/* =====================================================
   NEW MESSAGE
===================================================== */

function openNewMessage() {

    document.getElementById(
        "newMessageModal"
    ).classList.add(
        "show"
    );

}


function closeNewMessage() {

    document.getElementById(
        "newMessageModal"
    ).classList.remove(
        "show"
    );

}



/* =====================================================
   START NEW CONVERSATION
===================================================== */

document.getElementById(
    "newMessageForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const recipient =
            document.getElementById(
                "recipientEmail"
            ).value
            .trim()
            .toLowerCase();


        const firstMessage =
            document.getElementById(
                "firstMessage"
            ).value
            .trim();


        if (
            !recipient ||
            !firstMessage
        ) {

            return;

        }


        if (
            recipient ===
            userData.email
        ) {

            alert(
                "You cannot message yourself."
            );

            return;

        }


        /*
           Check whether conversation
           already exists.
        */

        let conversation =
            messageData.find(
                function(item) {

                    return (

                        item.participants
                            .includes(
                                userData.email
                            )

                        &&

                        item.participants
                            .includes(
                                recipient
                            )

                        &&

                        item.participants
                            .length === 2

                    );

                }
            );


        /*
           Create new conversation
        */

        if (!conversation) {

            conversation = {

                id:
                    "conversation-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2,7),

                participants: [

                    userData.email,

                    recipient

                ],

                messages: [],

                updatedAt:
                    new Date()
                        .toISOString()

            };


            messageData.push(
                conversation
            );

        }


        /*
           Add first message
        */

        conversation.messages.push({

            id:
                "message-" +
                Date.now(),

            sender:
                userData.email,

            receiver:
                recipient,

            text:
                firstMessage,

            createdAt:
                new Date()
                    .toISOString(),

            read:
                true

        });


        conversation.updatedAt =
            new Date()
                .toISOString();


        saveMessages();


        /*
           Save selected conversation
        */

        localStorage.setItem(

            "selectedConversationId",

            conversation.id

        );


        /*
           Open conversation
        */

        window.location.href =
            "message-details.html";

    }
);



/* =====================================================
   NAVIGATION
===================================================== */

function goGenerationHub() {

    window.location.href =
        "generations.html";

}


function goProfile() {

    window.location.href =
        "profile.html";

}



/* =====================================================
   UTILITIES
===================================================== */

function getInitials(
    name
) {

    return name
        .split(" ")
        .filter(Boolean)
        .slice(0,2)
        .map(function(word) {

            return word
                .charAt(0)
                .toUpperCase();

        })
        .join("");

}



function formatTime(
    date
) {

    if (!date) {

        return "";

    }


    const d =
        new Date(date);


    if (
        isNaN(
            d.getTime()
        )
    ) {

        return "";

    }


    const now =
        new Date();


    const sameDay =
        d.toDateString() ===
        now.toDateString();


    if (sameDay) {

        return d.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    return d.toLocaleDateString(
        [],
        {
            month: "short",
            day: "numeric"
        }
    );

}



function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value || "";


    return div.innerHTML;

}



/* =====================================================
   CLOSE MODAL OUTSIDE
===================================================== */

document.getElementById(
    "newMessageModal"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            closeNewMessage();

        }

    }
);



/* =====================================================
   INITIAL LOAD
===================================================== */

renderMessages();

</script>


</body>

</html>
