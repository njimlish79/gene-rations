<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gene-rations - Reset Password</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2e7d32,#66bb6a);
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#2e7d32;
}

.logo p{
    color:#666;
    margin-top:5px;
}

.info-box{
    background:#e8f5e9;
    border-left:4px solid #2e7d32;
    padding:12px;
    border-radius:6px;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.password-options{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
}

.password-options input{
    width:auto;
}

.reset-btn{
    width:100%;
    padding:14px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.reset-btn:hover{
    background:#1b5e20;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#2e7d32;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">

<h1>Gene-rations</h1>

<p>Create a New Password</p>

</div>

<div class="info-box">

Enter the verification code sent to your email,
then choose a strong new password.

</div>

<form id="resetForm">

<div class="form-group">

<label>Verification Code</label>

<input
type="text"
id="otp"
placeholder="Enter OTP / Verification Code"
required>

</div>

<div class="form-group">

<label>New Password</label>

<input
type="password"
id="newPassword"
placeholder="Enter new password"
minlength="8"
required>

</div>

<div class="form-group">

<label>Confirm New Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm new password"
minlength="8"
required>

<div class="password-options">

<input
type="checkbox"
id="showPasswords">

<label for="showPasswords">
Show Passwords
</label>

</div>

</div>

<button
type="submit"
class="reset-btn">

Reset Password

</button>

</form>

<div id="message" class="message"></div>

<div class="links">

<a href="login.html">
← Back to Login
</a>

</div>

</div>

<script>

const showPasswords =
document.getElementById("showPasswords");

showPasswords.addEventListener("change", function(){

const type =
this.checked ? "text" : "password";

document.getElementById("newPassword").type = type;
document.getElementById("confirmPassword").type = type;

});

document
.getElementById("resetForm")
.addEventListener("submit", function(e){

e.preventDefault();

const otp =
document.getElementById("otp").value;

const newPassword =
document.getElementById("newPassword").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const message =
document.getElementById("message");

if(newPassword !== confirmPassword){

message.textContent =
"Passwords do not match.";

message.className =
"message error";

return;

}

if(newPassword.length < 8){

message.textContent =
"Password must be at least 8 characters.";

message.className =
"message error";

return;

}

/*
Future Backend API:

POST /api/reset-password

{
    otp: otp,
    password: newPassword
}

Server verifies OTP and updates password.
*/

message.textContent =
"Password reset successful! Redirecting to login...";

message.className =
"message success";

setTimeout(() => {

window.location.href = "login.html";

}, 2500);

});

</script>

</body>
</html>
