<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Phone | Gene-rations</title>


    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 
<style>
  
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f7f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.verify-container{
    background:white;
    width:350px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    text-align:center;
}

.logo{
    width:80px;
    height:80px;
    margin:auto;
    background:#2e7d32;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:35px;
}

h2{
    margin:20px 0 10px;
    color:#2e7d32;
}

p{
    color:#666;
}

h3{
    margin:15px 0;
}

input{
    width:100%;
    padding:15px;
    font-size:20px;
    text-align:center;
    border:2px solid #ddd;
    border-radius:8px;
    margin-top:20px;
    letter-spacing:5px;
}

input:focus{
    outline:none;
    border-color:#2e7d32;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#2e7d32;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

#resendBtn{
    background:#1565c0;
}

#resendBtn:hover{
    background:#0d47a1;
}

#message{
    margin-top:15px;
    font-weight:bold;
  }
  #timer{
    margin-top:15px;
    color:#d32f2f;
    font-weight:bold;
    font-size:15px;
}

#resendBtn:disabled{
    background:#9e9e9e;
    cursor:not-allowed;
}
</style>
</head>
<body>

<div class="verify-container">

    <div class="logo">
        <i class="fa-solid fa-mobile-screen-button"></i>
    </div>

    <h2>SMS Verification</h2>

    <p>
        We've sent a 6-digit verification code to
    </p>

    <h3 id="phoneNumber">+254 *********</h3>

    <form id="verifyForm">

        <input
            type="text"
            id="code"
            maxlength="6"
            placeholder="Enter 6-digit code"
            required>

        <button type="submit">
            Verify Number
        </button>

    </form>

    <p id="message"></p>

    <button id="resendBtn">
        <i class="fa-solid fa-rotate"></i>
        Resend Code
    </button>

</div>

  <script>

    const COUNTDOWN = 120; // 2 minutes
let timeLeft = COUNTDOWN;

const resendBtn = document.getElementById("resendBtn");

// Disable resend initially
resendBtn.disabled = true;

const timerText = document.createElement("p");
timerText.id = "timer";
document.querySelector(".verify-container").insertBefore(
    resendBtn,
    document.getElementById("message")
);

document.querySelector(".verify-container").insertBefore(
    timerText,
    resendBtn
);

function startTimer() {

    timeLeft = COUNTDOWN;
    resendBtn.disabled = true;

    const timer = setInterval(() => {

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        timerText.innerHTML =
        `Code expires in ${minutes}:${seconds.toString().padStart(2,"0")}`;

        timeLeft--;

        if (timeLeft < 0) {

            clearInterval(timer);

            timerText.innerHTML =
            "Verification code expired.";

            resendBtn.disabled = false;
            resendBtn.innerHTML =
            '<i class="fa-solid fa-rotate"></i> Resend Code';
        }

    }, 1000);

}

startTimer();

resendBtn.addEventListener("click", function(){

    alert("A new verification code has been sent.");

    startTimer();

});
    
</script>

</body>
</html>
