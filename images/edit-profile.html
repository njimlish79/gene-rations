<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Profile | Gene-rations</title><style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #06a52b;
    color: #222;
}

/* HEADER */

header {
    background: #1877f2;
    color: white;
    padding: 18px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 20;
}

header h1 {
    font-size: 22px;
}

/* MAIN */

.container {
    max-width: 700px;
    margin: 20px auto;
    padding: 12px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 4px 15px rgba(0,0,0,.10);
}

/* SECTION */

.section {
    margin-bottom: 28px;
}

.section-title {
    font-size: 19px;
    margin-bottom: 15px;
    border-bottom: 2px solid #eee;
    padding-bottom: 8px;
}

/* PROFILE PHOTO */

.photo-section {
    text-align: center;
    margin-bottom: 28px;
}

.profile-photo {
    width: 125px;
    height: 125px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #1877f2;
    background: #ddd;
}

.photo-button {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 16px;
    background: #1877f2;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

#photoInput {
    display: none;
}

/* FORM */

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

/* PROTECTED */

.protected {
    background: #eeeeee;
    color: #666;
    cursor: not-allowed;
}

.protected-note {
    font-size: 12px;
    color: #777;
    margin-top: 5px;
}

/* GENERATION */

.generation-box {
    background: #f0f6ff;
    border-left: 4px solid #1877f2;
    padding: 16px;
    border-radius: 10px;
}

.generation-name {
    font-size: 19px;
    font-weight: bold;
}

.generation-badge {
    display: inline-block;
    margin-top: 9px;
    padding: 7px 13px;
    border-radius: 20px;
    background: #1877f2;
    color: white;
    font-size: 13px;
}

.generation-description {
    margin-top: 10px;
    line-height: 1.5;
}

/* SKILLS BUTTON */

.skills-button {
    width: 100%;
    padding: 15px;
    border: 2px dashed #1877f2;
    background: #f7fbff;
    color: #1877f2;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.skills-button:hover {
    background: #eaf4ff;
}

/* SELECTED SKILLS */

.selected-skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 13px;
}

.skill-chip {
    background: #1877f2;
    color: white;
    padding: 8px 11px;
    border-radius: 20px;
    font-size: 13px;
}

/* BUTTONS */

.action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.action-buttons button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
}

.cancel {
    background: #ddd;
}

.save {
    background: #1877f2;
    color: white;
}

/* MESSAGE */

.message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

/* =====================================
   SKILLS MODAL
===================================== */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 100;
    padding: 15px;
}

.modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-box {
    width: 100%;
    max-width: 650px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 16px;
    padding: 20px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.close-button {
    border: none;
    background: none;
    font-size: 28px;
    cursor: pointer;
}

/* SEARCH */

.skill-search {
    margin-bottom: 18px;
}

.skill-search input {
    width: 100%;
}

/* CATEGORY */

.skill-category {
    margin-bottom: 20px;
}

.category-button {
    width: 100%;
    text-align: left;
    padding: 14px;
    background: #f5f7f9;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 8px;
}

.category-button:hover {
    background: #eaf4ff;
}

/* CATEGORY CONTENT */

.category-content {
    display: none;
    padding: 8px 0 10px;
}

.category-content.open {
    display: block;
}

/* SKILLS */

.skill-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.skill-item {
    border: 1px solid #ccc;
    background: white;
    padding: 9px 11px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
}

.skill-item.selected {
    background: #1877f2;
    color: white;
    border-color: #1877f2;
}

/* CUSTOM */

.custom-skill {
    display: flex;
    gap: 8px;
    margin-top: 18px;
}

.custom-skill input {
    flex: 1;
}

.custom-skill button {
    border: none;
    background: #1877f2;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
}

/* DONE */

.done-button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #1877f2;
    color: white;
    font-size: 16px;
}

/* MOBILE */

@media(max-width:600px) {

    .card {
        padding: 17px;
    }

    .action-buttons {
        flex-direction: column;
    }

    .custom-skill {
        flex-direction: column;
    }

}

</style></head><body><header><h1>Edit Profile</h1></header><div class="container"><div class="card"><!-- =================================

</button></div></div><script>

/* ==========================================
   LOAD SIGNUP DATA
========================================== */

let userData =
    JSON.parse(
        localStorage.getItem("userData")
    );


/* USER MUST BE LOGGED IN */

if (!userData) {

    window.location.href =
        "login.html";

}


/* ==========================================

========================================== */

const skillCategories = {

"Technology & Digital": [

],

"Creative Arts & Media": [

],

"Trades & Technical": [

],

"Agriculture & Environment": [

],

"Health & Wellness": [

"Fitness Training",

],

"Sports & Recreation": [

"Football",

],

],

],

"Transport & Logistics": [

"Warehousing",
"Inventory Management",
"Delivery Services",
"Navigation",
"Freight Management"

]

};


/* ==========================================
   SELECTED SKILLS
========================================== */

let selectedSkills = [];


if (Array.isArray(userData.skills)) {

    selectedSkills =
        [...userData.skills];

}

else if (
    typeof userData.skills === "string"
) {

    selectedSkills =
        userData.skills
        .split(",")
        .map(skill => skill.trim())
        .filter(Boolean);

}


/* ==========================================
   LOAD EDITABLE DATA
========================================== */

document.getElementById("fullName").value =
    userData.fullName ||
    userData.name ||
    "";

document.getElementById("phone").value =
    userData.phone ||
    "";

document.getElementById("gender").value =
    userData.gender ||
    "";

document.getElementById("bio").value =
    userData.bio ||
    "";

document.getElementById("interests").value =
    userData.interests ||
    "";

document.getElementById("hobbies").value =
    userData.hobbies ||
    "";


/* ==========================================
   LOAD PROTECTED SIGNUP DATA
========================================== */

document.getElementById("email").value =
    userData.email ||
    "";

document.getElementById("dob").value =
    userData.dob ||
    "";

document.getElementById("generation").textContent =
    userData.generation ||
    "Generation unavailable";

document.getElementById("generationBadge").textContent =
    userData.generationBadge ||
    userData.generation ||
    "Generation Badge";

document.getElementById("generationDescription").textContent =
    userData.generationDescription ||
    "Welcome to your Gene-rations community.";


/* ==========================================
   PROFILE PHOTO
========================================== */

const photo =
    document.getElementById("profilePhoto");


if (userData.profilePhoto) {

    photo.src =
        userData.profilePhoto;

}

else {

    photo.src =
        "images/default-profile.png";

}


/* ==========================================
   CHANGE PROFILE PHOTO
========================================== */

document.getElementById(
    "photoInput"
).addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                photo.src =
                    e.target.result;

                userData.profilePhoto =
                    e.target.result;

            };

        reader.readAsDataURL(file);

    }
);


/* ==========================================
   OPEN SKILLS SELECTOR
========================================== */

function openSkillsSelector() {

    document
        .getElementById("skillsModal")
        .classList.add("active");

}


/* ==========================================
   CLOSE SKILLS SELECTOR
========================================== */

function closeSkillsSelector() {

    document
        .getElementById("skillsModal")
        .classList.remove("active");

    displaySelectedSkills();

}


/* ==========================================
   LOAD SKILL CATEGORIES
========================================== */

function loadSkillCategories() {

    const container =
        document.getElementById(
            "skillsContainer"
        );

    container.innerHTML = "";


    Object.keys(skillCategories)
    .forEach(category => {

        const categoryBox =
            document.createElement("div");

        categoryBox.className =
            "skill-category";


        const categoryButton =
            document.createElement("button");

        categoryButton.type =
            "button";

        categoryButton.className =
            "category-button";

        categoryButton.textContent =
            "▸ " + category;


        const content =
            document.createElement("div");

        content.className =
            "category-content";


        categoryButton.onclick =
            function() {

                content.classList.toggle(
                    "open"
                );

                categoryButton.textContent =
                    content.classList.contains("open")
                    ? "▾ " + category
                    : "▸ " + category;

            };


        const list =
            document.createElement("div");

        list.className =
            "skill-list";


        skillCategories[category]
        .forEach(skill => {

            const skillButton =
                document.createElement("button");

            skillButton.type =
                "button";

            skillButton.className =
                "skill-item";

            skillButton.textContent =
                skill;


            if (
                selectedSkills.includes(skill)
            ) {

                skillButton.classList.add(
                    "selected"
                );

            }


            skillButton.onclick =
                function() {

                    toggleSkill(
                        skill,
                        skillButton
                    );

                };


            list.appendChild(
                skillButton
            );

        });


        content.appendChild(list);

        categoryBox.appendChild(
            categoryButton
        );

        categoryBox.appendChild(
            content
        );

        container.appendChild(
            categoryBox
        );

    });

}


/* ==========================================
   TOGGLE SKILL
========================================== */

function toggleSkill(
    skill,
    button
) {

    const index =
        selectedSkills.indexOf(skill);


    if (index === -1) {

        selectedSkills.push(skill);

        button.classList.add(
            "selected"
        );

    }

    else {

        selectedSkills.splice(
            index,
            1
        );

        button.classList.remove(
            "selected"
        );

    }


    displaySelectedSkills();

}


/* ==========================================
   DISPLAY SELECTED SKILLS
========================================== */

function displaySelectedSkills() {

    const container =
        document.getElementById(
            "selectedSkills"
        );

    container.innerHTML = "";


    if (
        selectedSkills.length === 0
    ) {

        container.innerHTML =
            "<span style='color:#777;'>No skills selected yet.</span>";

        return;

    }


    selectedSkills.forEach(skill => {

        const chip =
            document.createElement("span");

        chip.className =
            "skill-chip";

        chip.textContent =
            skill;

        container.appendChild(chip);

    });

}


/* ==========================================
   CUSTOM SKILL
========================================== */

function addCustomSkill() {

    const input =
        document.getElementById(
            "customSkill"
        );

    const skill =
        input.value.trim();


    if (!skill) return;


    const alreadyExists =
        selectedSkills.some(
            existing =>
                existing.toLowerCase() ===
                skill.toLowerCase()
        );


    if (!alreadyExists) {

        selectedSkills.push(skill);

    }


    input.value = "";

    loadSkillCategories();

    displaySelectedSkills();

}


/* ==========================================
   SEARCH SKILLS
========================================== */

document.getElementById(
    "skillSearch"
).addEventListener(
    "input",
    function() {

        const search =
            this.value
            .toLowerCase()
            .trim();


        document
        .querySelectorAll(
            ".skill-category"
        )
        .forEach(category => {

            let matches = 0;


            category
            .querySelectorAll(
                ".skill-item"
            )
            .forEach(item => {

                const skill =
                    item.textContent
                    .toLowerCase();


                if (
                    skill.includes(search)
                ) {

                    item.style.display =
                        "inline-block";

                    matches++;

                }

                else {

                    item.style.display =
                        "none";

                }

            });


            category.style.display =
                matches > 0
                ? "block"
                : "none";

        });

    }
);


/* ==========================================
   SAVE PROFILE
========================================== */

function saveProfile() {


    /* EDITABLE DATA ONLY */

    userData.fullName =
        document.getElementById(
            "fullName"
        ).value.trim();


    userData.phone =
        document.getElementById(
            "phone"
        ).value.trim();


    userData.gender =
        document.getElementById(
            "gender"
        ).value;


    userData.bio =
        document.getElementById(
            "bio"
        ).value.trim();


    userData.interests =
        document.getElementById(
            "interests"
        ).value.trim();


    userData.hobbies =
        document.getElementById(
            "hobbies"
        ).value.trim();


    userData.skills =
        [...selectedSkills];


    /* SAVE SAME USER OBJECT */

    localStorage.setItem(
        "userData",
        JSON.stringify(userData)
    );


    document.getElementById(
        "message"
    ).textContent =
        "Profile updated successfully!";


    document.getElementById(
        "message"
    ).style.color =
        "green";


    setTimeout(
        function() {

            window.location.href =
                "profile.html";

        },
        1000
    );

}


/* ==========================================
   CANCEL
========================================== */

function goBack() {

    window.location.href =
        "profile.html";

}


/* ==========================================
   START
========================================== */

loadSkillCategories();

displaySelectedSkills();

</script></body>
</html>
