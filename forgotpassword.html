<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gene-rations - Forgot Password</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2e7d32,#66bb6a);
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#2e7d32;
    margin-bottom:10px;
}

.logo p{
    color:#666;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.reset-btn{
    width:100%;
    padding:14px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.reset-btn:hover{
    background:#1b5e20;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#2e7d32;
    text-decoration:none;
}

.info-box{
    background:#f1f8e9;
    border-left:4px solid #2e7d32;
    padding:12px;
    margin-bottom:20px;
    border-radius:5px;
    color:#444;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">

<h1>Gene-rations</h1>

<p>Password Recovery</p>

</div>

<div class="info-box">

Enter your registered email address and we'll send
a password reset link or verification code.

</div>

<form id="forgotPasswordForm">

<div class="form-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your registered email"
required>

</div>

<button
type="submit"
class="reset-btn">

Send Reset Link

</button>

</form>

<div id="message" class="message"></div>

<div class="links">

<a href="login.html">
← Back to Login
</a>

</div>

</div>

<script>

document
.getElementById("forgotPasswordForm")
.addEventListener("submit", function(e){

e.preventDefault();

const email =
document.getElementById("email").value;

const message =
document.getElementById("message");

if(email.trim() === ""){

message.textContent =
"Please enter your email address.";

message.className =
"message error";

return;

}

/*
Future Backend API Example:

POST /api/forgot-password

{
    email: email
}

The server would:
1. Verify the email exists.
2. Generate a secure reset token.
3. Email a reset link or OTP.
*/

message.textContent =
"If an account exists for this email, a password reset link has been sent.";

message.className =
"message success";

document
.getElementById("forgotPasswordForm")
.reset();

});

</script>

</body>
</html>
