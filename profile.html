<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Gene-rations Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#eef3f9;

}

/*======================
HEADER
======================*/

.header{

background:linear-gradient(135deg,#057808,#1565c0);

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

color:white;

box-shadow:0 5px 15px rgba(0,0,0,.2);

}

.logo{

font-size:28px;

font-weight:bold;

}

.home-btn{

background:white;

color:#078b24;

padding:10px 20px;

border-radius:30px;

text-decoration:none;

font-weight:bold;

}

/*======================
PROFILE CARD
======================*/

.profile-card{

max-width:900px;

margin:30px auto;

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 10px 25px rgba(0,6,2,.15);

}

/*======================
PROFILE HEADER
======================*/

.profile-header{

padding:30px;

display:flex;

flex-wrap:wrap;

align-items:center;

gap:25px;

background:linear-gradient(135deg,#1976d2,#42a5f5);

color:white;

}

.image-box{

text-align:center;

}

.image-box img{

width:140px;

height:140px;

border-radius:50%;

border:5px solid white;

object-fit:cover;

background:#ddd;

cursor:pointer;

}

.image-box input{

display:none;

}

.upload-btn{

display:inline-block;

margin-top:12px;

padding:10px 18px;

background:white;

color:#1565c0;

border-radius:30px;

font-weight:bold;

cursor:pointer;

}

.user-info{

flex:1;

}

.user-info h2{

font-size:34px;

margin-bottom:10px;

}

#generationName{

font-size:22px;

font-weight:bold;

margin-bottom:10px;

}

.member{

font-size:15px;

opacity:.9;

}

/*======================
WELCOME CARD
======================*/

.welcome{

margin:25px;

padding:20px;

background:#e8f5e9;

border-left:6px solid #43a047;

border-radius:15px;

}

.welcome h3{

color:#2e7d32;

margin-bottom:10px;

}

#welcomeMessage{

font-size:17px;

line-height:1.6;

}

/*======================
INFO GRID
======================*/

.info-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

padding:25px;

}

.card{

background:white;

border-radius:15px;

padding:20px;

box-shadow:0 5px 12px rgba(0,0,0,.08);

transition:.3s;

}

.card:hover{

transform:translateY(-5px);

}

.card h3{

color:#1565c0;

margin-bottom:15px;

}

.item{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #eee;

}

.item:last-child{

border:none;

}

.value{

font-weight:bold;

color:#0d47a1;

}
  /*=========================
SETTING BUTTONS
=========================*/

.setting-btn{

width:100%;

padding:12px;

margin-top:12px;

background:#1565c0;

color:white;

border:none;

border-radius:10px;

font-size:16px;

cursor:pointer;

transition:.3s;

}

.setting-btn:hover{

background:#0d47a1;

}

/*=========================
RECENT POSTS
=========================*/

#recentPosts{

display:flex;

flex-direction:column;

gap:10px;

}

.post{

padding:12px;

background:#f5f7fb;

border-left:5px solid #1976d2;

border-radius:8px;

}

/*=========================
FOOTER
=========================*/

.footer{

text-align:center;

padding:25px;

background:#1565c0;

color:white;

margin-top:30px;

}

/*=========================
RESPONSIVE
=========================*/

@media(max-width:768px){

.profile-header{

flex-direction:column;

text-align:center;

}

.user-info h2{
  
font-size:28px;

}

.info-grid{

grid-template-columns:1fr;

}

}

  </style>

</head>

<body>

<header class="header">

<div class="logo">

Gene-rations

</div>

<a href="dashboard.html"
class="home-btn">

Home

</a>

</header>

<div class="profile-card">

<div class="profile-header">

<div class="image-box">

<img id="profileImage"
src="https://via.placeholder.com/140">

<br>

<label class="upload-btn">

Upload Photo

<input
type="file"
id="imageUpload"
accept="image/*">

</label>

</div>

<div class="user-info">

<h2 id="fullName">

Loading...

</h2>

<div id="generationName">

Loading...

</div>

<p class="member">

Member since

<span id="memberSince">

Loading...

</span>

</p>

</div>

</div>

<div class="welcome">

<h3>

Welcome

</h3>

<p id="welcomeMessage">

Loading...

</p>

</div>
<div class="info-grid">

    <!-- Generation Identity -->

    <div class="card">

        <h3>
            <i class="fa-solid fa-award"></i>
            Generation Identity
        </h3>

        <div class="item">
            <span>Generation Badge</span>
            <span class="value"
                  id="generationBadge">
                Loading...
            </span>
        </div>

        <div class="item">
            <span>Description</span>
            <span class="value"
                  id="generationDescription">
                Loading...
            </span>
        </div>

    </div>

    <!-- Followers -->

    <div class="card">

        <h3>
            <i class="fa-solid fa-users"></i>
            Community
        </h3>

        <div class="item">

            <span>Followers</span>

            <span class="value"
                  id="followers">

                0

            </span>

        </div>

        <div class="item">

            <span>Following</span>

            <span class="value"
                  id="following">

                0

            </span>

        </div>

    </div>

    <!-- Recent Posts -->

    <div class="card">

        <h3>
            <i class="fa-solid fa-file-lines"></i>
            Recent Posts
        </h3>

        <div id="recentPosts">

            <p>No posts yet.</p>

        </div>

    </div>

    <!-- Profile Settings -->

    <div class="card">

        <h3>
            <i class="fa-solid fa-gear"></i>
            Profile Settings
        </h3>

        <button
        class="setting-btn"
        onclick="location.href='edit-profile.html'">

            Edit Profile

        </button>

        <button
        class="setting-btn"
        onclick="location.href='privacy.html'">

            Privacy

        </button>

        <button
        class="setting-btn"
        onclick="location.href='resetpassword.html'">

            Change Password

        </button>

    </div>

</div>

<footer class="footer">

    © 2026 Gene-rations
    <br>
    Connecting Every Generation.

</footer>

<script>
  //==============================
// LOAD USER
//==============================

let user = JSON.parse(localStorage.getItem("userData"));

if (!user) {

    alert("Please sign up or log in first.");

    window.location.href = "login.html";

}

//==============================
// LOAD PROFILE DATA
//==============================

document.getElementById("fullName").textContent =
user.fullName || "Gene-rations Member";

document.getElementById("generationName").textContent =
user.generation || "Unknown Generation";

document.getElementById("memberSince").textContent =
user.memberSince || new Date().toLocaleDateString();

document.getElementById("generationBadge").textContent =
user.generationBadge || user.generation || "Member";

document.getElementById("generationDescription").textContent =
user.generationDescription ||
"Welcome to Gene-rations.";

document.getElementById("followers").textContent =
user.followers || 0;

document.getElementById("following").textContent =
user.following || 0;

//==============================
// WELCOME MESSAGE
//==============================

const welcome = document.getElementById("welcomeMessage");

switch(user.generation){

case "Generation Alpha":

welcome.innerHTML =
"🌱 Welcome to <b>Generation Alpha</b>. You are growing up in a world shaped by technology and limitless possibilities.";

break;

case "Generation Z":

welcome.innerHTML =
"📱 Welcome to <b>Generation Z</b>. You are creative, connected and ready to shape the future.";

break;

case "Millennial":

welcome.innerHTML =
"🚀 Welcome to the <b>Millennial Generation</b>. You bridge the digital and traditional worlds.";

break;

case "Generation X":

welcome.innerHTML =
"💼 Welcome to <b>Generation X</b>. Your experience and leadership inspire younger generations.";

break;

case "Silent Generation":

welcome.innerHTML =
"🏆 Welcome to the <b>Silent Generation</b>. Your wisdom and life experiences are treasured.";

break;

default:

welcome.innerHTML =
"🎉 Welcome to the Gene-rations community.";

}

//==============================
// PROFILE PHOTO
//==============================

const profileImage =
document.getElementById("profileImage");

if(user.profilePhoto){

profileImage.src = user.profilePhoto;

}

document.getElementById("imageUpload")
.addEventListener("change",function(){

const file = this.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

profileImage.src = e.target.result;

user.profilePhoto = e.target.result;

localStorage.setItem(
"userData",
JSON.stringify(user)
);

};

reader.readAsDataURL(file);

});

//==============================
// RECENT POSTS
//==============================

const recentPosts =
document.getElementById("recentPosts");

if(user.posts &&
Array.isArray(user.posts) &&
user.posts.length>0){

recentPosts.innerHTML="";

user.posts
.slice(0,3)
.forEach(post=>{

const div =
document.createElement("div");

div.className="post";

div.innerHTML=`
<strong>${post.title || "Post"}</strong>
<p>${post.content || post}</p>
`;

recentPosts.appendChild(div);

});

}else{

recentPosts.innerHTML=
"<p>No posts yet.</p>";

}

//==============================
// SAVE DEFAULTS
//==============================

if(user.followers===undefined)
user.followers=0;

if(user.following===undefined)
user.following=0;

if(!user.memberSince)
user.memberSince=
new Date().toLocaleDateString();

localStorage.setItem(
"userData",
JSON.stringify(user)
);

</script>

</body>
</html>
