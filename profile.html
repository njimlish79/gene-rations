<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Gene-rations</title>

    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <!-- Header -->
    <header class="profile-header">
        <h1>My Profile</h1>
    </header>

    <!-- Profile Card -->
    <section class="profile-card">

        <div class="profile-image-section">

            <img src="images/default-profile.png"
                 id="profileImage"
                 alt="Profile Photo">

            <input
                type="file"
                id="imageUpload"
                accept="image/*"
                hidden>

            <button id="uploadBtn">
                Upload Photo
            </button>

        </div>

        <h2 id="fullName">Full Name</h2>

        <span id="generationBadge"
              class="generation-badge">
              Generation Badge
        </span>

        <p id="generationName">
            Generation Name
        </p>

    </section>

    <!-- Personal Information -->

    <section class="profile-info">

        <h3>Personal Information</h3>

        <div class="info-item">
            <strong>Email</strong>
            <p id="email"></p>
        </div>

        <div class="info-item">
            <strong>Phone</strong>
            <p id="phone"></p>
        </div>

        <div class="info-item">
            <strong>Date of Birth</strong>
            <p id="dob"></p>
        </div>

        <div class="info-item">
            <strong>Gender</strong>
            <p id="gender"></p>
        </div>

    </section>

    <!-- Bio -->

    <section class="bio-section">

        <h3>Bio</h3>

        <textarea
            id="bio"
            placeholder="Tell people about yourself...">
        </textarea>

        <button id="saveBioBtn">
            Save Bio
        </button>

    </section>

    <!-- Statistics -->

    <section class="stats">

        <div class="stat-card">
            <h3 id="flowers">0</h3>
            <p>Flowers</p>
        </div>

        <div class="stat-card">
            <h3 id="followers">0</h3>
            <p>Followers</p>
        </div>

        <div class="stat-card">
            <h3 id="following">0</h3>
            <p>Following</p>
        </div>

    </section>

    <!-- Action Buttons -->

    <section class="profile-actions">

        <button id="editProfileBtn">
            Edit Profile
        </button>

        <button id="settingsBtn">
            Settings
        </button>

        <button id="changePasswordBtn">
            Change Password
        </button>

        <button id="logoutBtn">
            Logout
        </button>

    </section>

    <!-- Recent Posts -->

    <section class="recent-posts">

        <h3>Recent Posts</h3>

        <div id="postsContainer">

            <p class="empty-posts">
                You haven't posted anything yet.
            </p>

        </div>

    </section>

    <script src="profile.js"></script>

</body>
</html>
