<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gene-rations | Events</title>


<style>

/* ==================================================
   BASIC
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family: Arial, sans-serif;

    background: #f3f5fb;

    color: #222;

}


/* ==================================================
   HEADER
================================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    padding: 15px 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    position: sticky;

    top: 0;

    z-index: 100;

}

.logo {

    font-size: 22px;

    font-weight: bold;

}

.header-buttons {

    display: flex;

    gap: 8px;

}

.header-btn {

    border: none;

    background:
        rgba(255,255,255,.18);

    color: white;

    padding: 9px 14px;

    border-radius: 20px;

    font-weight: bold;

    cursor: pointer;

}


/* ==================================================
   MAIN
================================================== */

.container {

    max-width: 1050px;

    margin: auto;

    padding: 20px;

}


/* ==================================================
   INTRO
================================================== */

.intro {

    background: white;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 18px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.06);

}

.intro h1 {

    font-size: 28px;

    margin-bottom: 7px;

}

.intro p {

    color: #777;

    line-height: 1.5;

}

.generation-badge {

    display: inline-block;

    margin-top: 10px;

    padding: 7px 13px;

    border-radius: 20px;

    background: #ede9fe;

    color: #6d28d9;

    font-size: 13px;

    font-weight: bold;

}


/* ==================================================
   TOP BAR
================================================== */

.top-bar {

    display: flex;

    gap: 10px;

    margin-bottom: 15px;

}

.search {

    flex: 1;

}

.search input {

    width: 100%;

    padding: 13px;

    border: 1px solid #ddd;

    border-radius: 11px;

    outline: none;

    font-size: 14px;

}

.search input:focus {

    border-color: #2563eb;

}

.create-btn {

    border: none;

    background: #2563eb;

    color: white;

    padding: 0 18px;

    border-radius: 11px;

    font-weight: bold;

    cursor: pointer;

}


/* ==================================================
   FILTERS
================================================== */

.filters {

    display: flex;

    gap: 8px;

    overflow-x: auto;

    margin-bottom: 20px;

}

.filter-btn {

    border: none;

    background: white;

    color: #555;

    padding: 10px 16px;

    border-radius: 20px;

    white-space: nowrap;

    cursor: pointer;

    font-weight: bold;

}

.filter-btn.active {

    background: #2563eb;

    color: white;

}


/* ==================================================
   EVENT GRID
================================================== */

.event-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;

}


/* ==================================================
   EVENT CARD
================================================== */

.event-card {

    background: white;

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 4px 15px rgba(0,0,0,.06);

}


/* ==================================================
   EVENT COVER
================================================== */

.event-cover {

    height: 150px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    padding: 18px;

    position: relative;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

}

.event-icon {

    font-size: 38px;

}

.event-type {

    position: absolute;

    top: 15px;

    right: 15px;

    background:
        rgba(255,255,255,.18);

    padding: 6px 9px;

    border-radius: 15px;

    font-size: 11px;

    font-weight: bold;

}


/* ==================================================
   EVENT DATE
================================================== */

.event-date {

    background: white;

    color: #2563eb;

    width: 55px;

    text-align: center;

    border-radius: 9px;

    padding: 6px;

}

.event-month {

    font-size: 10px;

    font-weight: bold;

    text-transform: uppercase;

}

.event-day {

    font-size: 22px;

    font-weight: bold;

}


/* ==================================================
   EVENT INFO
================================================== */

.event-info {

    padding: 16px;

}

.event-title {

    font-size: 18px;

    font-weight: bold;

    line-height: 1.3;

    margin-bottom: 7px;

}

.event-description {

    color: #666;

    font-size: 13px;

    line-height: 1.45;

    margin-bottom: 12px;

}

.event-detail {

    display: flex;

    gap: 8px;

    margin-bottom: 8px;

    color: #555;

    font-size: 13px;

}

.event-detail span:first-child {

    width: 20px;

}


/* ==================================================
   EVENT FOOTER
================================================== */

.event-footer {

    border-top: 1px solid #eee;

    padding-top: 12px;

    margin-top: 12px;

}

.event-organizer {

    font-size: 12px;

    color: #777;

    margin-bottom: 10px;

}

.event-actions {

    display: flex;

    gap: 7px;

}

.event-action {

    flex: 1;

    padding: 9px;

    border: none;

    border-radius: 9px;

    cursor: pointer;

    font-weight: bold;

    font-size: 12px;

}

.interested-btn {

    background: #f1f5f9;

    color: #444;

}

.going-btn {

    background: #2563eb;

    color: white;

}

.details-btn {

    background: #ede9fe;

    color: #6d28d9;

}


/* ==================================================
   EMPTY
================================================== */

.empty {

    display: none;

    background: white;

    padding: 50px 20px;

    border-radius: 18px;

    text-align: center;

    color: #777;

}

.empty-icon {

    font-size: 50px;

    margin-bottom: 10px;

}


/* ==================================================
   MODAL
================================================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.6);

    z-index: 500;

    align-items: flex-end;

    justify-content: center;

}

.modal-box {

    background: white;

    width: 100%;

    max-width: 650px;

    max-height: 90vh;

    overflow-y: auto;

    padding: 22px;

    border-radius:
        22px 22px 0 0;

}

.modal-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 18px;

}

.close-btn {

    border: none;

    width: 38px;

    height: 38px;

    border-radius: 50%;

    background: #f1f5f9;

    cursor: pointer;

    font-size: 18px;

}


/* ==================================================
   FORM
================================================== */

.form-group {

    margin-bottom: 15px;

}

.form-group label {

    display: block;

    font-weight: bold;

    font-size: 14px;

    margin-bottom: 7px;

}

.form-group input,

.form-group textarea,

.form-group select {

    width: 100%;

    padding: 12px;

    border: 1px solid #ddd;

    border-radius: 10px;

    outline: none;

    font-family: inherit;

}

.form-group textarea {

    min-height: 90px;

    resize: vertical;

}

.form-row {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

}

.publish-btn {

    width: 100%;

    border: none;

    background: #2563eb;

    color: white;

    padding: 13px;

    border-radius: 10px;

    font-weight: bold;

    cursor: pointer;

}


/* ==================================================
   DETAILS
================================================== */

.detail-cover {

    height: 160px;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 60px;

    margin-bottom: 18px;

}

.detail-title {

    font-size: 25px;

    margin-bottom: 10px;

}

.detail-description {

    color: #666;

    line-height: 1.6;

    margin-bottom: 15px;

}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 700px) {

    .container {

        padding: 14px;

    }

    .event-grid {

        grid-template-columns: 1fr;

    }

    .top-bar {

        flex-direction: column;

    }

    .create-btn {

        padding: 12px;

    }

    .form-row {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">

    <div class="logo">
        Gene-rations
    </div>


    <div class="header-buttons">

        <button
            class="header-btn"
            onclick="goHome()">

            Generation Hub

        </button>

    </div>

</header>



<main class="container">


<!-- ==================================================
     INTRO
================================================== -->

<section class="intro">

    <h1>
        Events
    </h1>

    <p id="introText">

        Discover events happening within
        Gene-rations and connect with people
        from your generation and beyond.

    </p>


    <span
        id="generationBadge"
        class="generation-badge">

        Loading...

    </span>

</section>



<!-- ==================================================
     SEARCH + CREATE
================================================== -->

<div class="top-bar">

    <div class="search">

        <input
            id="eventSearch"
            type="search"
            placeholder="Search events...">

    </div>


    <button
        class="create-btn"
        onclick="openCreateEvent()">

        + Create Event

    </button>

</div>



<!-- ==================================================
     FILTERS
================================================== -->

<div class="filters">

    <button
        class="filter-btn active"
        onclick="setFilter('all', this)">

        All Events

    </button>


    <button
        class="filter-btn"
        onclick="setFilter('generation', this)">

        My Generation

    </button>


    <button
        class="filter-btn"
        onclick="setFilter('online', this)">

        Online

    </button>


    <button
        class="filter-btn"
        onclick="setFilter('local', this)">

        Local

    </button>


    <button
        class="filter-btn"
        onclick="setFilter('mine', this)">

        My Events

    </button>

</div>



<!-- ==================================================
     EVENTS
================================================== -->

<div
    id="eventGrid"
    class="event-grid">

</div>



<!-- ==================================================
     EMPTY
================================================== -->

<div
    id="empty"
    class="empty">

    <div class="empty-icon">
        📅
    </div>

    <h2>
        No events found
    </h2>

    <p>
        Try another search or category.
    </p>

</div>


</main>



<!-- ==================================================
     CREATE EVENT MODAL
================================================== -->

<div
    id="createModal"
    class="modal">


<div class="modal-box">


<div class="modal-header">

    <h2>
        Create Event
    </h2>


    <button
        class="close-btn"
        onclick="closeCreateEvent()">

        ✕

    </button>

</div>


<div class="form-group">

    <label>
        Event name
    </label>

    <input
        id="eventTitle"
        type="text"
        maxlength="100"
        placeholder="Enter event name">

</div>



<div class="form-group">

    <label>
        Description
    </label>

    <textarea
        id="eventDescription"
        placeholder="Describe your event"></textarea>

</div>



<div class="form-row">


    <div class="form-group">

        <label>
            Date
        </label>

        <input
            id="eventDate"
            type="date">

    </div>


    <div class="form-group">

        <label>
            Time
        </label>

        <input
            id="eventTime"
            type="time">

    </div>


</div>



<div class="form-group">

    <label>
        Event type
    </label>

    <select id="eventType">

        <option value="online">
            Online
        </option>

        <option value="local">
            Local / Physical
        </option>

    </select>

</div>



<div class="form-group">

    <label>
        Location or meeting link
    </label>

    <input
        id="eventLocation"
        type="text"
        placeholder="Enter location or online meeting information">

</div>



<div class="form-group">

    <label>
        Audience
    </label>

    <select id="eventAudience">

        <option value="generation">
            My Generation
        </option>

        <option value="all">
            All Generations
        </option>

    </select>

</div>



<button
    class="publish-btn"
    onclick="createEvent()">

    Create Event

</button>


</div>

</div>



<!-- ==================================================
     EVENT DETAILS MODAL
================================================== -->

<div
    id="detailsModal"
    class="modal">


<div class="modal-box">


<div class="modal-header">

    <h2>
        Event Details
    </h2>


    <button
        class="close-btn"
        onclick="closeDetails()">

        ✕

    </button>

</div>


<div
    id="detailsContent">

</div>


</div>

</div>



<script>

/* ==================================================
   USER
================================================== */

const storedUser =
    localStorage.getItem("userData");


if (!storedUser) {

    window.location.href =
        "login.html";

}


const user =
    JSON.parse(storedUser);


const userName =
    user.fullName ||
    user.name ||
    "Gene-rations Member";


const generation =
    user.generation ||
    "Your Generation";


document.getElementById(
    "generationBadge"
).textContent =
    generation;


/* ==================================================
   EVENTS
================================================== */

let events =
    JSON.parse(
        localStorage.getItem("events")
    ) || [];


let currentFilter =
    "all";


/* ==================================================
   DEFAULT TEST EVENTS
================================================== */

if (events.length === 0) {

    const today =
        new Date();


    const event1 =
        new Date(today);

    event1.setDate(
        today.getDate() + 3
    );


    const event2 =
        new Date(today);

    event2.setDate(
        today.getDate() + 8
    );


    const event3 =
        new Date(today);

    event3.setDate(
        today.getDate() + 15
    );


    events = [

        {

            id: 1,

            title:
                "Gene-rations Community Meetup",

            description:
                "Connect with members of your generation, share ideas and discuss how different generations can work together.",

            date:
                event1.toISOString()
                    .split("T")[0],

            time:
                "15:00",

            type:
                "online",

            location:
                "Gene-rations Online",

            audience:
                "generation",

            generation:
                generation,

            organizer:
                "Gene-rations Community",

            going:
                12,

            interested:
                25,

            userGoing:
                false,

            userInterested:
                false

        },


        {

            id: 2,

            title:
                "Ideas Across Generations",

            description:
                "A cross-generational discussion about ideas, technology, experiences and the future.",

            date:
                event2.toISOString()
                    .split("T")[0],

            time:
                "18:00",

            type:
                "online",

            location:
                "Gene-rations Online",

            audience:
                "all",

            generation:
                "All Generations",

            organizer:
                "Gene-rations Community",

            going:
                30,

            interested:
                44,

            userGoing:
                false,

            userInterested:
                false

        },


        {

            id: 3,

            title:
                "Generation Community Day",

            description:
                "A physical community gathering where members can meet, network and build relationships.",

            date:
                event3.toISOString()
                    .split("T")[0],

            time:
                "10:00",

            type:
                "local",

            location:
                "Community Centre",

            audience:
                "generation",

            generation:
                generation,

            organizer:
                userName,

            going:
                8,

            interested:
                16,

            userGoing:
                false,

            userInterested:
                false

        }

    ];


    saveEvents();

}


/* ==================================================
   RENDER EVENTS
================================================== */

function renderEvents(
    search = ""
) {

    const grid =
        document.getElementById(
            "eventGrid"
        );


    grid.innerHTML =
        "";


    const today =
        new Date();

    today.setHours(
        0,0,0,0
    );


    let filtered =
        events.filter(
            function(event) {

                const eventDate =
                    new Date(
                        event.date
                    );

                return eventDate >=
                    today;

            }
        );


    /* =========================
       FILTER
    ========================= */

    if (
        currentFilter ===
        "generation"
    ) {

        filtered =
            filtered.filter(
                function(event) {

                    return (
                        event.generation ===
                        generation
                    ) ||
                    (
                        event.audience ===
                        "generation"
                    );

                }
            );

    }


    else if (
        currentFilter ===
        "online"
    ) {

        filtered =
            filtered.filter(
                function(event) {

                    return event.type ===
                        "online";

                }
            );

    }


    else if (
        currentFilter ===
        "local"
    ) {

        filtered =
            filtered.filter(
                function(event) {

                    return event.type ===
                        "local";

                }
            );

    }


    else if (
        currentFilter ===
        "mine"
    ) {

        filtered =
            filtered.filter(
                function(event) {

                    return event.organizer ===
                        userName;

                }
            );

    }


    /* =========================
       SEARCH
    ========================= */

    filtered =
        filtered.filter(
            function(event) {

                const text =
                    (
                        event.title +
                        " " +
                        event.description +
                        " " +
                        event.location +
                        " " +
                        event.organizer
                    ).toLowerCase();


                return text.includes(
                    search.toLowerCase()
                );

            }
        );


    /* =========================
       EMPTY
    ========================= */

    if (
        filtered.length === 0
    ) {

        document.getElementById(
            "empty"
        ).style.display =
            "block";

        return;

    }


    document.getElementById(
        "empty"
    ).style.display =
        "none";


    /* =========================
       SORT
    ========================= */

    filtered.sort(
        function(a,b) {

            return new Date(a.date)
                -
                new Date(b.date);

        }
    );


    filtered.forEach(
        function(event) {

            grid.appendChild(
                createEventCard(
                    event
                )
            );

        }
    );

}


/* ==================================================
   EVENT CARD
================================================== */

function createEventCard(
    event
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "event-card";


    const date =
        new Date(
            event.date +
            "T" +
            (
                event.time ||
                "00:00"
            )
        );


    const month =
        date.toLocaleDateString(
            undefined,
            {
                month: "short"
            }
        );


    const day =
        date.getDate();


    const typeText =
        event.type === "online"
            ? "ONLINE"
            : "LOCAL";


    card.innerHTML = `

        <div class="event-cover">

            <div class="event-icon">

                ${
                    event.type === "online"
                        ? "💻"
                        : "📍"
                }

            </div>


            <div class="event-date">

                <div class="event-month">

                    ${month}

                </div>

                <div class="event-day">

                    ${day}

                </div>

            </div>


            <div class="event-type">

                ${typeText}

            </div>

        </div>


        <div class="event-info">


            <div class="event-title">

                ${escapeHTML(
                    event.title
                )}

            </div>


            <div class="event-description">

                ${escapeHTML(
                    event.description
                )}

            </div>


            <div class="event-detail">

                <span>🕐</span>

                <span>

                    ${formatTime(
                        event.time
                    )}

                </span>

            </div>


            <div class="event-detail">

                <span>

                    ${
                        event.type ===
                        "online"
                            ? "🌐"
                            : "📍"
                    }

                </span>

                <span>

                    ${escapeHTML(
                        event.location
                    )}

                </span>

            </div>


            <div class="event-detail">

                <span>
                    👥
                </span>

                <span>

                    ${
                        event.going
                    }
                    going ·
                    ${
                        event.interested
                    }
                    interested

                </span>

            </div>


            <div class="event-footer">


                <div class="event-organizer">

                    Organized by
                    <strong>
                        ${escapeHTML(
                            event.organizer
                        )}
                    </strong>

                </div>


                <div class="event-actions">


                    <button
                        class="event-action interested-btn"
                        onclick="toggleInterested(${event.id})">

                        ${
                            event.userInterested
                                ? "✓ Interested"
                                : "☆ Interested"
                        }

                    </button>


                    <button
                        class="event-action going-btn"
                        onclick="toggleGoing(${event.id})">

                        ${
                            event.userGoing
                                ? "✓ Going"
                                : "Going"
                        }

                    </button>


                    <button
                        class="event-action details-btn"
                        onclick="showDetails(${event.id})">

                        Details

                    </button>


                </div>

            </div>

        </div>

    `;


    return card;

}


/* ==================================================
   INTERESTED
================================================== */

function toggleInterested(
    id
) {

    const event =
        events.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!event)
        return;


    if (event.userInterested) {

        event.interested--;

        event.userInterested =
            false;

    }

    else {

        event.interested++;

        event.userInterested =
            true;

    }


    saveEvents();

    renderEvents(
        document.getElementById(
            "eventSearch"
        ).value
    );

}


/* ==================================================
   GOING
================================================== */

function toggleGoing(
    id
) {

    const event =
        events.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!event)
        return;


    if (event.userGoing) {

        event.going--;

        event.userGoing =
            false;

    }

    else {

        event.going++;

        event.userGoing =
            true;


        addNotification(
            "📅",
            "You are now going to " +
            event.title
        );

    }


    saveEvents();

    renderEvents(
        document.getElementById(
            "eventSearch"
        ).value
    );

}


/* ==================================================
   DETAILS
================================================== */

function showDetails(
    id
) {

    const event =
        events.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!event)
        return;


    const date =
        new Date(
            event.date
        );


    document.getElementById(
        "detailsContent"
    ).innerHTML = `

        <div class="detail-cover">

            ${
                event.type === "online"
                    ? "💻"
                    : "📍"
            }

        </div>


        <h2 class="detail-title">

            ${escapeHTML(
                event.title
            )}

        </h2>


        <p class="detail-description">

            ${escapeHTML(
                event.description
            )}

        </p>


        <div class="event-detail">

            <span>📅</span>

            <span>

                ${date.toLocaleDateString(
                    undefined,
                    {
                        weekday: "long",
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    }
                )}

            </span>

        </div>


        <div class="event-detail">

            <span>🕐</span>

            <span>

                ${formatTime(
                    event.time
                )}

            </span>

        </div>


        <div class="event-detail">

            <span>

                ${
                    event.type ===
                    "online"
                        ? "🌐"
                        : "📍"
                }

            </span>

            <span>

                ${escapeHTML(
                    event.location
                )}

            </span>

        </div>


        <div class="event-detail">

            <span>👥</span>

            <span>

                ${
                    event.going
                }
                going ·
                ${
                    event.interested
                }
                interested

            </span>

        </div>


        <div style="
            margin-top:18px;
            padding-top:15px;
            border-top:1px solid #eee;
        ">

            <p style="
                color:#777;
                font-size:13px;
            ">

                Organized by

            </p>


            <strong>

                ${escapeHTML(
                    event.organizer
                )}

            </strong>

        </div>


        <div style="
            margin-top:18px;
        ">

            <button
                class="going-btn event-action"
                style="width:100%;"
                onclick="toggleGoing(${event.id}); closeDetails();">

                ${
                    event.userGoing
                        ? "✓ You're Going"
                        : "I'm Going"
                }

            </button>

        </div>

    `;


    document.getElementById(
        "detailsModal"
    ).style.display =
        "flex";

}


function closeDetails() {

    document.getElementById(
        "detailsModal"
    ).style.display =
        "none";

}

/* ==================================================
   CREATE EVENT
================================================== */

function createEvent() {

    const title =
        document.getElementById(
            "eventTitle"
        ).value.trim();


    const description =
        document.getElementById(
            "eventDescription"
        ).value.trim();


    const date =
        document.getElementById(
            "eventDate"
        ).value;


    const time =
        document.getElementById(
            "eventTime"
        ).value;


    const type =
        document.getElementById(
            "eventType"
        ).value;


    const location =
        document.getElementById(
            "eventLocation"
        ).value.trim();


    const audience =
        document.getElementById(
            "eventAudience"
        ).value;


    if (!title) {

        alert(
            "Please enter an event name."
        );

        return;

    }


    if (!description) {

        alert(
            "Please enter an event description."
        );

        return;

    }


    if (!date) {

        alert(
            "Please select an event date."
        );

        return;

    }


    if (!time) {

        alert(
            "Please select an event time."
        );

        return;

    }


    if (!location) {

        alert(
            "Please enter a location or meeting information."
        );

        return;

    }


    const selectedDate =
        new Date(
            date +
            "T" +
            time
        );


    if (
        selectedDate <
        new Date()
    ) {

        alert(
            "Please choose a future date and time."
        );

        return;

    }


    const newEvent = {

        id:
            Date.now(),

        title:
            title,

        description:
            description,

        date:
            date,

        time:
            time,

        type:
            type,

        location:
            location,

        audience:
            audience,

        generation:
            audience === "generation"
                ? generation
                : "All Generations",

        organizer:
            userName,

        going:
            1,

        interested:
            0,

        userGoing:
            true,

        userInterested:
            false

    };


    events.unshift(
        newEvent
    );


    saveEvents();


    addNotification(
        "📅",
        "You created the event: " +
        title
    );


    clearCreateForm();

    closeCreateEvent();


    renderEvents();


    alert(
        "Your event has been created successfully."
    );

}

        );

    }

/* ==================================================
   NOTIFICATIONS
================================================== */

function addNotification(
    icon,
    text
) {

    let notifications =
        JSON.parse(
            localStorage.getItem(
                "notifications"
            )
        ) || [];


    notifications.unshift({

        id:
            Date.now(),

        type:
            "social",

        icon:
            icon,

        text:
            text,

        read:
            false,

        time:
            new Date().toISOString()

    });


    localStorage.setItem(
        "notifications",
        JSON.stringify(
            notifications
        )
    );

}


/* ==================================================
   SAVE
================================================== */

function saveEvents() {

    localStorage.setItem(
        "events",
        JSON.stringify(
            events
        )
    );

}


/* ==================================================
   TIME
================================================== */

function formatTime(
    time
) {

    if (!time)
        return "Time not set";


    const parts =
        time.split(":");


    let hour =
        parseInt(parts[0]);


    const minute =
        parts[1];


    const period =
        hour >= 12
            ? "PM"
            : "AM";


    hour =
        hour % 12 ||
        12;


    return (
        hour +
        ":" +
        minute +
        " " +
        period
    );

}


/* ==================================================
   SECURITY
================================================== */

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

   NAVIGATION
================================================== */

}
