<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gene-rations | Verify Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .verification-container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #1877f2;
            margin-bottom: 12px;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 15px auto 20px;
            border-radius: 50%;
            background: #eef5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            font-size: 24px;
            color: #222;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .contact {
            font-weight: bold;
            color: #1877f2;
            word-break: break-word;
        }

        .code-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            letter-spacing: 8px;
            outline: none;
            margin: 20px 0 15px;
        }

        .code-input:focus {
            border-color: #1877f2;
        }

        .verify-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1877f2;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .verify-button:hover {
            background: #0d65d9;
        }

        .resend {
            margin-top: 18px;
        }

        .resend button {
            border: none;
            background: transparent;
            color: #1877f2;
            font-size: 14px;
            cursor: pointer;
        }

        .resend button:disabled {
            color: #999;
            cursor: not-allowed;
        }

        .change-method {
            margin-top: 15px;
        }

        .change-method button {
            border: none;
            background: transparent;
            color: #555;
            cursor: pointer;
            text-decoration: underline;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.4;
        }

        .error {
            color: #d93025;
        }

        .success {
            color: #188038;
        }

        .login-link {
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #1877f2;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="verification-container">

    <div class="logo">
        Gene-rations
    </div>

    <div class="icon" id="verificationIcon">
        ✉️
    </div>

    <h1 id="verificationTitle">
        Verify Your Account
    </h1>

    <p class="description">
        Enter the verification code sent to:
        <br>
        <span class="contact" id="contactDisplay">
            Loading...
        </span>
    </p>

    <form id="verificationForm">

        <input
            type="text"
            id="verificationCode"
            class="code-input"
            placeholder="000000"
            inputmode="numeric"
            maxlength="6"
            autocomplete="one-time-code"
            required
        >

        <button
            type="submit"
            class="verify-button"
        >
            Verify Account
        </button>

    </form>

    <div class="resend">

        <button
            type="button"
            id="resendButton"
            disabled
        >
            Resend Code
        </button>

        <span id="countdown">
            60
        </span>

    </div>

    <div class="change-method">

        <button
            type="button"
            id="changeMethod"
        >
            Change verification method
        </button>

    </div>

    <div
        id="message"
        class="message"
    ></div>

    <div class="login-link">

        Already verified?

        <a href="login.html">
            Log In
        </a>

    </div>

</div>

<script>

/* ==========================================
   PENDING VERIFICATION
========================================== */

const pendingData =
    localStorage.getItem("pendingVerification");


/*
   Signup should have created this before
   sending the user here.
*/

if (!pendingData) {

    window.location.href =
        "signup.html";

}


/* ==========================================
   GET PENDING DATA
========================================== */

const pendingVerification =
    JSON.parse(pendingData);

const userEmail =
    pendingVerification.email;

const verificationMethod =
    pendingVerification.verificationMethod;


/* ==========================================
   ELEMENTS
========================================== */

const verificationIcon =
    document.getElementById(
        "verificationIcon"
    );

const verificationTitle =
    document.getElementById(
        "verificationTitle"
    );

const contactDisplay =
    document.getElementById(
        "contactDisplay"
    );

const verificationForm =
    document.getElementById(
        "verificationForm"
    );

const verificationCode =
    document.getElementById(
        "verificationCode"
    );

const resendButton =
    document.getElementById(
        "resendButton"
    );

const changeMethod =
    document.getElementById(
        "changeMethod"
    );

const countdown =
    document.getElementById(
        "countdown"
    );

const message =
    document.getElementById(
        "message"
    );


/* ==========================================
   MASK EMAIL
========================================== */

function maskEmail(email) {

    if (!email) {
        return "";
    }

    const parts =
        email.split("@");

    if (parts.length !== 2) {
        return email;
    }

    const name =
        parts[0];

    const domain =
        parts[1];

    let visibleName;

    if (name.length <= 2) {

        visibleName =
            name.charAt(0) +
            "••••";

    } else {

        visibleName =
            name.substring(0, 2) +
            "••••";

    }

    return (
        visibleName +
        "@" +
        domain
    );

}


/* ==========================================
   DISPLAY VERIFICATION
========================================== */

function updateVerificationDisplay() {

    if (
        verificationMethod ===
        "sms"
    ) {

        verificationIcon.textContent =
            "📱";

        verificationTitle.textContent =
            "Verify Your Phone";

        /*
           We currently only have the email
           inside pendingVerification.

           We will add phone here when we
           implement real SMS sending.
        */

        contactDisplay.textContent =
            "your registered phone number";

    }

    else {

        verificationIcon.textContent =
            "✉️";

        verificationTitle.textContent =
            "Verify Your Account";

        contactDisplay.textContent =
            maskEmail(userEmail);

    }

}


/* ==========================================
   INITIAL DISPLAY
========================================== */

updateVerificationDisplay();


/* ==========================================
   VERIFY ACCOUNT
========================================== */

verificationForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const code =
            verificationCode.value
                .trim();


        /* -------------------------------
           CODE VALIDATION
        -------------------------------- */

        if (
            !/^\d{6}$/.test(code)
        ) {

            showMessage(
                "Please enter the 6-digit verification code.",
                "error"
            );

            return;

        }


        /* -------------------------------
           BUTTON
        -------------------------------- */

        const verifyButton =
            verificationForm.querySelector(
                "button[type='submit']"
            );

        verifyButton.disabled =
            true;

        verifyButton.textContent =
            "Verifying...";


        showMessage(
            "Verifying your account...",
            ""
        );


        /* -------------------------------
           SEND TO BACKEND
        -------------------------------- */

        try {

            const response =
                await fetch(
                    "http://localhost:3000/api/auth/verify",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    userEmail,

                                code:
                                    code

                            })

                    }
                );


            const result =
                await response.json();


            /* -------------------------------
               VERIFICATION FAILED
            -------------------------------- */

            if (!response.ok) {

                showMessage(
                    result.message ||
                    "Verification failed.",
                    "error"
                );

                verifyButton.disabled =
                    false;

                verifyButton.textContent =
                    "Verify Account";

                return;

            }


            /* -------------------------------
               SUCCESS
            -------------------------------- */

            showMessage(
                "Account verified successfully! Redirecting to login...",
                "success"
            );


            /*
               Remove pending verification.
            */

            localStorage.removeItem(
                "pendingVerification"
            );


            /*
               Give the user a moment to see
               the success message.
            */

            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1000
            );

        }

        catch (error) {

            console.error(
                "Verification error:",
                error
            );


            showMessage(
                "Unable to connect to the Gene-rations server.",
                "error"
            );


            verifyButton.disabled =
                false;

            verifyButton.textContent =
                "Verify Account";

        }

    }
);


/* ==========================================
   RESEND CODE
========================================== */

let seconds = 60;

let timer;


function startCountdown() {

    seconds = 60;

    resendButton.disabled =
        true;

    countdown.textContent =
        seconds;


    clearInterval(timer);


    timer =
        setInterval(
            function() {

                seconds--;

                countdown.textContent =
                    seconds;


                if (
                    seconds <= 0
                ) {

                    clearInterval(timer);

                    resendButton.disabled =
                        false;

                    countdown.textContent =
                        "";

                }

            },
            1000
        );

}


startCountdown();


/* ==========================================
   RESEND
========================================== */

resendButton.addEventListener(
    "click",
    async function() {

        showMessage(
            "Resend functionality will be connected to the email/SMS service next.",
            "success"
        );

        startCountdown();

    }
);


/* ==========================================
   CHANGE METHOD
========================================== */

changeMethod.addEventListener(
    "click",
    function() {

        /*
           We are NOT changing the method
           locally anymore.

           The backend must be updated before
           switching from email to SMS or SMS
           to email.
        */

        showMessage(
            "Verification method switching will be connected to the backend next.",
            "error"
        );

    }
);


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message";

    if (type) {

        message.classList.add(
            type
        );

    }

}


/* ==========================================
   ONLY NUMBERS
========================================== */

verificationCode.addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    6
                );

    }
);


/* ==========================================
   ENTER KEY
========================================== */

verificationCode.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            verificationForm.requestSubmit();

        }

    }
);

  
</script>

</body>
</html>
