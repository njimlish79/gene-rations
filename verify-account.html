<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gene-rations | Verify Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f4f8ff, #ffffff);
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verification-container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .account-box {
            background: #f6f8ff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 22px;
            text-align: left;
        }

        .account-box strong {
            display: block;
            margin-bottom: 5px;
        }

        #verificationDestination {
            color: #555;
            word-break: break-word;
        }

        .code-input {
            width: 100%;
            padding: 16px;
            border: 2px solid #d9dce5;
            border-radius: 12px;
            font-size: 26px;
            letter-spacing: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .code-input:focus {
            border-color: #667eea;
        }

        .verify-button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            margin-top: 16px;
            background: #667eea;
            color: #fff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .verify-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            min-height: 24px;
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.error {
            color: #c62828;
        }

        .message.success {
            color: #188038;
        }

        .helper {
            margin-top: 22px;
            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .debug-info {
            display: none;
        }

        @media (max-width: 480px) {
            .verification-container {
                padding: 28px 18px;
            }

            h1 {
                font-size: 24px;
            }

            .code-input {
                font-size: 22px;
                letter-spacing: 6px;
            }
        }
    </style>
</head>

<body>

    <main class="verification-container">

        <div class="logo">🌍</div>

        <h1>Verify Your Account</h1>

        <p class="subtitle">
            Enter the 6-digit verification code sent to your selected
            verification method.
        </p>

        <div class="account-box">
            <strong>Verification destination</strong>
            <span id="verificationDestination">Loading...</span>
        </div>

        <form id="verificationForm">

            <input
                type="text"
                id="verificationCode"
                class="code-input"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="000000"
                aria-label="6-digit verification code"
                required
            >

            <button
                type="submit"
                id="verifyButton"
                class="verify-button"
            >
                Verify Account
            </button>

        </form>

        <div
            id="message"
            class="message"
            role="alert"
            aria-live="polite"
        ></div>

        <p class="helper">
            The verification code expires after 10 minutes.
            Use the code displayed by your local Gene-rations backend
            during testing.
        </p>

        <a href="signup.html" class="back-link">
            ← Back to Sign Up
        </a>

        <!--
            The following values are intentionally kept hidden.
            They are populated from localStorage and used for verification.
        -->
        <div class="debug-info">
            <span id="userId"></span>
            <span id="verificationMethod"></span>
        </div>

    </main>

    <script>
        /*
        ============================================================
        GENE-RATIONS ACCOUNT VERIFICATION
        ============================================================

        IMPORTANT:
        The backend endpoint /api/auth/verify expects:

            {
                userId: "...",
                code: "......"
            }

        NOT:

            {
                email: "...",
                code: "......"
            }

        Signup already stores the backend userId in:

            localStorage.pendingVerification.userId
        ============================================================
        */

        const API_BASE_URL =
            "http://localhost:3000";

        const pendingData =
            localStorage.getItem("pendingVerification");

        const destinationElement =
            document.getElementById(
                "verificationDestination"
            );

        const verificationForm =
            document.getElementById(
                "verificationForm"
            );

        const codeInput =
            document.getElementById(
                "verificationCode"
            );

        const verifyButton =
            document.getElementById(
                "verifyButton"
            );

        const messageElement =
            document.getElementById(
                "message"
            );

        const userIdElement =
            document.getElementById(
                "userId"
            );

        const methodElement =
            document.getElementById(
                "verificationMethod"
            );


        /*
        ============================================================
        LOAD PENDING VERIFICATION
        ============================================================
        */

        if (!pendingData) {

            destinationElement.textContent =
                "No pending verification found.";

            showMessage(
                "Your verification session is missing. Please create your account again.",
                "error"
            );

            verifyButton.disabled = true;

        } else {

            try {

                const pendingVerification =
                    JSON.parse(
                        pendingData
                    );

                /*
                ----------------------------------------------------
                THIS IS THE IMPORTANT FIX
                ----------------------------------------------------
                Get the USER ID returned by the backend during signup.
                */

                const userId =
                    pendingVerification.userId;

                const userEmail =
                    pendingVerification.email;

                const userPhone =
                    pendingVerification.phone;

                const verificationMethod =
                    pendingVerification.verificationMethod;


                /*
                ----------------------------------------------------
                Validate the stored verification information.
                ----------------------------------------------------
                */

                if (!userId) {

                    console.error(
                        "Gene-rations verification error: userId is missing.",
                        pendingVerification
                    );

                    showMessage(
                        "Your verification information is incomplete. Please sign up again.",
                        "error"
                    );

                    verifyButton.disabled = true;

                } else {

                    userIdElement.textContent =
                        userId;

                    methodElement.textContent =
                        verificationMethod || "email";


                    /*
                    ------------------------------------------------
                    Display the selected verification destination.
                    Only ONE method is used per signup.
                    ------------------------------------------------
                    */

                    if (
                        verificationMethod ===
                        "sms"
                    ) {

                        destinationElement.textContent =
                            userPhone ||
                            "your registered phone number";

                    } else {

                        destinationElement.textContent =
                            userEmail ||
                            "your registered email address";
                    }


                    /*
                    ------------------------------------------------
                    Store the values for form submission.
                    ------------------------------------------------
                    */

                    verificationForm.dataset.userId =
                        userId;

                }

            } catch (error) {

                console.error(
                    "Unable to read pendingVerification:",
                    error
                );

                showMessage(
                    "The saved verification information is invalid. Please sign up again.",
                    "error"
                );

                verifyButton.disabled = true;
            }
        }


        /*
        ============================================================
        VERIFY ACCOUNT
        ============================================================
        */

        verificationForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const code =
                    codeInput.value.trim();

                const userId =
                    verificationForm.dataset.userId;


                /*
                ----------------------------------------------------
                Validate user ID
                ----------------------------------------------------
                */

                if (!userId) {

                    showMessage(
                        "User verification ID is missing. Please sign up again.",
                        "error"
                    );

                    return;
                }


                /*
                ----------------------------------------------------
                Validate six-digit code
                ----------------------------------------------------
                */

                if (!/^\d{6}$/.test(code)) {

                    showMessage(
                        "Please enter the 6-digit verification code.",
                        "error"
                    );

                    codeInput.focus();

                    return;
                }


                /*
                ----------------------------------------------------
                Prevent double submission
                ----------------------------------------------------
                */

                verifyButton.disabled = true;

                verifyButton.textContent =
                    "Verifying...";

                clearMessage();


                try {

                    /*
                    =================================================
                    IMPORTANT FIX
                    =================================================

                    The backend expects USER ID + CODE.

                    We deliberately do NOT send email here.
                    =================================================
                    */

                    const response =
                        await fetch(
                            API_BASE_URL +
                            "/api/auth/verify",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        userId:
                                            userId,

                                        code:
                                            code
                                    })
                            }
                        );


                    /*
                    ------------------------------------------------
                    Read the backend response safely.
                    ------------------------------------------------
                    */

                    let result = {};

                    try {

                        result =
                            await response.json();

                    } catch (jsonError) {

                        console.error(
                            "Invalid server response:",
                            jsonError
                        );

                        throw new Error(
                            "The Gene-rations server returned an invalid response."
                        );
                    }


                    /*
                    ------------------------------------------------
                    Backend returned an error.
                    ------------------------------------------------
                    */

                    if (!response.ok) {

                        showMessage(
                            result.message ||
                            "Account verification failed.",
                            "error"
                        );

                        verifyButton.disabled =
                            false;

                        verifyButton.textContent =
                            "Verify Account";

                        return;
                    }


                    /*
                    ------------------------------------------------
                    Verification succeeded.
                    ------------------------------------------------
                    */

                    if (result.success) {

                        showMessage(
                            "Account verified successfully! Redirecting...",
                            "success"
                        );


                        /*
                        Remove the temporary verification data.
                        The account is now verified.
                        */

                        localStorage.removeItem(
                            "pendingVerification"
                        );


                        /*
                        Give the success message a moment
                        before moving to login.
                        */

                        setTimeout(
                            function () {

                                window.location.href =
                                    "login.html";

                            },
                            1200
                        );

                        return;
                    }


                    /*
                    ------------------------------------------------
                    Unexpected successful HTTP response.
                    ------------------------------------------------
                    */

                    showMessage(
                        "The account could not be verified.",
                        "error"
                    );

                    verifyButton.disabled =
                        false;

                    verifyButton.textContent =
                        "Verify Account";

                } catch (error) {

                    console.error(
                        "Gene-rations verification request failed:",
                        error
                    );


                    /*
                    This message is only used when the browser
                    cannot reach the backend at all.

                    It is different from backend errors such as:
                        "User account not found."
                        "Invalid verification code."
                        "Verification code has expired."
                    */

                    showMessage(
                        "Unable to connect to the Gene-rations server. Make sure the backend is running on http://localhost:3000.",
                        "error"
                    );

                    verifyButton.disabled =
                        false;

                    verifyButton.textContent =
                        "Verify Account";
                }

            }
        );


        /*
        ============================================================
        INPUT: ALLOW DIGITS ONLY
        ============================================================
        */

        codeInput.addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .slice(0, 6);

            }
        );


        /*
        ============================================================
        MESSAGE HELPERS
        ============================================================
        */

        function showMessage(
            text,
            type
        ) {

            messageElement.textContent =
                text;

            messageElement.className =
                "message " +
                (type || "");

        }


        function clearMessage() {

            messageElement.textContent =
                "";

            messageElement.className =
                "message";

        }
    </script>

</body>
</html>
