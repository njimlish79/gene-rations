<style>

  /* ==================================================
   GENE-RATIONS — DYNAMIC GENERATION THEME
================================================== */

:root {

    --generation-primary: #1769e0;

    --generation-secondary: #8137e8;

    --generation-light:
        color-mix(
            in srgb,
            var(--generation-secondary) 8%,
            white
        );

    --generation-soft:
        color-mix(
            in srgb,
            var(--generation-secondary) 15%,
            white
        );

    --generation-dark:
        color-mix(
            in srgb,
            var(--generation-primary) 75%,
            black
        );
}


/* ==================================================
   RESET
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* ==================================================
   BODY
================================================== */

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--generation-light);

    color: #252525;

    min-height: 100vh;

    transition:
        background 0.4s ease,
        color 0.4s ease;
}


/* ==================================================
   HEADER
================================================== */

.header {

    background:
        linear-gradient(
            135deg,
            var(--generation-primary),
            var(--generation-secondary)
        );

    color: white;

    padding: 18px 24px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    position: sticky;

    top: 0;

    z-index: 100;

    box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.12);

    transition:
        background 0.4s ease;
}


/* ==================================================
   LOGO
================================================== */

.logo {

    font-size: 25px;

    font-weight: 800;
}


/* ==================================================
   HEADER ACTIONS
================================================== */

.header-actions {

    display: flex;

    align-items: center;

    gap: 10px;
}


.header-btn {

    background:

            255,
            255,
            255,
            0.18
        );

    padding: 12px 16px;

    border-radius: 30px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}


.header-btn:hover {

        rgba(
            255,
            255,
            255,
            0.30
        );

    transform:
        translateY(-2px);
}


.profile-btn {

    color:

}


/* ==================================================
   MAIN
================================================== */

.container {

    max-width: 1050px;

    margin: auto;

    padding:
        25px 18px 50px;
}


/* ==================================================
   GENERATION HERO
================================================== */

.generation-hero {

    border-radius: 30px;

        );

        box-shadow 0.4s ease;
}


/* ==================================================
   HERO CIRCLE
================================================== */

.hero-circle {

    position: absolute;

    width: 300px;

    height: 300px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            0.08
        );

    right: -80px;

    top: -120px;
}


.hero-content {

    z-index: 2;
}


/* ==================================================
   HERO TEXT
================================================== */

.welcome {

    margin-bottom: 8px;

.full-name {

/* ==================================================
   GENERATION BADGE
================================================== */

.generation-badge {

/* ==================================================
   STATISTICS
================================================== */

.stats {

        repeat(4, 1fr);

    gap: 15px;

.stat-card {

<script>

/* ==================================================
   GENE-RATIONS — GENERATION HUB
   BACKEND CONNECTED VERSION
================================================== */


/* ==================================================
   CONFIGURATION
================================================== */

const API_BASE_URL =
    "http://localhost:3000";


/* ==================================================
   NAVIGATION
================================================== */

function openPage(page) {

    window.location.href = page;

}


/* ==================================================
   GET STORED USER
================================================== */

function getStoredUser() {

    const storedUser =
        localStorage.getItem("userData");

    if (!storedUser) {

        return null;

    }

    try {

        return JSON.parse(storedUser);

    }

    catch (error) {

        console.error(
            "Invalid userData:",
            error
        );

        localStorage.removeItem(
            "userData"
        );

        return null;

    }

}


/* ==================================================
   SAVE USER
================================================== */

function saveUser(user) {

    if (!user) {

        return;

    }

    localStorage.setItem(
        "userData",
        JSON.stringify(user)
    );

}


/* ==================================================
   GET USER ID
================================================== */

function getUserId() {

    const user =
        getStoredUser();

    if (!user) {

        return null;

    }

    return (
        user.id ||
        user.userId ||
        null
    );

}


/* ==================================================
   GENERATION FALLBACK
================================================== */

function calculateGeneration(age) {

    age = Number(age);

    if (age >= 65) {

        return "Silent Generation";

    }

    if (age >= 45) {

        return "Generation X";

    }

    if (age >= 29) {

        return "Millennial";

    }

    if (age >= 13) {

        return "Generation Z";

    }

    return "Generation Alpha";

}


/* ==================================================
   SAFE COUNT
================================================== */

function getCount(value) {

    if (Array.isArray(value)) {

        return value.length;

    }

    if (
        typeof value === "number" &&
        Number.isFinite(value)
    ) {

        return value;

    }

    return 0;

}


/* ==================================================
   SET TEXT SAFELY
================================================== */

function setText(
    elementId,
    value,
    fallback = ""
) {

    const element =
        document.getElementById(
            elementId
        );

    if (!element) {

        return;

    }

    element.textContent =
        value ??
        fallback;

}


/* ==================================================
   GET GENERATION INFORMATION
================================================== */

function getHubGenerationInfo(
    generation
) {

    if (
        typeof getGenerationData ===
        "function"
    ) {

        try {

            const data =
                getGenerationData(
                    generation
                );

            if (data) {

                return data;

            }

        }

        catch (error) {

            console.warn(
                "Generation data error:",
                error
            );

        }

    }


    return {

        name:
            generation ||
            "Gene-rations",

        badge:
            `🏷️ ${
                generation ||
                "Gene-rations"
            }`,

        welcome:
            `Welcome to the ${
                generation ||
                "Gene-rations"
            } community.`,

        description:
            `Connect, share ideas and build meaningful relationships with members of ${
                generation ||
                "your generation"
            }.`

    };

}


/* ==================================================
   DISPLAY USER ON HUB
================================================== */

function displayHubUser(user) {

    if (!user) {

        return;

    }


    /* ------------------------------------------
       GENERATION
    ------------------------------------------ */

    let generation =
        user.generation;


    if (!generation) {

        generation =
            calculateGeneration(
                user.age
            );

    }


    const generationInfo =
        getHubGenerationInfo(
            generation
        );


    /* ------------------------------------------
       NAME
    ------------------------------------------ */

    const fullName =
        user.fullName ||
        user.name ||
        "Gene-rations Member";


    setText(
        "fullName",
        fullName,
        "Gene-rations Member"
    );


    setText(
        "welcome",
        `Welcome back, ${fullName}`,
        "Welcome back"
    );


    /* ------------------------------------------
       GENERATION NAME
    ------------------------------------------ */

    setText(
        "generationName",
        generationInfo.name ||
        generation,
        generation
    );


    /* ------------------------------------------
       GENERATION BADGE
    ------------------------------------------ */

    setText(
        "generationBadge",
        user.generationBadge ||
        generationInfo.badge ||
        `🏷️ ${generation}`,
        `🏷️ ${generation}`
    );


    /* ------------------------------------------
       GENERATION WELCOME
    ------------------------------------------ */

    setText(
        "generationWelcome",
        generationInfo.welcome ||
        `Welcome to the ${generation} community.`,
        `Welcome to the ${generation} community.`
    );


    /* ------------------------------------------
       GENERATION DESCRIPTION
    ------------------------------------------ */

    setText(
        "generationDescription",
        user.generationDescription ||
        generationInfo.description ||
        "",
        ""
    );


    /* ------------------------------------------
       FOLLOWERS
    ------------------------------------------ */

    setText(
        "followersCount",
        getCount(user.followers),
        "0"
    );


    /* ------------------------------------------
       FOLLOWING
    ------------------------------------------ */

    setText(
        "followingCount",
        getCount(user.following),
        "0"
    );


    /* ------------------------------------------
       POSTS
    ------------------------------------------ */

    setText(
        "postsCount",
        getCount(user.posts),
        "0"
    );


    /* ------------------------------------------
       COMMUNITIES
    ------------------------------------------ */

    setText(
        "communitiesCount",
        getCount(user.communities),
        "0"
    );


    /* ------------------------------------------
       APPLY GENERATION THEME
    ------------------------------------------ */

    if (
        typeof applyGenerationTheme ===
        "function"
    ) {

        try {

            applyGenerationTheme(
                generation
            );

        }

        catch (error) {

            console.warn(
                "Generation theme error:",
                error
            );

        }

    }


    /* ------------------------------------------
       SAVE LATEST USER
    ------------------------------------------ */

    saveUser({

        ...user,

        generation:
            generation

    });


    console.log(
        "Gene-rations Hub user:",
        user
    );

}


/* ==================================================
   SHOW DORMANT ACCOUNT
================================================== */

function handleDormantAccount(
    message
) {

    alert(
        message ||
        "Your Gene-rations account is dormant. Please reactivate your account."
    );


    localStorage.removeItem(
        "loginSession"
    );


    window.location.href =
        "login.html";

}


/* ==================================================
   FETCH USER FROM BACKEND
================================================== */

async function fetchHubUser(
    userId
) {

    const response =
        await fetch(
            `${API_BASE_URL}/api/user/${encodeURIComponent(userId)}`,
            {
                method: "GET",

                headers: {
                    "Accept":
                        "application/json"
                }
            }
        );


    let data = null;


    try {

        data =
            await response.json();

    }

    catch (error) {

        data = null;

    }


    /* ------------------------------------------
       DORMANT ACCOUNT
    ------------------------------------------ */

    if (
        response.status === 403 &&
        data &&
        data.dormant
    ) {

        handleDormantAccount(
            data.message
        );

        return null;

    }


    /* ------------------------------------------
       OTHER BACKEND ERRORS
    ------------------------------------------ */

    if (!response.ok) {

        throw new Error(
            data &&
            data.message
                ? data.message
                : `Backend error: ${response.status}`
        );

    }


    /* ------------------------------------------
       SUPPORT BOTH RESPONSE FORMATS
    ------------------------------------------ */

    if (
        data &&
        data.success &&
        data.user
    ) {

        return data.user;

    }


    if (data && data.id) {

        return data;

    }


    throw new Error(
        "The backend returned invalid user data."
    );

}


/* ==================================================
   LOAD HUB
================================================== */

async function loadGenerationHub() {

    const storedUser =
        getStoredUser();


    /* ------------------------------------------
       REQUIRE LOGIN
    ------------------------------------------ */

    if (!storedUser) {

        window.location.href =
            "login.html";

        return;

    }


    const userId =
        getUserId();


    if (!userId) {

        console.error(
            "No user ID found."
        );

        localStorage.removeItem(
            "userData"
        );

        localStorage.removeItem(
            "loginSession"
        );

        window.location.href =
            "login.html";

        return;

    }


    /* ------------------------------------------
       SHOW CACHED USER FIRST
       Makes the page feel instant.
    ------------------------------------------ */

    displayHubUser(
        storedUser
    );


    /* ------------------------------------------
       GET AUTHORITATIVE BACKEND DATA
    ------------------------------------------ */

    try {

        const backendUser =
            await fetchHubUser(
                userId
            );


        if (!backendUser) {

            return;

        }


        /* --------------------------------------
           UPDATE LOCAL DATA
        -------------------------------------- */

        saveUser(
            backendUser
        );


        /* --------------------------------------
           DISPLAY FRESH DATA
        -------------------------------------- */

        displayHubUser(
            backendUser
        );


        console.log(
            "Generation Hub connected to backend."
        );

    }

    catch (error) {

        console.error(
            "Generation Hub backend error:",
            error
        );


        /*
           We deliberately keep the cached
           profile visible if the backend is
           temporarily unavailable.
        */

        console.warn(
            "Using cached user data."
        );

    }

}


/* ==================================================
   LOGOUT
================================================== */

async function logoutUser() {

    const confirmLogout =
        confirm(
            "Are you sure you want to log out?"
        );


    if (!confirmLogout) {

        return;

    }


    const user =
        getStoredUser();


    /* ------------------------------------------
       INFORM BACKEND
    ------------------------------------------ */

    if (user && user.id) {

        try {

            await fetch(
                `${API_BASE_URL}/api/auth/logout`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            userId:
                                user.id
                        })
                }
            );

        }

        catch (error) {

            console.warn(
                "Backend logout notification failed:",
                error
            );

        }

    }


    /* ------------------------------------------
       CLEAR LOCAL SESSION
    ------------------------------------------ */

    localStorage.removeItem(
        "loginSession"
    );


    localStorage.removeItem(
        "userData"
    );


    /* ------------------------------------------
       RETURN TO LOGIN
    ------------------------------------------ */

    window.location.href =
        "login.html";

}


/* ==================================================
   LOGOUT BUTTON
================================================== */

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


if (logoutButton) {

    logoutButton.addEventListener(
        "click",
        logoutUser
    );

}


/* ==================================================
   REFRESH WHEN PAGE BECOMES VISIBLE
================================================== */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState ===
            "visible"
        ) {

            loadGenerationHub();

        }

    }
);


/* ==================================================
   START
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadGenerationHub();

    }
);

                  </script>
