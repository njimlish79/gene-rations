     GENERATION DATA
================================================== -->

<style>

/* ==================================================
   RESET
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f4f3ff;

    color: #252525;

    min-height: 100vh;
}


/* ==================================================
   HEADER
================================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #1769e0,
            #8137e8
        );

    color: white;

    padding: 18px 24px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    position: sticky;

    top: 0;

    z-index: 100;
}


.logo {

    font-size: 25px;

    font-weight: 800;
}


.header-actions {

    display: flex;

    align-items: center;

    gap: 10px;
}


.header-btn {

    border: none;

    background: rgba(
        255,
        255,
        255,
        0.18
    );

    color: white;

    padding: 12px 16px;

    border-radius: 30px;

    font-weight: bold;

    cursor: pointer;
}


.header-btn:hover {

    background: rgba(
        255,
        255,
        255,
        0.3
    );
}


.profile-btn {

    background: white;

    color: #7138dd;
}


/* ==================================================
   MAIN
================================================== */

.container {

    width: 100%;

    max-width: 1050px;

    margin: auto;

    padding: 25px 18px 50px;
}


/* ==================================================
   HERO
================================================== */

.generation-hero {

    position: relative;

    overflow: hidden;

    border-radius: 30px;

    padding: 38px 28px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #7138e8,
            #883de9
        );

    margin-bottom: 22px;

    box-shadow:
        0 12px 30px
        rgba(70, 40, 150, 0.18);
}


.hero-circle {

    position: absolute;

    width: 300px;

    height: 300px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            0.08
        );

    right: -80px;

    top: -120px;
}


.hero-content {

    position: relative;

    z-index: 2;
}


.welcome {

    font-size: 18px;

    margin-bottom: 8px;

    opacity: 0.9;
}


.full-name {

    font-size: 34px;

    font-weight: 800;

    margin-bottom: 18px;
}


.generation-badge {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding: 11px 18px;

    border-radius: 30px;

    background:
        rgba(
            255,
            255,
            255,
            0.18
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.35
        );

    font-weight: bold;

    margin-bottom: 22px;
}


.generation-name {

    font-size: 28px;

    font-weight: 800;

    margin-bottom: 12px;
}


.generation-welcome {

    font-size: 18px;

    margin-bottom: 10px;
}


.generation-description {

    font-size: 15px;

    line-height: 1.6;

    opacity: 0.92;

    max-width: 700px;
}


/* ==================================================
   STATISTICS
================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-bottom: 35px;
}


.stat-card {

    background: white;

    border-radius: 22px;

    padding: 25px 15px;

    text-align: center;

    box-shadow:
        0 8px 25px
        rgba(
            50,
            30,
            100,
            0.08
        );
}


.stat-number {

    font-size: 28px;

    font-weight: 800;

    color: #7439df;

    margin-bottom: 7px;
}


.stat-label {

    color: #777;

    font-size: 15px;
}


/* ==================================================
   SECTION
================================================== */

.section-title {

    font-size: 27px;

    color: #35165d;

    margin-bottom: 18px;
}


/* ==================================================
   MENU GRID
================================================== */

.menu-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 16px;
}


.menu-card {

    background: white;

    border-radius: 24px;

    padding: 25px;

    cursor: pointer;

    border: none;

    text-align: left;

    box-shadow:
        0 8px 25px
        rgba(
            50,
            30,
            100,
            0.08
        );

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}


.menu-card:hover {

    transform: translateY(-3px);

    box-shadow:
        0 12px 30px
        rgba(
            50,
            30,
            100,
            0.14
        );
}


.menu-icon {

    width: 55px;

    height: 55px;

    border-radius: 17px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #e5dcff;

    font-size: 27px;

    margin-bottom: 17px;
}


.menu-title {

    font-size: 19px;

    font-weight: 800;

    color: #321657;

    margin-bottom: 8px;
}


.menu-description {

    color: #777;

    line-height: 1.5;

    font-size: 14px;
}


/* ==================================================
   QUICK ACTIONS
================================================== */

.quick-actions {

    margin-top: 35px;

    background: white;

    border-radius: 25px;

    padding: 25px;

    box-shadow:
        0 8px 25px
        rgba(
            50,
            30,
            100,
            0.08
        );
}


.quick-title {

    font-size: 21px;

    font-weight: 800;

    margin-bottom: 18px;

    color: #35165d;
}


.quick-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;
}


.quick-button {

    border: none;

    padding: 12px 17px;

    border-radius: 25px;

    background: #eee9ff;

    color: #6632c5;

    font-weight: bold;

    cursor: pointer;

/* ==================================================
   LOGOUT
================================================== */

.logout-section {

    margin-top: 30px;

    text-align: center;
}


.logout {

    border: none;

    background: #e53935;

    color: white;

    padding: 14px 35px;

    border-radius: 30px;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;
}


/* ==================================================
   FOOTER
================================================== */

.footer {

    text-align: center;

    padding: 30px 20px;

    color: #777;

    font-size: 14px;
}


/* ==================================================
   LOADING
================================================== */

.loading {

    text-align: center;

    padding: 60px 20px;

    color: #777;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 700px) {

    .header {

        padding: 15px;

    }


    .logo {

        font-size: 21px;

    }


    .header-btn {

        padding: 10px 12px;

        font-size: 13px;

    }

        padding:
            18px 14px 40px;

    }


    .generation-hero {

        padding:
            30px 22px;

        border-radius: 25px;

    .generation-name {

    }

        grid-template-columns:
            repeat(2, 1fr);

    }


    .menu-grid {

        grid-template-columns: 1fr;

    }

}


/* ==================================================
   SMALL PHONES
================================================== */

@media (max-width: 400px) {

    .header-actions {

        gap: 5px;

    }


    .header-btn {

        padding:
            9px 10px;

    }


    .stats {

        gap: 10px;

    }


    .stat-card {

        padding:
            20px 10px;

    }

}

</style>

<!-- ==================================================
     PAGE JAVASCRIPT

<script>

/* ==================================================
   NAVIGATION
================================================== */

function openPage(page) {

    window.location.href = page;

}


/* ==================================================
   GET USER DATA
================================================== */

function getStoredUser() {

    const storedUser =
        localStorage.getItem("userData");


    if (!storedUser) {

        return null;

    }


    try {

        return JSON.parse(
            storedUser
        );

    }

    catch (error) {

        console.error(
            "Invalid userData:",
            error
        );

        return null;

    }

}


/* ==================================================
   GENERATION FALLBACK
   Used only if generation-engine.js
   is unavailable.
================================================== */

function calculateGeneration(age) {

    age = Number(age);


    if (age >= 65) {

        return "Silent Generation";

    }


    if (age >= 45) {

        return "Generation X";

    }


    if (age >= 29) {

        return "Millennial";

    }


    if (age >= 13) {

        return "Generation Z";

    }


    return "Generation Alpha";

}


/* ==================================================
   LOAD DYNAMIC GENERATION
================================================== */

function loadDynamicGeneration() {


    /* ------------------------------------------
       GET USER
    ------------------------------------------ */

    let user = null;


    if (
        typeof updateUserGeneration ===
        "function"
    ) {

        user =
            updateUserGeneration();

    }


    /*
       If generation-engine.js did not
       return the user, load directly.
    */

    if (!user) {

        user =
            getStoredUser();

    }


    /* ------------------------------------------
       NO USER
    ------------------------------------------ */

    if (!user) {

        window.location.href =
            "login.html";

        return;

    }


    /* ------------------------------------------
       GENERATION
    ------------------------------------------ */

    let generation =
        user.generation;


    /*
       Fallback if generation is missing.
    */

    if (!generation) {

        generation =
            calculateGeneration(
                user.age
            );

        user.generation =
            generation;

        localStorage.setItem(
            "userData",
            JSON.stringify(user)
        );

    }


    /* ------------------------------------------
       GENERATION DATA
    ------------------------------------------ */

    let generationInfo = null;


    if (
        typeof getGenerationData ===
        "function"
    ) {

        generationInfo =
            getGenerationData(
                generation
            );

    }


    /*
       Safe fallback.
    */

    if (!generationInfo) {

        generationInfo = {

            name:
                generation,

            badge:
                "🏷️ " + generation,

            welcome:
                `Welcome to the ${generation} community.`,

            description:
                `Connect, share ideas and build meaningful relationships with members of ${generation}.`

        };

    }


    /* ==================================================
       USER NAME
    ================================================== */

    const fullName =
        document.getElementById(
            "fullName"
        );


    if (fullName) {

        fullName.textContent =
            user.fullName ||
            user.name ||
            "Gene-rations Member";

    }


    /* ==================================================
       WELCOME
    ================================================== */

    const welcome =
        document.getElementById(
            "welcome"
        );


    if (welcome) {

        welcome.textContent =
            `Welcome back, ${
                user.fullName ||
                user.name ||
                "Member"
            }`;

    }


    /* ==================================================
       GENERATION NAME
    ================================================== */

    const generationName =
        document.getElementById(
            "generationName"
        );


    if (generationName) {

        generationName.textContent =
            generationInfo.name ||
            generation;

    }


    /* ==================================================
       GENERATION BADGE
    ================================================== */

    const badge =
        document.getElementById(
            "generationBadge"
        );


    if (badge) {

        badge.textContent =
            generationInfo.badge ||
            `🏷️ ${generation}`;

    }


    /* ==================================================
       GENERATION WELCOME
    ================================================== */

    const generationWelcome =
        document.getElementById(
            "generationWelcome"
        );


    if (generationWelcome) {

        generationWelcome.textContent =
            generationInfo.welcome ||
            `Welcome to the ${generation} community.`;

    }


    /* ==================================================
       DESCRIPTION
    ================================================== */

    const description =
        document.getElementById(
            "generationDescription"
        );


    if (description) {

        description.textContent =
            generationInfo.description ||
            "";

    }


    /* ==================================================
       AGE
    ================================================== */

    const ageElement =
        document.getElementById(
            "age"
        );


    if (ageElement) {

        ageElement.textContent =
            user.age ?? "—";

    }


    /* ==================================================
       PROFILE PHOTO
    ================================================== */

    const profilePhoto =
        document.getElementById(
            "profilePhoto"
        );


    if (
        profilePhoto &&
        user.profilePhoto
    ) {

        profilePhoto.src =
            user.profilePhoto;

    }


    /* ==================================================
       FOLLOWERS
    ================================================== */

    const followers =
        document.getElementById(
            "followersCount"
        );


    if (followers) {

        followers.textContent =
            Array.isArray(
                user.followers
            )
                ? user.followers.length
                : 0;

    }


    /* ==================================================
       FOLLOWING
    ================================================== */

    const following =
        document.getElementById(
            "followingCount"
        );


    if (following) {

        following.textContent =
            Array.isArray(
                user.following
            )
                ? user.following.length
                : 0;

    }


    /* ==================================================
       POSTS
    ================================================== */

    const posts =
        document.getElementById(
            "postsCount"
        );


    if (posts) {

        posts.textContent =
            Array.isArray(
                user.posts
            )
                ? user.posts.length
                : 0;

    }


    /* ==================================================
       COMMUNITIES
    ================================================== */

    const communities =
        document.getElementById(
            "communitiesCount"
        );


    if (communities) {

        communities.textContent =
            Array.isArray(
                user.communities
            )
                ? user.communities.length
                : 0;

    }


    /* ==================================================
       APPLY GENERATION THEME
    ================================================== */

    if (
        typeof applyGenerationTheme ===
        "function"
    ) {

        try {

            applyGenerationTheme(
                generation
            );

        }

        catch (error) {

            console.warn(
                "Generation theme error:",
                error
            );

        }

    }


    /* ==================================================
       SAVE UPDATED USER
    ================================================== */

    localStorage.setItem(
        "userData",
        JSON.stringify(user)
    );


    console.log(
        "Gene-rations user loaded:",
        user
    );

    console.log(
        "Current generation:",
        generation
    );

}


/* ==================================================
   LOGOUT
================================================== */

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


if (logoutButton) {

    logoutButton.addEventListener(
        "click",
        function () {


            const confirmLogout =
                confirm(
                    "Are you sure you want to log out?"
                );


            if (!confirmLogout) {

                return;

            }


            localStorage.removeItem(
                "loginSession"
            );


            window.location.href =
                "login.html";

        }
    );

}


/* ==================================================
   START PAGE
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadDynamicGeneration();

    }
);

</script>
