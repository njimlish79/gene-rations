<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gene-rations | Posts</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fceca8;
    color: #29194d;
}


/* ==========================================
   HEADER
========================================== */

.header {

    position: sticky;
    top: 0;
    z-index: 100;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    padding: 16px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.header-button {

    border: none;

    background:
        rgba(255,255,255,.16);

    color: white;

    padding: 10px 14px;

    border-radius: 22px;

    font-weight: 700;

    cursor: pointer;
}


/* ==========================================
   CONTAINER
========================================== */

.container {

    max-width: 800px;

    margin: auto;

    padding:
        25px
        15px
        50px;
}


/* ==========================================
   PAGE TITLE
========================================== */

.page-title {
    margin-bottom: 20px;
}

.page-title h1 {
    font-size: 30px;
}

.page-title p {
    color: #777;
    margin-top: 6px;
}


/* ==========================================
   CREATE POST
========================================== */

.create-card {

    background: white;

    border-radius: 22px;

    padding: 20px;

    margin-bottom: 20px;

    box-shadow:
        0 6px 20px
        rgba(70,50,120,.07);
}

.user-row {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 15px;
}

.user-photo {

    width: 48px;
    height: 48px;

    border-radius: 50%;

    object-fit: cover;

    background: #e8defd;
}

.user-name {
    font-weight: 800;
}

.user-generation {

    color: #7c3aed;

    font-size: 13px;

    margin-top: 3px;
}

textarea {

    width: 100%;

    min-height: 110px;

    resize: vertical;

    border: 1px solid #ddd;

    border-radius: 15px;

    padding: 14px;

    font-size: 15px;

    outline: none;
}

textarea:focus {

    border-color: #7c3aed;

    box-shadow:
        0 0 0 3px
        rgba(124,58,237,.1);
}


/* ==========================================
   CREATE POST TOOLS
========================================== */

.post-tools {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 12px;

    flex-wrap: wrap;
}

.tool-button {

    border: none;

    background: #f0ebff;

    color: #6335a7;

    padding: 10px 14px;

    border-radius: 20px;

    cursor: pointer;

    font-weight: 700;
}

.tool-button:hover {
    background: #e6dcff;
}

#imageInput {
    display: none;
}

.post-button {

    margin-left: auto;

    border: none;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #2563eb
        );

    color: white;

    padding: 11px 22px;

    border-radius: 22px;

    font-weight: 800;

    cursor: pointer;
}


/* ==========================================
   IMAGE PREVIEW
========================================== */

.preview-container {
    margin-top: 12px;
    position: relative;
}

.preview-image {

    width: 100%;

    max-height: 350px;

    object-fit: cover;

    border-radius: 15px;

    display: none;
}

.remove-preview {

    position: absolute;

    right: 10px;
    top: 10px;

    width: 35px;
    height: 35px;

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,.65);

    color: white;

    cursor: pointer;

    display: none;
}


/* ==========================================
   FEED FILTER
========================================== */

.feed-tools {

    display: flex;

    gap: 8px;

    margin-bottom: 15px;

    flex-wrap: wrap;
}

.filter {

    border: none;

    background: #eee8ff;

    color: #6435a9;

    padding: 9px 15px;

    border-radius: 20px;

    font-weight: 700;

    cursor: pointer;
}

.filter.active {

    background: #7c3aed;

    color: white;
}


/* ==========================================
   POST
========================================== */

.post {

    background: white;

    border-radius: 22px;

    padding: 18px;

    margin-bottom: 15px;

    box-shadow:
        0 6px 20px
        rgba(70,50,120,.07);
}

.post-header {

    display: flex;

    align-items: center;

    gap: 11px;
}

.post-author-photo {

    width: 45px;
    height: 45px;

    border-radius: 50%;

    object-fit: cover;

    background: #e8defd;
}

.post-author {

    font-weight: 800;
}

.post-generation {

    font-size: 12px;

    color: #7c3aed;

    margin-top: 3px;
}

.post-time {

    font-size: 12px;

    color: #999;

    margin-left: auto;
}

.post-content {

    margin-top: 15px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-wrap: break-word;
}

.post-image {

    width: 100%;

    max-height: 450px;

    object-fit: cover;

    border-radius: 15px;

    margin-top: 14px;
}


/* ==========================================
   POST ACTIONS
========================================== */

.post-actions {

    display: flex;

    gap: 7px;

    margin-top: 15px;

    padding-top: 12px;

    border-top: 1px solid #eee;

}

.action-button {

    flex: 1;

    border: none;

    background: #f6f3fb;

    color: #5c4c75;

    padding: 10px;

    border-radius: 12px;

    cursor: pointer;

    font-weight: 700;
}

.action-button:hover {
    background: #ebe4fa;
}

.action-button.liked {

    color: #d91e63;

    background: #ffe8f0;
}


/* ==========================================
   COMMENTS
========================================== */

.comments {

    margin-top: 14px;

    display: none;
}

.comment {

    background: #f7f5fa;

    padding: 10px 12px;

    border-radius: 12px;

    margin-bottom: 8px;
}

.comment-author {

    font-weight: 800;

    font-size: 13px;
}

.comment-text {

    font-size: 14px;

    margin-top: 4px;

    color: #555;
}

.comment-form {

    display: flex;

    gap: 7px;

    margin-top: 10px;
}

.comment-input {

    flex: 1;

    border: 1px solid #ddd;

    border-radius: 20px;

    padding: 10px 14px;

    outline: none;
}

.comment-submit {

    border: none;

    border-radius: 20px;

    padding: 9px 15px;

    background: #7c3aed;

    color: white;

    font-weight: 700;

    cursor: pointer;
}


/* ==========================================
   EMPTY
========================================== */

.empty {

    background: white;

    padding: 55px 25px;

    border-radius: 22px;

    text-align: center;

    color: #777;

    box-shadow:
        0 6px 20px
        rgba(70,50,120,.06);
}

.empty-icon {

    font-size: 48px;

    margin-bottom: 12px;
}


/* ==========================================
   MESSAGE
========================================== */

#message {

    display: none;

    padding: 12px;

    margin-bottom: 15px;

    border-radius: 12px;

    text-align: center;

    font-weight: 700;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px) {

    .header {
        padding: 14px;
    }

    .logo {
        font-size: 20px;
    }

    .header-button {
        font-size: 12px;

      
        padding: 9px 11px;
    }

    .container {
        padding:
            20px 11px 40px;
    }

    .page-title h1 {
        font-size: 26px;
    }

    .post-button {
        margin-left: 0;
        width: 100%;
    }

    .post-actions {
        gap: 5px;
    }

    .action-button {
        font-size: 12px;
        padding: 9px 5px;
    }

}

</style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

    <div class="logo">
        Gene-rations
    </div>


    <div class="header-actions">

        <button
            class="header-button"
            onclick="goToHub()">

            🏠 Generation Hub

        </button>


        <button
            class="header-button"
            onclick="goToNotifications()">

            🔔

        </button>

    </div>

</header>



<!-- ==========================================
     MAIN
========================================== -->

<main class="container">


    <section class="page-title">

        <h1>
            Posts
        </h1>

        <p>
            Share ideas, experiences and
            conversations with your generation.
        </p>

    </section>


    <div id="message"></div>


    <!-- ======================================
         CREATE POST
    ======================================= -->

    <section class="create-card">

        <div class="user-row">

            <img
                id="currentUserPhoto"
                class="user-photo"
                src=""
                alt="Profile">

            <div>

                <div
                    id="currentUserName"
                    class="user-name">

                    Loading...

                </div>

                <div
                    id="currentUserGeneration"
                    class="user-generation">

                    Loading...

                </div>

            </div>

        </div>


        <textarea
            id="postText"
            maxlength="3000"
            placeholder="What's on your mind?">

        </textarea>


        <div class="preview-container">

            <img
                id="previewImage"
                class="preview-image"
                src=""
                alt="Image preview">


            <button
                id="removePreview"
                class="remove-preview">

                ×

            </button>

        </div>


        <div class="post-tools">

            <label
                for="imageInput"
                class="tool-button">

                📷 Photo

            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*">


            <button
                class="tool-button"
                onclick="addEmoji()">

                😊 Emoji

            </button>


            <button
                class="post-button"
                onclick="createPost()">

                Post

            </button>

        </div>

    </section>



    <!-- ======================================
         FILTER
    ======================================= -->

    <div class="feed-tools">

        <button
            class="filter active"
            data-filter="all">

            🌍 All Posts

        </button>


        <button
            class="filter"
            data-filter="generation">

            👥 My Generation

        </button>


        <button
            class="filter"
            data-filter="mine">

            👤 My Posts

        </button>

    </div>



    <!-- ======================================
         FEED
    ======================================= -->

    <section id="feed"></section>


    <section
        id="empty"
        class="empty"
        style="display:none;">

        <div class="empty-icon">
            📝
        </div>

        <h2>
            No posts yet
        </h2>

        <p>
            Be the first to share something
            with the Gene-rations community.
        </p>

    </section>


</main>



<script>

/* =====================================================
   GENE-RATIONS POSTS
   BACKEND CONNECTED
===================================================== */

const API_URL = "http://localhost:3000";

let userData = null;
let posts = [];
let currentFilter = "all";


/* =====================================================
   DEFAULT PROFILE PHOTO
===================================================== */

const DEFAULT_PHOTO =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="200"
             height="200"
             viewBox="0 0 200 200">

            <rect width="200"
                  height="200"
                  rx="100"
                  fill="#e9eef7"/>

            <circle cx="100"
                    cy="75"
                    r="35"
                    fill="#9aa8bd"/>

            <path d="
                M40 170
                C45 125 70 110 100 110
                C130 110 155 125 160 170
                Z"
                fill="#9aa8bd"/>

        </svg>
    `);


/* =====================================================
   GET STORED USER
===================================================== */

function getStoredUser() {

    try {

        return JSON.parse(
            localStorage.getItem("userData")
        );

    } catch (error) {

        return null;

    }

}


/* =====================================================
   SAVE USER
===================================================== */

function saveUser(user) {

    if (!user) return;

    userData = user;

    localStorage.setItem(
        "userData",
        JSON.stringify(user)
    );

}


/* =====================================================
   PROFILE PHOTO
===================================================== */

function getProfilePhoto(photo) {

    return photo || DEFAULT_PHOTO;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value || "";

    return div.innerHTML;

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatPostTime(dateString) {

    if (!dateString) {
        return "";
    }

    const date =
        new Date(dateString);

    if (isNaN(date.getTime())) {
        return "";
    }

    const now = new Date();

    const difference =
        Math.floor(
            (now - date) / 1000
        );


    if (difference < 60) {
        return "Just now";
    }


    if (difference < 3600) {

        return (
            Math.floor(
                difference / 60
            ) + "m ago"
        );

    }


    if (difference < 86400) {

        return (
            Math.floor(
                difference / 3600
            ) + "h ago"
        );

    }


    if (difference < 604800) {

        return (
            Math.floor(
                difference / 86400
            ) + "d ago"
        );

    }


    return date.toLocaleDateString();

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type = "success"
) {

    const message =
        document.getElementById("message");

    if (!message) return;

    message.textContent = text;

    message.className = type;

    message.style.display = "block";


    setTimeout(() => {

        message.style.display = "none";

    }, 4000);

}


/* =====================================================
   DISPLAY CURRENT USER
===================================================== */

function displayCurrentUser() {

    if (!userData) return;


    const name =
        document.getElementById(
            "currentUserName"
        );

    const generation =
        document.getElementById(
            "currentUserGeneration"
        );

    const photo =
        document.getElementById(
            "currentUserPhoto"
        );


    if (name) {

        name.textContent =
            userData.fullName ||
            "Gene-rations Member";

    }


    if (generation) {

    const generationName =
        userData.generation ||
        "Gene-rations";

    let generationBadge =
        userData.generationBadge ||
        "";

    /*
     * Prevent duplicate generation names
     * when the badge already contains the name.
     */
    if (
        generationName &&
        generationBadge.includes(generationName)
    ) {

        generationBadge =
            generationBadge
                .replace(generationName, "")
                .trim();

    }

    generation.textContent =
        generationBadge +
        (
            generationBadge &&
            generationName
                ? " "
                : ""
        ) +
        generationName;

    }


    if (photo) {

        photo.src =
            getProfilePhoto(
                userData.profilePhoto
            );

    }

}


/* =====================================================
   LOAD CURRENT USER
===================================================== */

async function loadCurrentUser() {

    const storedUser =
        getStoredUser();


    if (
        !storedUser ||
        !storedUser.id
    ) {

        window.location.href =
            "login.html";

        return false;

    }


    userData =
        storedUser;


    displayCurrentUser();


    try {

        const response =
            await fetch(
                API_URL +
                "/api/user/" +
                encodeURIComponent(
                    storedUser.id
                )
            );


        const data =
            await response.json();


        if (
            response.status === 403 &&
            data.dormant
        ) {

            alert(
                data.message ||
                "Your account is dormant."
            );

            return false;

        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load account."
            );

        }


        if (data.user) {

            saveUser(data.user);

            displayCurrentUser();

        }


        return true;

    }

    catch (error) {

        console.warn(
            "Could not refresh user:",
            error
        );

        /*
         * Cached user can still be used.
         */

        return true;

    }

}


/* =====================================================
   LOAD POSTS FROM BACKEND
===================================================== */

async function loadPosts() {

    const feed =
        document.getElementById("feed");


    if (feed) {

        feed.innerHTML = `
            <div style="
                background:white;
                padding:30px;
                border-radius:22px;
                text-align:center;
                color:#777;
            ">
                Loading posts...
            </div>
        `;

    }


    try {

        const response =
            await fetch(
                API_URL + "/api/posts"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load posts."
            );

        }


        posts =
            Array.isArray(data.posts)
                ? data.posts
                : [];


        renderPosts();

    }

    catch (error) {

        console.error(
            "Load posts error:",
            error
        );


        if (feed) {

            feed.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h2>
                        Unable to load posts
                    </h2>

                    <p>
                        Please make sure the
                        Gene-rations backend is running.
                    </p>
                </div>
            `;

        }

    }

}


/* =====================================================
   GET FILTERED POSTS
===================================================== */

function getFilteredPosts() {

    if (currentFilter === "generation") {

        return posts.filter(
            post =>
                post.generation ===
                userData?.generation
        );

    }


    if (currentFilter === "mine") {

        return posts.filter(
            post =>
                post.authorId ===
                userData?.id
        );

    }


    return posts;

}


/* =====================================================
   RENDER POSTS
===================================================== */

function renderPosts() {

    const feed =
        document.getElementById("feed");

    const empty =
        document.getElementById("empty");


    if (!feed) return;


    const filteredPosts =
        getFilteredPosts();


    feed.innerHTML = "";


    if (
        filteredPosts.length === 0
    ) {

        if (empty) {

            empty.style.display =
                "block";

        }

        return;

    }


    if (empty) {

        empty.style.display =
            "none";

    }


    feed.innerHTML =
        filteredPosts
            .map(
                post =>
                    createPostHTML(post)
            )
            .join("");

}


/* =====================================================
   CREATE POST HTML
===================================================== */

function createPostHTML(post) {

    const photo =
        getProfilePhoto(
            post.profilePhoto
        );


    const liked =
        Array.isArray(post.likes) &&
        post.likes.includes(
            userData?.id
        );


    const likeCount =
        Array.isArray(post.likes)
            ? post.likes.length
            : 0;


    const comments =
        Array.isArray(post.comments)
            ? post.comments
            : [];


    const isOwner =
        post.authorId ===
        userData?.id;


    return `

        <article
            class="post"
            data-post-id="${escapeHTML(post.id)}"
        >

            <div class="post-header">

                <img
                    class="post-author-photo"
                    src="${photo}"
                    alt="Profile"
                >


                <div>

                    <div class="post-author">

                        ${escapeHTML(
                            post.author ||
                            "Gene-rations Member"
                        )}

                    </div>


                    <div class="post-generation">

${escapeHTML(
    (() => {

        const generation =
            post.generation || "";

        let badge =
            post.generationBadge || "";

        /*
         * Prevent the generation name from
         * appearing twice if the badge already
         * contains it.
         */
        if (
            generation &&
            badge.includes(generation)
        ) {

            badge =
                badge
                .replace(generation, "")
                .trim();

        }

        return (
            badge +
            (badge && generation ? " " : "") +
            generation
        );

    })()
)}

</div>

                </div>


                <div class="post-time">

                    ${formatPostTime(
                        post.createdAt
                    )}

                </div>

            </div>


            ${
                post.content
                ? `
                    <div class="post-content">

                        ${escapeHTML(
                            post.content
                        ).replace(
                            /\n/g,
                            "<br>"
                        )}

                    </div>
                `
                : ""
            }


            ${
                post.image
                ? `
                    <img
                        class="post-image"
                        src="${post.image}"
                        alt="Post image"
                    >
                `
                : ""
            }


            <div class="post-actions">

                <button
                    class="action-button ${
                        liked ? "liked" : ""
                    }"
                    onclick="likePost(
                        '${escapeHTML(post.id)}'
                    )"
                >

                    ❤️
                    ${likeCount}

                </button>


                <button
                    class="action-button"
                    onclick="toggleComments(
                        '${escapeHTML(post.id)}'
                    )"
                >

                    💬
                    ${comments.length}

                </button>


                ${
                    isOwner
                    ? `
                        <button
                            class="action-button"
                            onclick="deletePost(
                                '${escapeHTML(post.id)}'
                            )"
                        >

                            🗑️

                        </button>
                    `
                    : ""
                }

            </div>


            <div
                class="comments"
                id="comments-${escapeHTML(post.id)}"
            >

                ${
                    comments.length
                    ? comments.map(
                        comment => `
                            <div class="comment">

                                <div class="comment-author">

                                    ${escapeHTML(
                                        comment.author
                                    )}

                                </div>

                                <div class="comment-text">

                                    ${escapeHTML(
                                        comment.content
                                    )}

                                </div>

                            </div>
                        `
                    ).join("")
                    : `
                        <div style="
                            color:#999;
                            font-size:13px;
                            margin-bottom:8px;
                        ">
                            No comments yet.
                        </div>
                    `
                }


                <div class="comment-form">

                    <input
                        class="comment-input"
                        id="comment-input-${escapeHTML(post.id)}"
                        type="text"
                        maxlength="1000"
                        placeholder="Write a comment..."
                    >


                    <button
                        class="comment-submit"
                        onclick="addComment(
                            '${escapeHTML(post.id)}'
                        )"
                    >

                        Send

                    </button>

                </div>

            </div>

        </article>

    `;

}


/* =====================================================
   CREATE POST
===================================================== */

async function createPost() {

    if (
        !userData ||
        !userData.id
    ) {

        alert(
            "Please log in first."
        );

        return;

    }


    const text =
        document.getElementById(
            "postText"
        );


    const imageInput =
        document.getElementById(
            "imageInput"
        );


    const postButton =
        document.querySelector(
            ".post-button"
        );


    const content =
        text
        ? text.value.trim()
        : "";


    let image = "";


    /* ---------------------------------------------
       IMAGE
    --------------------------------------------- */

    if (
        imageInput &&
        imageInput.files &&
        imageInput.files.length > 0
    ) {

        try {

            image =
                await compressPostImage(
                    imageInput.files[0]
                );

        }

        catch (error) {

            alert(
                error.message ||
                "Unable to process image."
            );

            return;

        }

    }


    if (
        !content &&
        !image
    ) {

        showMessage(
            "Please write something or select a photo.",
            "error"
        );

        return;

    }


    if (
        content.length > 3000
    ) {

        showMessage(
            "Your post cannot exceed 3000 characters.",
            "error"
        );

        return;

    }


    if (postButton) {

        postButton.disabled =
            true;

        postButton.textContent =
            "Posting...";

    }


    try {

        const response =
            await fetch(
                API_URL + "/api/posts",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            userId:
                                userData.id,

                            content:
                                content,

                            image:
                                image

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to create post."
            );

        }


        /*
         * Clear composer.
         */

        if (text) {

            text.value = "";

        }


        if (imageInput) {

            imageInput.value = "";

        }


        clearImagePreview();


        /*
         * Reload posts from backend.
         */

        await loadPosts();


        showMessage(
            "Post published successfully!",
            "success"
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

    catch (error) {

        console.error(
            "Create post error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to create post.",
            "error"
        );

    }

    finally {

        if (postButton) {

            postButton.disabled =
                false;

            postButton.textContent =
                "Post";

        }

    }

}


/* =====================================================
   IMAGE COMPRESSION
===================================================== */

function compressPostImage(file) {

    return new Promise(
        (resolve, reject) => {

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                reject(
                    new Error(
                        "Please select an image."
                    )
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const image =
                        new Image();


                    image.onload =
                        () => {

                            const maxSize =
                                1200;

                            let width =
                                image.width;

                            let height =
                                image.height;


                            if (
                                width > maxSize ||
                                height > maxSize
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            maxSize /
                                            width
                                        );

                                    width =
                                        maxSize;

                                } else {

                                    width =
                                        Math.round(
                                            width *
                                            maxSize /
                                            height
                                        );

                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.80
                                )
                            );

                        };


                    image.onerror =
                        () => {

                            reject(
                                new Error(
                                    "Unable to read image."
                                )
                            );

                        };


                    image.src =
                        event.target.result;

                };


            reader.onerror =
                () => {

                    reject(
                        new Error(
                            "Unable to read selected file."
                        )
                    );

                };


            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

document
    .getElementById("imageInput")
    ?.addEventListener(
        "change",
        function () {

            const file =
                this.files?.[0];

            const preview =
                document.getElementById(
                    "previewImage"
                );

            const removeButton =
                document.getElementById(
                    "removePreview"
                );


            if (
                !file ||
                !preview
            ) {

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                event => {

                    preview.src =
                        event.target.result;

                    preview.style.display =
                        "block";


                    if (removeButton) {

                        removeButton.style.display =
                            "block";

                    }

                };


            reader.readAsDataURL(file);

        }
    );


/* =====================================================
   REMOVE IMAGE PREVIEW
===================================================== */

document
    .getElementById("removePreview")
    ?.addEventListener(
        "click",
        clearImagePreview
    );


function clearImagePreview() {

    const input =
        document.getElementById(
            "imageInput"
        );

    const preview =
        document.getElementById(
            "previewImage"
        );

    const removeButton =
        document.getElementById(
            "removePreview"
        );


    if (input) {

        input.value = "";

    }


    if (preview) {

        preview.src = "";

        preview.style.display =
            "none";

    }


    if (removeButton) {

        removeButton.style.display =
            "none";

    }

}

function addEmoji() {

    const textarea =
        document.getElementById(
            "postText"
        );


    if (!textarea) return;


    const emojis =
        [
            "😊",
            "❤️",
            "😂",
            "🔥",
            "👍",
            "🎉",
            "🌍",
            "💡",
            "🚀",
            "🙏"
        ];


    const emoji =
        emojis[
            Math.floor(
                Math.random() *
                emojis.length
            )
        ];


    textarea.value +=
        emoji;


    textarea.focus();

}

async function likePost(postId) {

    if (
        !userData ||
        !userData.id
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                API_URL +
                "/api/posts/" +
                encodeURIComponent(
                    postId
                ) +
                "/like",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            userId:
                                userData.id

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to like post."
            );

        }


        const post =
            posts.find(
                p =>
                    p.id === postId
            );

            error
        );


        showMessage(
            error.message,

        );

}


/* =====================================================
   TOGGLE COMMENTS
===================================================== */

function toggleComments(postId) {

    const comments =
        document.getElementById(
            "comments-" +
            postId
        );


    if (!comments) return;


    if (
        comments.style.display ===
        "block"
    ) {

        comments.style.display =
            "none";

    } else {

        comments.style.display =
            "block";

        const input =
            document.getElementById(
                "comment-input-" +
                postId
            );


        if (input) {

            input.focus();

        }

    }

}


/* =====================================================
   ADD COMMENT
===================================================== */

async function addComment(postId) {

    if (
        !userData ||
        !userData.id
    ) {

        return;

    }


    const input =
        document.getElementById(
            "comment-input-" +
            postId
        );


    if (!input) return;


    const content =
        input.value.trim();


    if (!content) {

        return;

    }


    try {

        const response =
            await fetch(
                API_URL +
                "/api/posts/" +
                encodeURIComponent(
                    postId
                ) +
                "/comments",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            userId:
                                userData.id,

                            content:
                                content

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to add comment."
            );

        }


        const post =
            posts.find(
                p =>
                    p.id === postId
            );


        if (post) {

            document.getElementById(

            );


        if (comments) {

            comments.style.display =
                "block";

        }

    }

    catch (error) {

        console.error(
            "Comment error:",
            error
        );


        showMessage(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   DELETE POST
===================================================== */

async function deletePost(postId) {

    if (
        !userData ||
        !userData.id
    ) {

        return;

    }


    if (
        !confirm(
            "Are you sure you want to delete this post?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                API_URL +
                "/api/posts/" +
                encodeURIComponent(
                    postId
                ),
                {

                    method:
                        "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            userId:
                                userData.id

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to delete post."
            );

        }


        posts =
            posts.filter(
                post =>
                    post.id !==
                    postId
            );


        renderPosts();


        showMessage(
            "Post deleted successfully.",
            "success"
        );

    }

    catch (error) {

        console.error(
            "Delete post error:",
            error
        );


        showMessage(
            error.message,
            "error"
        );

    }

}
