<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gene-rations | Posts</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f3ff;
    color: #29194d;
}


/* ==========================================
   HEADER
========================================== */

.header {

    position: sticky;
    top: 0;
    z-index: 100;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    padding: 16px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.header-button {

    border: none;

    background:
        rgba(255,255,255,.16);

    color: white;

    padding: 10px 14px;

    border-radius: 22px;

    font-weight: 700;

    cursor: pointer;
}


/* ==========================================
   CONTAINER
========================================== */

.container {

    max-width: 800px;

    margin: auto;

    padding:
        25px
        15px
        50px;
}


/* ==========================================
   PAGE TITLE
========================================== */

.page-title {
    margin-bottom: 20px;
}

.page-title h1 {
    font-size: 30px;
}

.page-title p {
    color: #777;
    margin-top: 6px;
}


/* ==========================================
   CREATE POST
========================================== */

.create-card {

    background: white;

    border-radius: 22px;

    padding: 20px;

    margin-bottom: 20px;

    box-shadow:
        0 6px 20px
        rgba(70,50,120,.07);
}

.user-row {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 15px;
}

.user-photo {

    width: 48px;
    height: 48px;

    border-radius: 50%;

    object-fit: cover;

    background: #e8defd;
}

.user-name {
    font-weight: 800;
}

.user-generation {

    color: #7c3aed;

    font-size: 13px;

    margin-top: 3px;
}

textarea {

    width: 100%;

    min-height: 110px;

    resize: vertical;

    border: 1px solid #ddd;

    border-radius: 15px;

    padding: 14px;

    font-size: 15px;

    outline: none;
}

textarea:focus {

    border-color: #7c3aed;

    box-shadow:
        0 0 0 3px
        rgba(124,58,237,.1);
}


/* ==========================================
   CREATE POST TOOLS
========================================== */

.post-tools {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 12px;

    flex-wrap: wrap;
}

.tool-button {

    border: none;

    background: #f0ebff;

    color: #6335a7;

    padding: 10px 14px;

    border-radius: 20px;

    cursor: pointer;

    font-weight: 700;
}

.tool-button:hover {
    background: #e6dcff;
}

#imageInput {
    display: none;
}

.post-button {

    margin-left: auto;

    border: none;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #2563eb
        );

    color: white;

    padding: 11px 22px;

    border-radius: 22px;

    font-weight: 800;

    cursor: pointer;
}


/* ==========================================
   IMAGE PREVIEW
========================================== */

.preview-container {
    margin-top: 12px;
    position: relative;
}

.preview-image {

    width: 100%;

    max-height: 350px;

    object-fit: cover;

    border-radius: 15px;

    display: none;
}

.remove-preview {

    position: absolute;

    right: 10px;
    top: 10px;

    width: 35px;
    height: 35px;

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,.65);

    color: white;

    cursor: pointer;

    display: none;
}


/* ==========================================
   FEED FILTER
========================================== */

.feed-tools {

    display: flex;

    gap: 8px;

    margin-bottom: 15px;

    flex-wrap: wrap;
}

.filter {

    border: none;

    background: #eee8ff;

    color: #6435a9;

    padding: 9px 15px;

    border-radius: 20px;

    font-weight: 700;

    cursor: pointer;
}

.filter.active {

    background: #7c3aed;

    color: white;
}


/* ==========================================
   POST
========================================== */

.post {

    background: white;

    border-radius: 22px;

    padding: 18px;

    margin-bottom: 15px;

    box-shadow:
        0 6px 20px
        rgba(70,50,120,.07);
}

.post-header {

    display: flex;

    align-items: center;

    gap: 11px;
}

.post-author-photo {

    width: 45px;
    height: 45px;

    border-radius: 50%;

    object-fit: cover;

    background: #e8defd;
}

.post-author {

    font-weight: 800;
}

.post-generation {

    font-size: 12px;

    color: #7c3aed;

    margin-top: 3px;
}

.post-time {

    font-size: 12px;

    color: #999;

    margin-left: auto;
}

.post-content {

    margin-top: 15px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-wrap: break-word;
}

.post-image {

    width: 100%;

    max-height: 450px;

    object-fit: cover;

    border-radius: 15px;

    margin-top: 14px;
}


/* ==========================================
   POST ACTIONS
========================================== */

.post-actions {

    display: flex;

    gap: 7px;

    margin-top: 15px;

    padding-top: 12px;

    border-top: 1px solid #eee;

}

.action-button {

    flex: 1;

    border: none;

    background: #f6f3fb;

    color: #5c4c75;

    padding: 10px;

    border-radius: 12px;

    cursor: pointer;

    font-weight: 700;
}

.action-button:hover {
    background: #ebe4fa;
}

.action-button.liked {

    color: #d91e63;

    background: #ffe8f0;
}


/* ==========================================
   COMMENTS
========================================== */

.comments {

    margin-top: 14px;

    display: none;
}

.comment {

    background: #f7f5fa;

    padding: 10px 12px;

    border-radius: 12px;

    margin-bottom: 8px;
}

.comment-author {

    font-weight: 800;

    font-size: 13px;
}

.comment-text {

    font-size: 14px;

    margin-top: 4px;

    color: #555;
}

.comment-form {

    display: flex;

    gap: 7px;

    margin-top: 10px;
}

.comment-input {

    flex: 1;

    border: 1px solid #ddd;

    border-radius: 20px;

    padding: 10px 14px;

    outline: none;
}

.comment-submit {

    border: none;

    border-radius: 20px;

    padding: 9px 15px;

    background: #7c3aed;

    color: white;

    font-weight: 700;

    cursor: pointer;
}


/* ==========================================
   EMPTY
========================================== */

.empty {

    background: white;

    padding: 55px 25px;

    border-radius: 22px;

    text-align: center;

    color: #777;

    box-shadow:
        0 6px 20px
        rgba(70,50,120,.06);
}

.empty-icon {

    font-size: 48px;

    margin-bottom: 12px;
}


/* ==========================================
   MESSAGE
========================================== */

#message {

    display: none;

    padding: 12px;

    margin-bottom: 15px;

    border-radius: 12px;

    text-align: center;

    font-weight: 700;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px) {

    .header {
        padding: 14px;
    }

    .logo {
        font-size: 20px;
    }

    .header-button {
        font-size: 12px;
        padding: 9px 11px;
    }

    .container {
        padding:
            20px 11px 40px;
    }

    .page-title h1 {
        font-size: 26px;
    }

    .post-button {
        margin-left: 0;
        width: 100%;
    }

    .post-actions {
        gap: 5px;
    }

    .action-button {
        font-size: 12px;
        padding: 9px 5px;
    }

}

</style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

    <div class="logo">
        Gene-rations
    </div>


    <div class="header-actions">

        <button
            class="header-button"
            onclick="goToHub()">

            🏠 Generation Hub

        </button>


        <button
            class="header-button"
            onclick="goToNotifications()">

            🔔

        </button>

    </div>

</header>



<!-- ==========================================
     MAIN
========================================== -->

<main class="container">


    <section class="page-title">

        <h1>
            Posts
        </h1>

        <p>
            Share ideas, experiences and
            conversations with your generation.
        </p>

    </section>


    <div id="message"></div>


    <!-- ======================================
         CREATE POST
    ======================================= -->

    <section class="create-card">

        <div class="user-row">

            <img
                id="currentUserPhoto"
                class="user-photo"
                src=""
                alt="Profile">

            <div>

                <div
                    id="currentUserName"
                    class="user-name">

                    Loading...

                </div>

                <div
                    id="currentUserGeneration"
                    class="user-generation">

                    Loading...

                </div>

            </div>

        </div>


        <textarea
            id="postText"
            maxlength="3000"
            placeholder="What's on your mind?">

        </textarea>


        <div class="preview-container">

            <img
                id="previewImage"
                class="preview-image"
                src=""
                alt="Image preview">


            <button
                id="removePreview"
                class="remove-preview">

                ×

            </button>

        </div>


        <div class="post-tools">

            <label
                for="imageInput"
                class="tool-button">

                📷 Photo

            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*">


            <button
                class="tool-button"
                onclick="addEmoji()">

                😊 Emoji

            </button>


            <button
                class="post-button"
                onclick="createPost()">

                Post

            </button>

        </div>

    </section>



    <!-- ======================================
         FILTER
    ======================================= -->

    <div class="feed-tools">

        <button
            class="filter active"
            data-filter="all">

            🌍 All Posts

        </button>


        <button
            class="filter"
            data-filter="generation">

            👥 My Generation

        </button>


        <button
            class="filter"
            data-filter="mine">

            👤 My Posts

        </button>

    </div>



    <!-- ======================================
         FEED
    ======================================= -->

    <section id="feed"></section>


    <section
        id="empty"
        class="empty"
        style="display:none;">

        <div class="empty-icon">
            📝
        </div>

        <h2>
            No posts yet
        </h2>

        <p>
            Be the first to share something
            with the Gene-rations community.
        </p>

    </section>


</main>



<script>

/* =================================================
   GENE-RATIONS POSTS ENGINE
================================================= */


/* ================================================
   CURRENT USER
================================================ */

let userData =
    JSON.parse(
        localStorage.getItem("userData")
    );


if (!userData) {

    window.location.href =
        "login.html";

}


/* ================================================
   DEFAULT PHOTO
================================================ */

const defaultPhoto =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`

        <svg xmlns="http://www.w3.org/2000/svg"
             width="200"
             height="200">

            <rect
                width="200"
                height="200"
                fill="#e8defd"/>

            <circle
                cx="100"
                cy="70"
                r="38"
                fill="#8d72c8"/>

            <path
                d="M35 180
                   C40 125
                   70 110
                   100 110
                   C130 110
                   160 125
                   165 180Z"
                fill="#8d72c8"/>

        </svg>

    `);


/* ================================================
   POST STORAGE
================================================ */

const postStorageKey =
    "geneRationsPosts";


let posts =
    JSON.parse(
        localStorage.getItem(
            postStorageKey
        )
    );


if (!Array.isArray(posts)) {

    posts = [];

}


/* ================================================
   NORMALIZE POSTS
================================================ */

posts =
    posts.map(
        function(post) {

            return {

                id:
                    post.id ||
                    Date.now() +
                    Math.random(),

                authorEmail:
                    post.authorEmail ||
                    "",

                author:
                    post.author ||
                    "Gene-rations Member",

                generation:
                    post.generation ||
                    "Generation Alpha",

                profilePhoto:
                    post.profilePhoto ||
                    "",

                content:
                    post.content ||
                    "",

                image:
                    post.image ||
                    "",

                likes:
                    Array.isArray(post.likes)
                        ? post.likes
                        : [],

                comments:
                    Array.isArray(post.comments)
                        ? post.comments
                        : [],

                createdAt:
                    post.createdAt ||
                    new Date().toISOString()

            };

        }
    );


savePosts();


/* ================================================
   CURRENT FILTER
================================================ */

let currentFilter =
    "all";


/* ================================================
   SAVE POSTS
================================================ */

function savePosts() {

    localStorage.setItem(
        postStorageKey,
        JSON.stringify(posts)
    );

}


/* ================================================
   LOAD USER INFORMATION
================================================ */

function loadUser() {

    document.getElementById(
        "currentUserName"
    ).textContent =
        userData.fullName ||
        "Gene-rations Member";


    document.getElementById(
        "currentUserGeneration"
    ).textContent =
        userData.generation ||
        "Generation community";


    document.getElementById(
        "currentUserPhoto"
    ).src =
        userData.profilePhoto ||
        defaultPhoto;

}


loadUser();


/* ================================================
   IMAGE UPLOAD
================================================ */

let selectedImage =
    "";


document.getElementById(
    "imageInput"
).addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            showMessage(
                "Please select an image.",
                "error"
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                selectedImage =
                    e.target.result;


                const preview =
                    document.getElementById(
                        "previewImage"
                    );


                preview.src =
                    selectedImage;


                preview.style.display =
                    "block";


                document.getElementById(
                    "removePreview"
                ).style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* ================================================
   REMOVE IMAGE
================================================ */

document.getElementById(
    "removePreview"
).addEventListener(
    "click",
    function() {

        selectedImage = "";

        document.getElementById(
            "imageInput"
        ).value = "";


        document.getElementById(
            "previewImage"
        ).style.display =
            "none";


        this.style.display =
            "none";

    }
);


/* ================================================
   CREATE POST
================================================ */

function createPost() {

    const text =
        document.getElementById(
            "postText"
        ).value.trim();


    if (
        !text &&
        !selectedImage
    ) {

        showMessage(
            "Write something or add a photo before posting.",
            "error"
        );

        return;

    }


    const newPost = {

        id:
            Date.now() +
            Math.random(),

        authorEmail:
            userData.email,

        author:
            userData.fullName ||
            "Gene-rations Member",

        generation:
            userData.generation ||
            "Generation Alpha",

        profilePhoto:
            userData.profilePhoto ||
            "",

        content:
            text,

        image:
            selectedImage,

        likes: [],

        comments: [],

        createdAt:
            new Date().toISOString()

    };


    posts.unshift(
        newPost
    );


    savePosts();


    /* =========================================
       ALSO UPDATE USER'S OWN POSTS
    ========================================= */

    if (
        !Array.isArray(
            userData.posts
        )
    ) {

        userData.posts = [];

    }


    userData.posts.unshift(
        newPost.id
    );


    localStorage.setItem(
        "userData",
        JSON.stringify(
            userData
        )
    );


    /* =========================================
       CLEAR FORM
    ========================================= */

    document.getElementById(
        "postText"
    ).value = "";


    selectedImage = "";


    document.getElementById(
        "imageInput"
    ).value = "";


    document.getElementById(
        "previewImage"
    ).style.display =
        "none";


    document.getElementById(
        "removePreview"
    ).style.display =
        "none";


    showMessage(
        "Your post was published successfully!",
        "success"
    );


    renderPosts();

}


/* ================================================
   RENDER POSTS
================================================ */

function renderPosts() {

    const feed =
        document.getElementById(
            "feed"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    feed.innerHTML = "";


    let filteredPosts =
        [...posts];


    if (
        currentFilter ===
        "generation"
    ) {

        filteredPosts =
            filteredPosts.filter(
                function(post) {

                    return (
                        post.generation ===
                        userData.generation
                    );

                }
            );

    }


    if (
        currentFilter ===
        "mine"
    ) {

        filteredPosts =
            filteredPosts.filter(
                function(post) {

                    return (
                        post.authorEmail ===
                        userData.email
                    );

                }
            );

    }


    if (
        filteredPosts.length === 0
    ) {

        feed.style.display =
            "none";

        empty.style.display =
            "block";

        return;

    }


    feed.style.display =
        "block";

    empty.style.display =
        "none";


    filteredPosts.forEach(
        function(post) {

            feed.appendChild(
                createPostElement(
                    post
                )
            );

        }
    );

}


/* ================================================
   CREATE POST HTML
================================================ */

function createPostElement(
    post
) {

    const article =
        document.createElement(
            "article"
        );


    article.className =
        "post";


    const liked =
        post.likes.includes(
            userData.email
        );


    const likeCount =
        post.likes.length;


    const commentCount =
        post.comments.length;


    article.innerHTML = `

        <div class="post-header">

            <img
                class="post-author-photo"
                src="${
                    post.profilePhoto ||
                    defaultPhoto
                }"
                alt="Profile">


            <div>

                <div class="post-author">

                    ${escapeHTML(
                        post.author
                    )}

                </div>


                <div class="post-generation">

                    ${
                        escapeHTML(
                            post.generation
                        )
                    }

                </div>

            </div>


            <div class="post-time">

                ${
                    formatTime(
                        post.createdAt
                    )
                }

            </div>

        </div>


        ${
            post.content
            ?
            `
                <div class="post-content">
                    ${escapeHTML(
                        post.content
                    )}
                </div>
            `
            :
            ""
        }


        ${
            post.image
            ?
            `
                <img
                    class="post-image"
                    src="${post.image}"
                    alt="Post image">
            `
            :
            ""
        }


        <div class="post-actions">

            <button
                class="action-button ${
                    liked
                        ? "liked"
                        : ""
                }"
                onclick="toggleLike('${post.id}')">

                ${
                    liked
                        ? "❤️"
                        : "🤍"
                }

                Like ${likeCount}

            </button>


            <button
                class="action-button"
                onclick="toggleComments('${post.id}')">

                💬 Comment ${commentCount}

            </button>


            ${
                post.authorEmail ===
                userData.email
                ?
                `
                    <button
                        class="action-button"
                        onclick="deletePost('${post.id}')">

                        🗑️ Delete

                    </button>
                `
                :
                ""
            }

        </div>


        <div
            id="comments-${post.id}"
            class="comments">

            ${
                renderCommentsHTML(
                    post
                )
            }


            <div class="comment-form">

                <input
                    id="comment-${post.id}"
                    class="comment-input"
                    placeholder="Write a comment...">


                <button
                    class="comment-submit"
                    onclick="addComment('${post.id}')">

                    Send

                </button>

            </div>

        </div>

    `;


    return article;

}


/* ================================================
   COMMENTS HTML
================================================ */

function renderCommentsHTML(
    post
) {

    if (
        post.comments.length === 0
    ) {

        return `
            <div
                style="
                    color:#999;
                    font-size:13px;
                    margin-bottom:10px;
                ">

                No comments yet.

            </div>
        `;

    }


    return post.comments
        .map(
            function(comment) {

                return `

                    <div class="comment">

                        <div class="comment-author">

                            ${
                                escapeHTML(
                                    comment.author
                                )
                            }

                        </div>


                        <div class="comment-text">

                            ${
                                escapeHTML(
                                    comment.text
                                )
                            }

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}


/* ================================================
   LIKE
================================================ */

function toggleLike(
    postId
) {

    const post =
        posts.find(
            function(item) {

                return String(item.id) ===
                    String(postId);

            }
        );


    if (!post) {
        return;
    }


    const index =
        post.likes.indexOf(
            userData.email
        );


    if (index === -1) {

        post.likes.push(
            userData.email
        );


        /* ======================================
           NOTIFICATION
        ====================================== */

        if (
            post.authorEmail !==
            userData.email
        ) {

            createNotificationForUser(
                post.authorEmail,
                {
                    type: "social",
                    title: "Someone liked your post",
                    message:
                        userData.fullName +
                        " liked your post.",
                    icon: "❤️"
                }
            );

        }

    } else {

        post.likes.splice(
            index,
            1
        );

    }


    savePosts();

    renderPosts();

}


/* ================================================
   COMMENTS
================================================ */

function addComment(
    postId
) {

    const input =
        document.getElementById(
            `comment-${postId}`
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    const post =
        posts.find(
            function(item) {

                return String(item.id) ===
                    String(postId);

            }
        );


    if (!post) {
        return;
    }


    post.comments.push({

        id:
            Date.now() +
            Math.random(),

        author:
            userData.fullName ||
            "Gene-rations Member",

        authorEmail:
            userData.email,

        text:
            text,

        createdAt:
            new Date().toISOString()

    });


    savePosts();


    /* ======================================
       NOTIFICATION
    ====================================== */

    if (
        post.authorEmail !==
        userData.email
    ) {

        createNotificationForUser(
            post.authorEmail,
            {
                type: "social",
                title: "New comment",
                message:
                    userData.fullName +
                    " commented on your post.",
                icon: "💬"
            }
        );

    }


    renderPosts();


    setTimeout(
        function() {

            const comments =
                document.getElementById(
                    `comments-${postId}`
                );


            if (comments) {

                comments.style.display =
                    "block";

            }

        },
        0
    );

}


/* ================================================
   SHOW COMMENTS
================================================ */

function toggleComments(
    postId
) {

    const comments =
        document.getElementById(
            `comments-${postId}`
        );


    if (!comments) {
        return;
    }


    if (
        comments.style.display ===
        "block"
    ) {

        comments.style.display =
            "none";

    } else {

        comments.style.display =
            "block";

    }

}


/* ================================================
   DELETE POST
================================================ */

function deletePost(
    postId
) {

    const post =
        posts.find(
            function(item) {

                return String(item.id) ===
                    String(postId);

            }
        );


    if (!post) {
        return;
    }


    if (
        post.authorEmail !==
        userData.email
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Delete this post?"
        );


    if (!confirmed) {
        return;
    }


    posts =
        posts.filter(
            function(item) {

                return String(item.id) !==
                    String(postId);

            }
        );


    savePosts();


    /* ======================================
       REMOVE FROM USER POSTS
    ====================================== */

    if (
        Array.isArray(
            userData.posts
        )
    ) {

        userData.posts =
            userData.posts.filter(
                function(id) {

                    return String(id) !==
                        String(postId);

                }
            );

    }


    localStorage.setItem(
        "userData",
        JSON.stringify(
            userData
        )
    );


    renderPosts();

}


/* ================================================
   NOTIFICATION CREATOR
================================================ */

function createNotificationForUser(
    targetEmail,
    data
) {

    const key =
        "geneRationsNotifications";


    let notifications =
        JSON.parse(
            localStorage.getItem(
                key
            )
        );


    if (!Array.isArray(notifications)) {

        notifications = [];

    }


    notifications.unshift({

        id:
            Date.now() +
            Math.random(),

        userEmail:
            targetEmail,

        type:
            data.type ||
            "social",

        title:
            data.title ||
            "Gene-rations Update",

        message:
            data.message ||
            "",

        icon:
            data.icon ||
            "🔔",

        createdAt:
            new Date().toISOString(),

        read:
            false

    });


    localStorage.setItem(
        key,
        JSON.stringify(
            notifications
        )
    );

}


/* ================================================
   TIME
================================================ */

function formatTime(
    dateString
) {

    const date =
        new Date(
            dateString
        );


    const now =
        new Date();


    const seconds =
        Math.floor(
            (
                now - date
            ) / 1000
        );


    if (seconds < 60) {

        return "Just now";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    if (minutes < 60) {

        return minutes +
            "m ago";

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if (hours < 24) {

        return hours +
            "h ago";

    }


    const days =
        Math.floor(
            hours / 24
        );


    if (days < 7) {

        return days +
            "d ago";

    }


    return date.toLocaleDateString();

}


/* ================================================
   ESCAPE HTML
================================================ */

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
