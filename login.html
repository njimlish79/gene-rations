<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gene-rations | Log In</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #3958f3;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;

            background: #ffffff;

            padding: 32px;

            border-radius: 20px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);
        }

        /* ==============================
           LOGO
        ============================== */

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: bold;

            color: #1877f2;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            font-size: 16px;

            margin-bottom: 30px;
        }

        /* ==============================
           FORM
        ============================== */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 15px;

            font-weight: 600;

            color: #333;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: border 0.2s;
        }

        input:focus {
            border-color: #1877f2;
        }

        /* ==============================
           PASSWORD
        ============================== */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #1877f2;

            font-weight: bold;

            cursor: pointer;

            font-size: 14px;
        }

        /* ==============================
           FORGOT PASSWORD
        ============================== */

        .forgot-password {
            text-align: right;

            margin-top: -8px;

            margin-bottom: 22px;
        }

        .forgot-password a {
            color: #1877f2;

            text-decoration: none;

            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* ==============================
           LOGIN BUTTON
        ============================== */

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #1877f2;

            color: #ffffff;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }

        .login-button:hover {
            background: #0d65d9;
        }

        /* ==============================
           MESSAGE
        ============================== */

        .message {
            text-align: center;

            margin-top: 16px;

            font-size: 14px;

            line-height: 1.5;
        }

        .error {
            color: #d93025;
        }

        .success {
            color: #188038;
        }

        /* ==============================
           CREATE ACCOUNT
        ============================== */

        .signup-link {
            text-align: center;

            margin-top: 24px;

            color: #666;

            font-size: 14px;
        }

        .signup-link a {
            color: #1877f2;

            font-weight: bold;

            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>


<div class="login-container">


    <!-- LOGO -->

    <div class="logo">
    <img src="/images/gene-rations.png" alt="Gene-rations" style="width:300px;height:50px;">
    </div>


    <!-- SUBTITLE -->

    <p class="subtitle">
        Welcome back. Log in to your generation.
    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    id="showPassword"
                    class="show-password"
                >
                    Show
                </button>

            </div>

        </div>


        <!-- FORGOT PASSWORD -->

        <div class="forgot-password">

            <a href="forgotpassword.html">
                Forgot password?
            </a>

        </div>


        <!-- LOGIN -->

        <button
            type="submit"
            class="login-button"
        >
            Log In
        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


    </form>


    <!-- CREATE ACCOUNT -->

    <div class="signup-link">

        Don't have an account?

        <a href="signup.html">
            Create Account
        </a>

    </div>


</div>

  <script>

/* ==========================================
   ELEMENTS
========================================== */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

const message =
    document.getElementById("message");


/* ==========================================
   BACKEND
========================================== */

const API_URL =
    "http://localhost:3000";


/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

showPassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";

            this.textContent =
                "Hide";

        } else {

            passwordInput.type =
                "password";

            this.textContent =
                "Show";

        }

    }
);


/* ==========================================
   LOGIN
========================================== */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        /* ==============================
           CLEAR MESSAGE
        ============================== */

        message.textContent = "";

        message.className =
            "message";


        /* ==============================
           GET VALUES
        ============================== */

        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        /* ==============================
           VALIDATION
        ============================== */

        if (!email || !password) {

            message.textContent =
                "Please enter your email and password.";

            message.className =
                "message error";

            return;

        }


        /* ==============================
           LOADING
        ============================== */

        message.textContent =
            "Signing in...";

        message.className =
            "message";


        /* Prevent double login */
        const loginButton =
            loginForm.querySelector(
                "button[type='submit']"
            );

        if (loginButton) {

            loginButton.disabled =
                true;

        }


        try {

            /* ==============================
               SEND TO BACKEND
            ============================== */

            const response =
                await fetch(
                    `${API_URL}/api/auth/login`,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    email,

                                password:
                                    password

                            })

                    }
                );


            /* ==============================
               READ RESPONSE
            ============================== */

            const result =
                await response.json();


            /* ==============================
               LOGIN FAILED
            ============================== */

            if (!response.ok) {

                message.textContent =
                    result.message ||
                    "Login failed.";

                message.className =
                    "message error";


                if (loginButton) {

                    loginButton.disabled =
                        false;

                }

                return;

            }


            /* ==============================
               GET USER
            ============================== */

            const userData =
                result.user;


            if (!userData) {

                message.textContent =
                    "Login succeeded but user data was not returned.";

                message.className =
                    "message error";

                return;

            }


            /* ==============================
               CREATE SESSION
            ============================== */

            const loginSession = {

                loggedIn:
                    true,

                userId:
                    userData.id,

                email:
                    userData.email,

                generation:
                    userData.generation,

                loginTime:
                    new Date().toISOString()

            };


            localStorage.setItem(
                "loginSession",
                JSON.stringify(
                    loginSession
                )
            );


            /* ==============================
               SAVE USER DATA
            ============================== */

            localStorage.setItem(
                "userData",
                JSON.stringify(
                    userData
                )
            );


            /* ==============================
               SUCCESS
            ============================== */

            message.textContent =
                "Login successful. Welcome back!";

            message.className =
                "message success";


            /* ==============================
               GO TO GENERATION PAGE
            ============================== */

            setTimeout(
                function () {

                    window.location.href =
                        "generations.html";

                },
                800
            );

        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            message.textContent =
                "Unable to connect to the Gene-rations server. Make sure the backend is running.";

            message.className =
                "message error";


            if (loginButton) {

                loginButton.disabled =
                    false;

            }

        }

    }
);

      </script>
  
          </body>
          </html>
